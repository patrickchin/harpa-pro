appId: ${MAESTRO_APP_ID}
---
# pick-country-us.yaml — helper: ensure the phone-input country is US.
#
# Phones used by the regression journey (+1555000000X) are US (NANP)
# numbers, so the country prefix must be +1.
#
# When the app is built with EXPO_PUBLIC_USE_FIXTURES=true (the
# build that Maestro tests run against), `getDefaultCountry()` is
# hard-coded to return US — see apps/mobile/lib/countries.ts. That
# means we can skip the picker entirely in the common path and just
# verify the chip shows the right country via its accessibilityLabel.
#
# If we ever build/test against a non-fixture binary and need to
# actually open the picker, the fallback path below opens it and
# closes it (no selection) — which is correct only if the current
# selection is already US. iOS XCTest cannot see the picker's empty
# search TextInput, so any filter-then-select sequence is unreliable.
#
# Pre-condition: a country-picker button (matches the
#                ${COUNTRY_BUTTON_ID} env var, e.g.
#                "btn-signup-country-picker") is visible.
# Post-condition: the picker is closed and the country is US.
#
# Usage:
#   - runFlow:
#       file: ../helpers/pick-country-us.yaml
#       env:
#         COUNTRY_BUTTON_ID: "btn-signup-country-picker"
- assertVisible:
    id: "${COUNTRY_BUTTON_ID}"
# The country-picker button's accessibilityLabel is
# "Country: <name>, <dialCode>. Tap to change." — see
# components/primitives/PhoneNumberInput.tsx. We match the country
# name via accessibilityLabel which is much more reliable than the
# rendered "+1" text (where the literal "+" trips Maestro's regex
# matcher).
- assertVisible: ".*Country: United States.*"
