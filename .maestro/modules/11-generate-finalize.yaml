appId: ${MAESTRO_APP_ID}
name: '11 — Generate, finalize, and unfinalize a report'
tags:
  - regression
  - reports
  - ai
---
# Module 11 — Generate + Finalize + Unfinalize
#
# Covers:
#   - open reports list → create new report
#   - add a text note
#   - tap Generate report → wait for completion
#   - report-tab-pane is visible (report content rendered)
#   - report-view-N is accessible (proves AI generation completed)
#   - regenerate an existing report and assert the report survives the backend
#     write; disabled control states are pinned in unit tests because fixture
#     regeneration can finish before Maestro observes the transient lock
#   - report-title-N is accessible after finalize (saved-report screen)
#   - finalized Report / Review tabs render and a review comment round-trips
#   - finalize the report → saved-report screen
#   - unfinalize the report → back on generate screen
#   - re-finalize (leave finalized for module 12)
#
# Pre-condition: test on project home.
# Post-condition: test on finalized saved-report screen.

# --- Open reports list and create a new report ----------------------------
- tapOn:
    id: 'btn-open-reports'
- extendedWaitUntil:
    visible:
      id: 'btn-new-report'
    timeout: 10000
- tapOn:
    id: 'btn-new-report'
# The mutation auto-navigates to /generate on success. If the push
# races against the refetch we may stay on the list — tap into the
# new draft row to land on the generate screen.
- extendedWaitUntil:
    visible:
      id: 'report-row-.*'
    timeout: 15000
- tapOn:
    id: 'report-row-.*'
- extendedWaitUntil:
    visible:
      id: 'input-note'
    timeout: 15000

# Do NOT hard-code the report number here. `app.reports.number` is
# assigned from `app.projects.next_report_number`, a monotonic
# per-project counter that never decrements on delete — so after
# modules 07 + 08 each create+delete a draft, this module's report
# is number 3, not 1 (see packages/api/src/services/reports.ts:228).
# All downstream selectors use the `.*` wildcard instead, because
# only one report is on screen at any point in this flow.

# --- Add a text note (required to enable Generate button) -----------------
- tapOn:
    id: 'input-note'
- inputText: 'Structural steel inspection complete. All welds within spec.'
- tapOn:
    id: 'btn-add-note'
- extendedWaitUntil:
    visible:
      id: 'note-row-.*'
    timeout: 8000

# XCTest cannot always dismiss the multiline note input with hideKeyboard.
# Tap Add while it is above the keyboard, then drag the notes list to restore
# the generate chrome before waiting for the action row.
- swipe:
    direction: DOWN
    duration: 500
- waitForAnimationToEnd

# --- Wait for the route-owned automatic generation -------------------------
# New drafts auto-generate as soon as their persisted notes arrive. Wait for
# the stable current-generation marker instead of racing its transient CTA.
- runFlow: ../helpers/wait-for-auto-regeneration.yaml
- tapOn:
    id: 'btn-tab-report'
- extendedWaitUntil:
    visible:
      id: 'report-tab-pane'
    timeout: 10000

# --- Verify report content visible ----------------------------------------
# 60s covers worst-case fixture cold-start (model replay + draft
# autosave + tab transition). Module-level fail is acceptable if this
# is exceeded — that indicates a real generation regression.
- extendedWaitUntil:
    visible:
      id: 'report-view-.*'
    timeout: 60000

# --- Regeneration settle regression coverage -------------------------------
- runFlow: ../helpers/assert-report-generation-write-lock.yaml

# --- Per-card edit modal regression coverage (PR 125) ----------------------
# Exercise every pencil-backed modal body on the generated draft before
# finalizing. This keeps the module 12 pre-condition intact while proving the
# new modal flow works on the same Android device path as the rest of the
# regression journey.
- runFlow: ../helpers/edit-report-cards.yaml

# Note: we deliberately do NOT assert on `report-summary-N` here.
# The Summary `<Text testID="report-summary-N">` in ReportView.tsx
# is gated on `report.report.meta.summary` being truthy
# (ReportView.tsx:40). The wire `reportBody` schema
# (packages/api-contract/src/schemas/reports.ts:14) has no `summary`
# field and the body→GeneratedSiteReport adapter
# (apps/mobile/lib/report-body-adapter.ts:80) hard-codes
# `meta.summary = ''`. So the Summary card is never rendered in this
# flow — confirmed by the failure-moment a11y dump (report-view-3
# present, report-summary-3 absent; only IssuesCard/WorkersCard text
# leaves visible). `report-view-.*` already proves the report
# rendered; `btn-finalize-report` below lives in the persistent
# GenerateReportActionRow above the tab bar (it never needs scrolling
# into view).

# Title testID `report-title-N` is only emitted by ReportDetailHeader
# (see ReportDetailHeader.tsx:45), which renders on the *saved-report*
# screen after finalize — not on the generate screen. Defer this
# assertion until after the finalize tap below.

# --- Finalize the report ---------------------------------------------------
- tapOn:
    id: 'btn-finalize-report'
- extendedWaitUntil:
    visible:
      id: 'confirm-finalize'
    timeout: 8000
- tapOn:
    id: 'confirm-finalize'
- extendedWaitUntil:
    visible:
      id: 'btn-report-actions'
    timeout: 20000

# Now on saved-report screen — ReportDetailHeader emits the title testID.
- assertVisible:
    id: 'report-title-.*'
- assertVisible:
    id: 'report-header-controls'
- assertVisible:
    id: 'saved-report-pane'
- assertVisible:
    id: 'btn-tab-report'
- assertVisible:
    id: 'btn-tab-review'
- assertNotVisible:
    id: 'btn-tab-notes'
- assertNotVisible:
    id: 'btn-tab-edit'
- assertNotVisible:
    id: 'btn-edit-meta'

# --- Add a published-report review comment -------------------------------
- tapOn:
    id: 'btn-tab-review'
- extendedWaitUntil:
    visible:
      id: 'input-report-review-comment'
    timeout: 10000
- tapOn:
    id: 'input-report-review-comment'
- inputText: 'Reviewed on device. Delivery count confirmed.'
# On iOS the software keyboard covers the submit button. Maestro can still
# resolve the obscured accessibility node, but tapping its coordinates lands
# on a keyboard suggestion instead of the button.
- hideKeyboard
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'btn-add-report-review-comment'
    timeout: 8000
- tapOn:
    id: 'btn-add-report-review-comment'
- extendedWaitUntil:
    visible: 'Reviewed on device. Delivery count confirmed.'
    timeout: 15000

# --- Unfinalize to confirm the round-trip ---------------------------------
- tapOn:
    id: 'btn-report-actions'
- extendedWaitUntil:
    visible:
      id: 'btn-unfinalize-report'
    timeout: 8000
- tapOn:
    id: 'btn-unfinalize-report'
- extendedWaitUntil:
    visible:
      id: 'btn-confirm-unfinalize-report'
    timeout: 8000
- tapOn:
    id: 'btn-confirm-unfinalize-report'

# Unfinalize flips status in place — it does NOT navigate. The user
# stays on the saved-report screen (apps/mobile/screens/saved-report.tsx)
# and `handleConfirmUnfinalize` in
# apps/mobile/app/(app)/projects/[project]/reports/[number]/index.tsx:189
# only fires the mutation. saved-report has no `btn-finalize-report`
# (that lives in GenerateReportActionRow on the /generate route at
# apps/mobile/components/reports/generate/GenerateReportActionRow.tsx:77).
# And ReportActionsMenu has no finalize entry either. So to re-finalize
# we have to walk back: tap header back (→ reports list), wait for the
# now-draft report row, tap it (reports/index.tsx:60 routes drafts to
# /generate), then wait for `btn-finalize-report`.
- extendedWaitUntil:
    visible:
      id: 'btn-back'
    timeout: 8000
- tapOn:
    id: 'btn-back'
- extendedWaitUntil:
    visible:
      id: 'report-row-.*'
    timeout: 15000
- tapOn:
    id: 'report-row-.*'
- extendedWaitUntil:
    visible:
      id: 'btn-finalize-report'
    timeout: 15000

# --- Re-finalize (leave finalized for module 12) ---------------------------
- tapOn:
    id: 'btn-finalize-report'
- extendedWaitUntil:
    visible:
      id: 'confirm-finalize'
    timeout: 8000
- tapOn:
    id: 'confirm-finalize'
- extendedWaitUntil:
    visible:
      id: 'btn-report-actions'
    timeout: 20000

# The review discussion is stored independently of publication state. Verify
# the original comment is still present after the report is unfinalized and
# finalized again, rather than only proving the optimistic create path.
- tapOn:
    id: 'btn-tab-review'
- extendedWaitUntil:
    visible: 'Reviewed on device. Delivery count confirmed.'
    timeout: 15000
