# Fly.io app config for @harpa/api.
# Real deployment wired in P0.10 (CI) and finalised in P4.

app = "harpa-pro-api"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Run pending migrations and seed smoke-test accounts inside a release
  # machine using the existing DATABASE_URL secret. Fly promotes the new
  # image to app machines ONLY if this exits 0 — so a broken migration or
  # broken test-account seed aborts the rollout instead of leaving prod
  # with code ahead of schema or unverifiable post-deploy journeys.
  # See docs/v4/arch-cicd-and-migrations.md.
  release_command = "sh -c 'pnpm --filter @harpa/api db:migrate && pnpm --filter @harpa/api db:migrate:admin && pnpm --filter @harpa/api db:seed-test-account'"

[env]
  NODE_ENV = "production"
  PORT = "8787"
  BACKGROUND_MAINTENANCE_ENABLED = "0"
  ADMIN_CORS_ORIGINS = "https://admin.harpapro.com"

[processes]
  app = "pnpm --filter @harpa/api exec tsx src/server.ts"
  storage-worker = "pnpm --filter @harpa/api storage:worker"

[http_service]
  processes = ["app"]
  internal_port = 8787
  force_https = true
  # `suspend` keeps the machine's memory snapshot resident so the
  # next request resumes in <500ms (vs ~3-5s for a cold boot from
  # `stop`). For now prod has no warm floor, so it can sleep fully
  # when idle and pay the resume latency on the next request.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # Temporarily allow full auto-sleep to save cost while main does not
  # need warm HA. Restore this to 2 when prod should stay hot again.
  min_machines_running = 0

  # Per-machine concurrency triggers. When a machine's in-flight
  # request count exceeds `soft_limit`, Fly wakes / starts another
  # machine (up to `fly scale count <max>` — set out-of-band, see
  # docs/v4/arch-ops.md §Scaling). At `hard_limit` Fly stops sending
  # new requests to that machine until it drains. 25/50 is sized
  # for the current node-postgres pool (max 10) plus headroom.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 25
    hard_limit = 50

# Primary readiness remains app-only: it opens the application DB and checks
# app._migrations against MIGRATIONS_REQUIRED_HEAD. Admin DB readiness is
# verified post-deploy by CI at /admin/readyz, so an admin outage cannot
# remove the otherwise healthy application API from Fly's routing pool.
[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/readyz"

[[vm]]
  processes = ["app"]
  size = "shared-cpu-1x"
  memory = "512mb"

[[vm]]
  processes = ["storage-worker"]
  size = "shared-cpu-1x"
  memory = "256mb"
