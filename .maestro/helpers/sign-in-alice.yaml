appId: ${MAESTRO_APP_ID}
---
# sign-in-alice.yaml — helper: sign in as Alice E2E (+15550000001)
#
# Accepts OTP `000000` in fake-Twilio mode (TWILIO_LIVE=0, the default in
# local dev — see packages/api/src/auth/twilio.ts). Alice must already
# exist in the database (created by module 01-auth in a prior run, or by
# running 01-auth.yaml standalone before this helper).
#
# Pre-condition: app is on the sign-in screen (input-phone visible).
# Post-condition: projects list is visible (Projects tab shown).
#
# Usage (from a module):
#   - runFlow: .maestro/helpers/sign-in-alice.yaml
- tapOn:
    id: "input-phone"
- eraseText: 50
- inputText: "+15550000001"
- tapOn:
    point: "50%,15%"
- tapOn:
    id: "btn-login-send-code"
- extendedWaitUntil:
    visible:
      id: "input-otp"
    timeout: 10000
- tapOn:
    id: "input-otp"
- inputText: "000000"
- tapOn:
    point: "50%,15%"
- tapOn:
    id: "btn-verify-code"
- extendedWaitUntil:
    visible:
      id: "btn-new-project"
    timeout: 15000
