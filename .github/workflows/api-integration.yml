name: api-integration

# Skips when no API-relevant paths changed (mobile / marketing /
# docs-only PRs). Required-check safe: a skipped job reports as
# passing for branch protection.

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.paths.outputs.api }}
      workflows: ${{ steps.paths.outputs.workflows }}
    steps:
      - uses: actions/checkout@v7
      - id: paths
        uses: ./.github/actions/changed-paths

  api-integration:
    needs: changes
    if: >-
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.workflows == 'true' ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AI_FIXTURE_MODE: replay
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-monorepo
      - run: pnpm --filter @harpa/api-contract build
      - name: Test API with 90% line coverage
        run: pnpm --filter @harpa/api test:coverage
