name: site-preview

# Build and verify apps/site for every PR. Cloudflare Git publishes the exact
# mirrored pr-N branch; human-owned same-repository PRs verify that deployment.

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'apps/site/**'
      - 'packages/api-contract/**'
      - '.github/workflows/site-preview.yml'
      - '.github/workflows/pages-preview-ref.yml'
      - 'lighthouserc.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/ci/build-cloudflare-pages.sh'
      - 'scripts/ci/verify-pages-deployment.sh'
      - 'tsconfig.base.json'

# Cancel stale builds when a PR gets a new push.
concurrency:
  group: site-preview-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PUBLIC_DASHBOARD_URL: https://pr-${{ github.event.pull_request.number }}.harpa-pro-dashboard.pages.dev
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-monorepo

      - name: Test public site
        run: pnpm --filter @harpa/site test

      - name: Lint public site
        run: pnpm --filter @harpa/site lint

      - name: Typecheck public site
        run: pnpm --filter @harpa/site typecheck

      - name: Build public site
        # This credential-free build uses Cloudflare's public test key.
        # Cloudflare Git independently builds the deployable bytes with the
        # real public site key stored in the Pages build environment.
        env:
          PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          PUBLIC_API_BASE_URL: https://api.harpapro.com
        run: pnpm --filter @harpa/site build

      - name: Verify public build excludes admin routes
        run: test ! -e apps/site/dist/admin

      - name: Install Playwright Chromium
        run: pnpm --filter @harpa/site exec playwright install --with-deps chromium

      - name: Browser-test documentation
        run: pnpm --filter @harpa/site test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: site-playwright-report
          path: |
            apps/site/playwright-report/
            apps/site/test-results/
          retention-days: 14

      - name: Lighthouse CI (perf/a11y ≥ 0.90, bp/seo ≥ 0.95)
        run: pnpm exec lhci autorun --config=./lighthouserc.json

  deployment:
    needs: verify
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      SITE_BRANCH: pr-${{ github.event.pull_request.number }}
      SITE_PREVIEW_ORIGIN: https://pr-${{ github.event.pull_request.number }}.harpa-pro.pages.dev
    steps:
      - uses: actions/checkout@v7

      - name: Verify Cloudflare Git deployment
        run: >-
          bash scripts/ci/verify-pages-deployment.sh
          --origin "$SITE_PREVIEW_ORIGIN"
          --commit "${{ github.event.pull_request.head.sha }}"
          --branch "$SITE_BRANCH"
          --redirect-path /guides/getting-started
          --redirect-suffix /docs/guides/getting-started
