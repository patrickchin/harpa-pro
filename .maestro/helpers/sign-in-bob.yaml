# sign-in-bob.yaml — helper: sign in as Bob E2E (+15550000002)
#
# Accepts OTP `000000` in fake-Twilio mode (TWILIO_LIVE=0, the default
# in local dev). Bob must already exist in the database (created by an
# earlier sign-up step in the journey).
#
# Pre-condition: app is on the sign-in screen (input-phone visible).
# Post-condition: projects list is visible.
#
# Usage:
#   - runFlow: .maestro/helpers/sign-in-bob.yaml
- tapOn:
    id: "input-phone"
- clearText
- inputText: "+15550000002"
- tapOn:
    point: "50%,15%"
- tapOn:
    id: "btn-login-send-code"
- extendedWaitUntil:
    visible:
      id: "input-otp"
    timeout: 10000
- tapOn:
    id: "input-otp"
- inputText: "000000"
- tapOn:
    point: "50%,15%"
- tapOn:
    id: "btn-verify-code"
- extendedWaitUntil:
    visible:
      id: "btn-new-project"
    timeout: 15000
