appId: ${MAESTRO_APP_ID}
name: "01 — Auth: sign-up alice + sign-in alice"
tags:
  - regression
  - auth
---
# Module 01 — Auth
#
# Covers:
#   - fresh sign-up via deep link (harpa://sign-up/phone)
#   - onboarding form (name + company)
#   - sign-out
#   - sign-in (sign-in screen, not sign-up)
#
# Pre-condition: app just cold-launched with clearState + clearKeychain.
# Post-condition: alice is signed in, projects list visible.

# Cold launch with clean state
- launchApp:
    clearState: true
    clearKeychain: true
    stopApp: true
- waitForAnimationToEnd

# Android dev-client unstuck prelude: after `clearState: true`, Android
# lands on the dev-launcher picker, not the JS app. Deep-link the
# dev-launcher's own scheme with an explicit Metro URL. See
# `core-end-to-end.yaml` for the full explanation.
- openLink: "exp+harpa-pro-v4://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
- waitForAnimationToEnd:
    timeout: 20000

# The Android dev-launcher first-run sheet ("This is the developer menu")
# overlays the sign-in screen and obscures `input-phone`. The sheet
# appears asynchronously after the bundle loads, so we explicitly wait
# for its primary "Continue" button before dismissing it. On iOS (and on
# subsequent Android runs after the sheet has been dismissed once) the
# sheet never appears and the optional block skips.
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn:
          text: "Continue"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Close"
    commands:
      # The dev menu sheet's "Tools button" toggle controls a floating
      # gear-icon overlay that sits in the top-right of every screen and
      # intercepts taps meant for `btn-open-profile` in the screen header.
      # Toggle it OFF here so subsequent profile-tab navigation works.
      # The toggle's Switch sits at the right edge of the "Tools button"
      # row.
      - runFlow:
          when:
            visible: "Tools button"
          commands:
            - tapOn:
                text: "Tools button"
            - waitForAnimationToEnd
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd

# Land on sign-in first (auth gate) then deep-link to sign-up
- extendedWaitUntil:
    visible:
      id: "input-phone"
    timeout: 30000

# --- Sign-up alice (fresh account via seed) --------------------------------
- openLink: harpa://sign-up/phone
- extendedWaitUntil:
    visible:
      id: "input-signup-phone"
    timeout: 15000
- tapOn:
    id: "input-signup-phone"
- inputText: "+15550000001"
- tapOn:
    point: "50%,15%"
- tapOn:
    id: "btn-signup-send-code"
- extendedWaitUntil:
    visible:
      id: "input-signup-otp"
    timeout: 10000
- tapOn:
    id: "input-signup-otp"
- inputText: "000000"
- tapOn:
    point: "50%,15%"
- tapOn:
    id: "btn-signup-verify"

# --- Onboarding (always shown after fresh sign-up) -------------------------
- extendedWaitUntil:
    visible:
      id: "screen-onboarding"
    timeout: 15000
- tapOn:
    id: "input-onboarding-name"
- inputText: "Alice E2E"
- tapOn:
    id: "input-onboarding-company"
- inputText: "E2E Corp"
- tapOn:
    point: "50%,15%"
- tapOn:
    id: "btn-onboarding-submit"

# --- Verify projects list ---------------------------------------------------
- extendedWaitUntil:
    visible:
      id: "btn-new-project"
    timeout: 15000

# --- Sign-out ---------------------------------------------------------------
- runFlow: ../helpers/sign-out.yaml

# --- Sign-in (round-trip) --------------------------------------------------
- runFlow: ../helpers/sign-in-alice.yaml
- assertVisible:
    id: "btn-new-project"
