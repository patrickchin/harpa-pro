appId: ${MAESTRO_APP_ID}
---
# sign-out.yaml — helper: sign the current user out
#
# Navigates to Profile tab → Developer section sign-out button,
# then waits for the sign-in screen.
#
# Pre-condition: app is logged in (Projects list or any (app) tab visible).
# Post-condition: sign-in screen (input-email visible).
#
# Usage:
#   - runFlow: .maestro/helpers/sign-out.yaml
- tapOn:
    id: "btn-open-profile"
- waitForAnimationToEnd:
    timeout: 1000
# iOS XCTest can report the header icon tap as complete while the app remains
# on Projects. Retry once if the profile icon is still visible.
- runFlow:
    when:
      visible:
        id: "btn-open-profile"
    commands:
      - tapOn:
          id: "btn-open-profile"
      - waitForAnimationToEnd:
          timeout: 1000
- extendedWaitUntil:
    visible:
      id: "screen-profile"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "btn-sign-out"
    timeout: 10000
- tapOn:
    id: "btn-sign-out"
- extendedWaitUntil:
    visible:
      id: "input-email"
    timeout: 10000
