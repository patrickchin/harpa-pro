appId: ${MAESTRO_APP_ID}
---
# Required env: ACTION_ID
#
# AppDialogSheet uses a React Native Modal. Android exposes its action IDs;
# Xcode 27 / iOS 26.5 can omit the whole Modal window from XCTest. All current
# two-action confirmation sheets anchor their full-width action row here.
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            id: '${ACTION_ID}'
          timeout: 8000
      - tapOn:
          id: '${ACTION_ID}'

- runFlow:
    when:
      platform: iOS
    commands:
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          point: '50%,85%'
          waitToSettleTimeoutMs: 3000
