appId: ${MAESTRO_APP_ID}
name: "10a — Photo notes (draft): camera → upload → image note"
tags:
  - regression
  - photo
  - upload
---
# Module 10a — Photo note draft pipeline
#
# Covers:
#   - open reports list → new report → Generate screen
#   - tap `btn-attachment` → `btn-attachment-camera` → land on
#     camera-capture route
#   - tap shutter, then Done
#   - back on Generate, timeline renders the image note (`note-row-*`)
#   - clean up the draft so the next module starts fresh
#
# Pre-condition: EXPO_PUBLIC_USE_FIXTURES=true built in (so the camera
# capture path commits a synthetic image). Camera permission must be
# granted on the sim (`xcrun simctl privacy booted grant camera <id>`).
#
# Pre-condition: alice on project home; no reports.
# Post-condition: alice on project home; no reports.

# --- Open reports list and create a new draft ------------------------------
- tapOn:
    id: "btn-open-reports"
- extendedWaitUntil:
    visible:
      id: "btn-new-report"
    timeout: 10000
- tapOn:
    id: "btn-new-report"
- extendedWaitUntil:
    visible:
      id: "report-row-.*"
    timeout: 15000
- tapOn:
    id: "report-row-.*"
- extendedWaitUntil:
    visible:
      id: "input-note"
    timeout: 15000

# --- Go straight to camera-capture via the inline Photo button ------------
# When the note input is empty, the input bar renders `btn-camera-capture`
# alongside `btn-record-start`. That handler navigates directly to the
# camera-capture screen, skipping the attachment sheet entirely (which is
# only needed for Document / Photo Library paths). Far more reliable on
# iOS sim than tapping a text label inside an animated AppDialogSheet.
- tapOn:
    id: "btn-camera-capture"

# --- Camera: shutter → done ------------------------------------------------
- extendedWaitUntil:
    visible:
      id: "btn-camera-shutter"
    timeout: 15000
- tapOn:
    id: "btn-camera-shutter"
- extendedWaitUntil:
    visible:
      id: "lbl-camera-count"
    timeout: 8000
- tapOn:
    id: "btn-camera-done"

# --- Back on Generate; timeline mounts an image note -----------------------
- extendedWaitUntil:
    visible:
      id: "note-timeline"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "note-row-.*"
    timeout: 30000

# --- Clean up: delete the draft and return to project home -----------------
- tapOn:
    id: "btn-draft-options"
- extendedWaitUntil:
    visible:
      id: "dialog-action-confirm-delete-draft"
    timeout: 8000
- tapOn:
    id: "dialog-action-confirm-delete-draft"
- extendedWaitUntil:
    visible:
      id: "btn-new-report"
    timeout: 15000
# After dismissOrReplaceTo from delete-draft, tapping btn-back on
# reports-list can collapse the stack all the way to the projects
# index instead of landing on project-home (router stack quirk —
# observed in three overnight attempts). The robust recovery is to
# tap the project row from the projects index, which always lands
# on project-home with btn-project-edit visible.
- tapOn:
    id: "btn-back"
- extendedWaitUntil:
    visible: ".*Regression Test Project.*"
    timeout: 10000
- runFlow:
    when:
      visible:
        id: "btn-new-project"
    commands:
      - tapOn: "Regression Test Project \\(Edited\\)"
- extendedWaitUntil:
    visible:
      id: "btn-project-edit"
    timeout: 10000
