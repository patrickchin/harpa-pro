name: ai-live
# Live-LLM regression lane. Hits real OpenAI (and any other provider
# wired into the report path) to catch prompt/schema drift that
# fixtures cannot detect — see docs/v4/pitfalls.md Pitfall 13 and
# the entry in docs/bugs/README.md.
#
# Triggers:
#   - workflow_dispatch  → manual button (zero cost when idle).
#   - push to dev/main   → only when files that affect the live
#                          path change (prompts, services/ai.ts,
#                          contract schemas, provider adapters,
#                          recorded fixtures).
#   - PR                 → only when the same path-filter matches.
#                          Fork PRs are skipped because they cannot
#                          access secrets.
#
# Cost: ~3 short gpt-4o calls per run.

on:
  workflow_dispatch:
  push:
    branches: [dev, main]
    paths:
      - 'packages/api/src/prompts/**'
      - 'packages/api/src/services/ai.ts'
      - 'packages/api-contract/src/schemas/reports.ts'
      - 'packages/ai-fixtures/src/providers/**'
      - 'packages/ai-fixtures/fixtures/generate-report.*.json'
      - '.github/workflows/ai-live.yml'
  pull_request:
    paths:
      - 'packages/api/src/prompts/**'
      - 'packages/api/src/services/ai.ts'
      - 'packages/api-contract/src/schemas/reports.ts'
      - 'packages/ai-fixtures/src/providers/**'
      - 'packages/ai-fixtures/fixtures/generate-report.*.json'
      - '.github/workflows/ai-live.yml'

concurrency:
  group: ai-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    # Fork PRs cannot access secrets; skip rather than fail loudly.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AI_LIVE: '1'
      AI_FIXTURE_MODE: live
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.3 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @harpa/api-contract build

      # Provider keys live in Doppler (config `dev`), not GH secrets.
      # Same pattern as api-dev.yml.
      - uses: dopplerhq/cli-action@v3
      - name: Resolve provider keys from Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_DEV }}
        run: |
          set -euo pipefail
          OPENAI_API_KEY=$(doppler secrets get OPENAI_API_KEY --plain)
          GROQ_API_KEY=$(doppler secrets get GROQ_API_KEY --plain 2>/dev/null || echo "")
          if [ -z "$OPENAI_API_KEY" ] || [ "$OPENAI_API_KEY" = "null" ]; then
            echo "::error::OPENAI_API_KEY not found in Doppler 'dev' config."
            exit 1
          fi
          # Mask before exporting so the value can't leak into later logs.
          echo "::add-mask::$OPENAI_API_KEY"
          [ -n "$GROQ_API_KEY" ] && echo "::add-mask::$GROQ_API_KEY"
          echo "OPENAI_API_KEY=$OPENAI_API_KEY" >> "$GITHUB_ENV"
          echo "GROQ_API_KEY=$GROQ_API_KEY" >> "$GITHUB_ENV"

      - name: Run live-LLM tests against real OpenAI
        run: pnpm --filter @harpa/api test:live

