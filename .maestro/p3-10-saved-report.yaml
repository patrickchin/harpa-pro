appId: com.harpa.pro
name: P3.10 / P3.15.3 — Saved report timeline + photos + unfinalize (dev mirror)
tags:
  - p3
  - saved-report
# Uses the (dev)/saved-report mirror because the real
# `app/(app)/projects/[project]/reports/[number]/index.tsx` route
# requires sign-in → project → finalized-report navigation, none of
# which Maestro can drive deterministically in CI. The mirror exposes
# every visible state (loading / error / draft / finalized) via a
# top-bar toggle and pre-seeds the four note kinds + a `ReportPhotos`
# block so the rich timeline + signed-URL preview path can be
# eyeballed without a real API.
---
- launchApp:
    clearState: true
    clearKeychain: true
    stopApp: true
- waitForAnimationToEnd
- openLink: harpa://dev/saved-report
- assertVisible:
    id: "saved-report-pane"
- assertVisible:
    id: "btn-tab-report"
- assertVisible:
    id: "btn-tab-notes"

# Report tab — assert ReportPhotos block renders with at least one
# photo affordance from the seeded notes.
- assertVisible:
    id: "report-photos"
- assertVisible:
    id: "btn-report-photo-note-photo-1"

# Switch to the Notes tab and assert each note kind renders.
- tapOn:
    id: "btn-tab-notes"
- assertVisible:
    id: "report-notes-pane"
- assertVisible:
    id: "report-note-note-text-1"
- assertVisible:
    id: "report-note-note-voice-1"
- assertVisible:
    id: "report-note-note-photo-1"
- assertVisible:
    id: "report-note-note-document-1"
- assertVisible:
    id: "btn-open-photo-note-photo-1"
- assertVisible:
    id: "voice-transcript-note-voice-1"

# Flip to finalized — the unfinalize confirm dialog testID becomes
# reachable via the actions menu. The dialog itself opens in a native
# Modal which has tap-flake on iOS XCTest 26.5 + RN 0.75
# (see docs/v4/pitfalls.md) — assertVisible only.
- tapOn: "finalized"
- assertVisible:
    id: "saved-report-pane"
