name: admin-dev

# Cloudflare Git publishes the admin dev branch. GitHub verifies the stable
# alias and exact commit without Cloudflare credentials.

on:
  push:
    branches: [dev]
    paths:
      - 'apps/admin/**'
      - 'packages/api-contract/**'
      - 'scripts/ci/build-cloudflare-pages.sh'
      - 'scripts/ci/verify-pages-deployment.sh'
      - '.github/workflows/admin-dev.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
  workflow_dispatch: {}

concurrency:
  group: admin-dev
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'push' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify Cloudflare Git deployment
        run: >-
          bash scripts/ci/verify-pages-deployment.sh
          --origin https://dev.harpa-pro-admin.pages.dev
          --commit "${{ github.sha }}"
          --branch dev
          --title 'Business activity — Harpa Pro Admin'
          --missing-route /__missing_admin_route__
