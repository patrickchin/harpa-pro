name: Detect changed paths
description: >
  Compute boolean outputs for each top-level area of the monorepo
  (api, mobile, site, admin, dashboard, cli, etc.) so heavy CI jobs can
  short-circuit on PRs that don't touch their code. Required-check
  jobs gate downstream steps on these outputs instead of using
  workflow-level `paths:` filters (which would report the workflow as
  missing and block branch protection).

  Outputs are strings 'true' or 'false'. The `any-code` output is true
  iff anything under apps/, packages/, scripts/, infra/, or root
  config files changed.
outputs:
  any-code:
    description: True if any code/infra/config path changed.
    value: ${{ steps.filter.outputs.any-code }}
  api:
    description: True if @harpa/api or its inputs changed.
    value: ${{ steps.filter.outputs.api }}
  api-contract:
    description: True if @harpa/api-contract changed.
    value: ${{ steps.filter.outputs.api-contract }}
  ai-fixtures:
    description: True if @harpa/ai-fixtures changed.
    value: ${{ steps.filter.outputs.ai-fixtures }}
  api-migrations:
    description: True if packages/api migrations or schema changed.
    value: ${{ steps.filter.outputs.api-migrations }}
  mobile:
    description: True if apps/mobile, Maestro E2E flows, or the launch runner changed.
    value: ${{ steps.filter.outputs.mobile }}
  site:
    description: True if apps/site changed.
    value: ${{ steps.filter.outputs.site }}
  admin:
    description: True if the standalone admin site or its preview wiring changed.
    value: ${{ steps.filter.outputs.admin }}
  dashboard:
    description: True if the office dashboard or its preview wiring changed.
    value: ${{ steps.filter.outputs.dashboard }}
  cli:
    description: True if apps/cli changed.
    value: ${{ steps.filter.outputs.cli }}
  workflows:
    description: True if any CI workflow / composite action changed.
    value: ${{ steps.filter.outputs.workflows }}
runs:
  using: composite
  steps:
    - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
      id: filter
      with:
        filters: |
          any-code:
            - 'apps/**'
            - 'packages/**'
            - 'scripts/**'
            - 'infra/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
            - 'turbo.json'
            - 'tsconfig*.json'
            - '.github/dependabot.yml'
            - '.github/workflows/**'
            - '.github/actions/**'
          api:
            - 'packages/api/**'
            - 'packages/api-contract/**'
            - 'packages/ai-fixtures/**'
            - 'pnpm-lock.yaml'
            - 'tsconfig*.json'
          api-contract:
            - 'packages/api-contract/**'
          ai-fixtures:
            - 'packages/ai-fixtures/**'
          api-migrations:
            - 'packages/api/migrations/**'
            - 'packages/api/admin-migrations/**'
            - 'packages/api/src/db/**'
          mobile:
            - '.maestro/**'
            - 'scripts/ci/run-maestro-launch-smoke.sh'
            - 'scripts/maestro/prepare-android-emulator.sh'
            - 'scripts/ci/__tests__/prepare-android-emulator.test.sh'
            - 'apps/mobile/**'
            - 'packages/api-contract/**'
            - 'pnpm-lock.yaml'
          site:
            - 'apps/site/**'
          admin:
            - 'apps/admin/**'
            - 'packages/api-contract/**'
            - '.github/actions/changed-paths/**'
            - '.github/actions/setup-monorepo/**'
            - '.github/workflows/admin-*.yml'
            - '.github/workflows/pr-preview.yml'
            - 'infra/fly/fly.preview.toml'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
            - 'tsconfig.base.json'
          dashboard:
            - 'apps/dashboard/**'
            - 'packages/api-contract/**'
            - 'packages/design-tokens/**'
            - '.github/actions/changed-paths/**'
            - '.github/actions/setup-monorepo/**'
            - '.github/workflows/dashboard-*.yml'
            - '.github/workflows/pages-preview-ref.yml'
            - '.github/workflows/pr-preview.yml'
            - 'infra/fly/fly.preview.toml'
            - 'scripts/ci/build-cloudflare-pages.sh'
            - 'scripts/ci/verify-pages-deployment.sh'
            - 'scripts/ci/verify-dashboard-pages.sh'
            - 'scripts/ci/__tests__/cloudflare-pages-build.test.sh'
            - 'scripts/ci/__tests__/cloudflare-pages-git-policy.test.sh'
            - 'scripts/ci/__tests__/dashboard-*.test.sh'
            - 'scripts/ci/__tests__/verify-pages-deployment.test.sh'
            - 'scripts/ci/__tests__/verify-dashboard-pages.test.sh'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
            - 'turbo.json'
            - 'tsconfig*.json'
          cli:
            - 'apps/cli/**'
            - 'packages/api-contract/**'
            - 'packages/api/**'
          workflows:
            - '.github/workflows/**'
            - '.github/actions/**'
