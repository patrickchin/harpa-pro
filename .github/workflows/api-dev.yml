name: api-dev

# Build + deploy @harpa/api to Fly.io (harpa-pro-api-dev) on every
# push to `dev`. Mirrors api-prod.yml but targets the dev app, and
# applies pending Drizzle migrations to the long-lived Neon `dev`
# branch before the Fly deploy goes out.
#
# One-time setup:
#   flyctl apps create harpa-pro-api-dev
#   pnpm db:branch:ensure dev                      # creates the Neon branch
#   flyctl secrets set DATABASE_URL=<uri> \
#     BETTER_AUTH_SECRET=... \
#     WAITLIST_CORS_ORIGINS=https://dev.harpa-pro.pages.dev \
#     ... --app harpa-pro-api-dev
# The same FLY_API_TOKEN secret covers both apps.

on:
  push:
    branches: [dev]
    paths:
      - "packages/api/**"
      - "packages/api-contract/**"
      - "packages/ai-fixtures/**"
      - "infra/fly/**"
      - "infra/neon/**"
      - ".github/workflows/api-dev.yml"
      - "pnpm-lock.yaml"
  # Allow manual re-deploys (e.g. rotating secrets without a code change).
  workflow_dispatch: {}

concurrency:
  group: api-dev
  cancel-in-progress: true # ok to cancel stale dev deploys

jobs:
  dev:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 9.12.3 }

      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }

      - run: pnpm install --frozen-lockfile

      - name: Ensure Neon `dev` branch
        # Idempotent: returns the existing URI or creates the branch on
        # first run. Critical that this NOT recreate on every deploy —
        # `dev` is long-lived and holds seed data that R2 objects refer to.
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          URI=$(pnpm --silent db:branch:ensure dev)
          echo "::add-mask::$URI"
          echo "DATABASE_URL=$URI" >> "$GITHUB_ENV"

      - name: Apply pending migrations to Neon `dev`
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm --filter @harpa/api db:migrate

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io (dev)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: >-
          flyctl deploy
          --config infra/fly/fly.dev.toml
          --dockerfile infra/fly/Dockerfile
          --remote-only

