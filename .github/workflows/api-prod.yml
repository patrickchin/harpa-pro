name: api-prod

# Build + deploy @harpa/api to Fly.io on every push to `main`
# (the default branch — see AGENTS.md hard rule #7). Manual deploys
# can still be run via `./infra/fly/deploy.sh`.

on:
  push:
    branches: [main]
    paths:
      - "packages/api/**"
      - "packages/api-contract/**"
      - "packages/ai-fixtures/**"
      - "infra/fly/**"
      - ".github/workflows/api-prod.yml"
      - "pnpm-lock.yaml"
  # Allow manual re-deploys (e.g. rotating secrets without a code change).
  workflow_dispatch: {}

concurrency:
  group: api-prod
  cancel-in-progress: false # never cancel a prod deploy

jobs:
  prod:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 9.12.3 }

      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }

      - run: pnpm install --frozen-lockfile

      - uses: dopplerhq/cli-action@v3

      - name: Resolve prod DATABASE_URL from Doppler
        # Prod runs against a long-lived Neon branch (not a per-PR
        # ensure flow — see api-dev.yml). The connection string is
        # stored in Doppler `prd`; pull it here so the migrate step
        # below targets prod instead of inheriting whatever local env
        # the runner had.
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD }}
        run: |
          URI=$(doppler secrets get DATABASE_URL --plain)
          echo "::add-mask::$URI"
          echo "DATABASE_URL=$URI" >> "$GITHUB_ENV"

      - name: Apply pending migrations to Neon prod
        # Must run BEFORE the Fly deploy: a release that depends on a
        # schema change shipped with the same PR (e.g. P3.15.5
        # `llm_usage_events`) would 500 on startup if the migration
        # hasn't landed. Pitfall 11.
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm --filter @harpa/api db:migrate

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Sync Fly secrets from Doppler
        # See api-dev.yml for rationale. `--stage` defers activation;
        # the subsequent deploy is what flips them on.
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          doppler secrets download --no-file --format env \
            | grep -vE '^(DOPPLER_|NEON_|FLY_|CLOUDFLARE_|PUBLIC_|EXPO_PUBLIC_|PAGES_PROJECT|PORT|NODE_ENV|ADMIN_EMAIL)' \
            | flyctl secrets import --stage --app harpa-pro-api

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: ./infra/fly/deploy.sh --remote-only
