name: neon-snapshot-prune

# Delete `snapshot-<sha>` branches older than KEEP_DAYS and retain at most
# MAX_SNAPSHOTS per project. With main + dev, a cap of three reserves at
# least five of the ten Free-plan branch slots for concurrent PR previews.
#
# See docs/v4/arch-cicd-and-migrations.md §Failure & rollback playbook.

on:
  schedule:
    - cron: '17 4 * * *' # 04:17 UTC daily
  workflow_dispatch: {}

concurrency:
  group: neon-snapshot-prune
  cancel-in-progress: false

env:
  KEEP_DAYS: '30'
  MAX_SNAPSHOTS: '3'

jobs:
  prune:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-monorepo
      - name: Prune stale app snapshots
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: pnpm db:branch:prune-snapshots "$KEEP_DAYS" "$MAX_SNAPSHOTS"

      - name: Prune stale admin snapshots
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_ADMIN_PROJECT_ID }}
        run: pnpm db:branch:prune-snapshots "$KEEP_DAYS" "$MAX_SNAPSHOTS"
