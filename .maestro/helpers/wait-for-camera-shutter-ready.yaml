appId: ${MAESTRO_APP_ID}
---
# CameraCapture renders the shutter face's ready-only test ID after native
# picture-size discovery is stable. On Android that means CameraX has reopened
# after applying the selected picture size; during a burst it also proves the
# prior capture has left the in-flight state. The marker is necessary because
# iOS XCTest does not export React Native Pressable's enabled state.

- extendedWaitUntil:
    visible:
      id: 'camera-shutter-ready'
    timeout: 30000
