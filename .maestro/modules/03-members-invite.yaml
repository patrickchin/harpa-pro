appId: ${MAESTRO_APP_ID}
name: "03 — Members: test invites test2 as editor"
tags:
  - regression
  - members
---
# Module 03 — Members invite
#
# Covers:
#   - test opens members screen
#   - shows add-member form
#   - invites test2@harpapro.com (test2) as editor
#   - test2's member row appears (member-row-* pattern)
#
# Pre-condition: test is on project home (btn-project-edit visible).
# Post-condition: test is back on project home.
#
# Note on member user IDs: Maestro can match element IDs by regex
# (`id: "member-row-.*"`) so we don't need to extract the raw userId.
# Modules 05-06 use `id: "btn-remove-member-.*"` etc. to target the
# first (and only) non-owner member.

# --- Navigate to members ---------------------------------------------------
- tapOn:
    id: "link-project-members"
- extendedWaitUntil:
    visible:
      id: "btn-show-add-member"
    timeout: 10000

# --- Open add-member form ---------------------------------------------------
- tapOn:
    id: "btn-show-add-member"
- extendedWaitUntil:
    visible:
      id: "input-member-email"
    timeout: 8000

# --- Enter test2's email + select editor role --------------------------------
- tapOn:
    id: "input-member-email"
- inputText: "test2@harpapro.com"
- hideKeyboard
- tapOn:
    id: "picker-member-role-editor"
- tapOn:
    id: "btn-add-member"

# --- Confirm test2 appears in the member list --------------------------------
- extendedWaitUntil:
    visible:
      id: "member-row-.*"
    timeout: 10000

# --- Go back to project home -----------------------------------------------
- tapOn:
    id: "btn-back"
- extendedWaitUntil:
    visible:
      id: "btn-project-edit"
    timeout: 10000
