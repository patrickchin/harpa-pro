name: mobile-ota-pr

# Push an OTA update to the `development` EAS channel on every PR
# push (open / new commits / reopen) so devices with a `development`
# native build can pick up the PR's JS bundle on next launch.
#
# Only runs for PRs opened from branches in this repository — PRs
# from forks are skipped because they cannot access EXPO_TOKEN and
# we don't want to publish untrusted code to our `development`
# channel.
#
# Requires:
#   - EXPO_TOKEN repo secret (EAS access token with publish scope)

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "apps/mobile/**"
      - "packages/api-contract/**"
      - ".github/workflows/mobile-ota-pr.yml"
      - "pnpm-lock.yaml"

# Keyed per-PR. New pushes cancel any in-flight OTA for that PR, and
# the `closed` event below joins the same group so merging / closing
# the PR also cancels the in-flight run.
concurrency:
  group: mobile-ota-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ota:
    name: EAS Update (development)
    # Skip PRs from forked repositories — they can't access secrets
    # and we don't auto-publish untrusted code.
    # Skip the `closed` event — that run exists only to join the
    # concurrency group and cancel any in-flight publish.
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: ./.github/actions/setup-monorepo
        with:
          node-version: '20'

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Push OTA update to development channel
        working-directory: apps/mobile
        # `EXPO_PUBLIC_API_URL` is inlined into the JS bundle by Metro at
        # `eas update` time, so each PR's bundle is hardcoded to its own
        # Fly preview API (`harpa-pro-api-pr-<n>.fly.dev`, deployed by
        # pr-preview.yml). The `development` EAS branch holds only the
        # most recent PR push — engineers select older PR bundles via
        # the dev-client launcher (Updates → development → pick).
        #
        # IMPORTANT: do NOT pass `--environment development` here.
        # That flag pulls EAS-managed env vars (including a fixed
        # EXPO_PUBLIC_API_URL pointing at the shared dev Fly app) and
        # those values *override* the shell env vars below — silently
        # baking the dev API URL into every PR's bundle. We rely on
        # workflow-level env only so each PR talks to its own preview
        # backend. Sentry source-map upload is skipped on PR OTAs by
        # design (these are ephemeral test bundles).
        env:
          EXPO_PUBLIC_API_URL: https://harpa-pro-api-pr-${{ github.event.pull_request.number }}.fly.dev
          EXPO_PUBLIC_PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPO_PUBLIC_APP_VARIANT: development
          EXPO_PUBLIC_USE_FIXTURES: "false"
        run: |
          eas update \
            --channel development \
            --message "PR #${{ github.event.pull_request.number }} (${{ github.event.pull_request.head.ref }}) $(git rev-parse --short HEAD)" \
            --non-interactive
