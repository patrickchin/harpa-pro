appId: ${MAESTRO_APP_ID}
---
# dev-password-login.yaml - helper: sign in through the local CLI auth broker
#
# Required env vars:
#   PHONE_ENCODED - URL-encoded E.164 phone, e.g. %2B15550199001
#   NAME          - onboarding display name if the account is new
#   COMPANY       - onboarding company name if the account is new
#
# Pre-condition: signed out or clear app state.
# Post-condition: projects list is visible (btn-new-project visible).
- openLink: "harpa://e2e-password-login?phone=${PHONE_ENCODED}&broker=http%3A%2F%2F127.0.0.1%3A8790"
- runFlow:
    file: dismiss-open-dialog.yaml
- extendedWaitUntil:
    visible:
      id: "screen-onboarding|btn-new-project|e2e-password-login-error"
    timeout: 45000
- assertNotVisible:
    id: "e2e-password-login-error"
- runFlow:
    when:
      visible:
        id: "screen-onboarding"
    commands:
      - tapOn:
          id: "input-onboarding-name"
      - inputText: "${NAME}"
      - tapOn:
          id: "input-onboarding-company"
      - inputText: "${COMPANY}"
      - hideKeyboard
      - tapOn:
          id: "btn-onboarding-submit"
- extendedWaitUntil:
    visible:
      id: "btn-new-project"
    timeout: 15000
