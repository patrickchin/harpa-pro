appId: ${MAESTRO_APP_ID}
name: "01b — Auth: create bob via email-OTP"
tags:
  - regression
  - auth
---
# Module 01b — Create bob
#
# Covers:
#   - sign-out from alice
#   - first sign-in for bob (better-auth auto-creates the user on
#     verify) + onboarding
#   - sign-out
#   - sign back in as alice (ready for module 02)
#
# Rationale: bob must exist in the database BEFORE alice can invite him.
# The add_project_member_by_email service errors with `user_not_found`
# if the email has never signed in. So we sign bob in here (auto-create),
# sign him out, then resume the journey as alice.
#
# Pre-condition: alice is signed in on the projects list.
# Post-condition: alice is signed in on the projects list (state unchanged
# from caller's view; bob now exists in DB).

# --- Sign-out from alice ---------------------------------------------------
- runFlow: ../helpers/sign-out.yaml

# --- Sign-in bob (better-auth creates the account on first verify) --------
- runFlow:
    file: ../helpers/sign-in.yaml
    env:
      EMAIL: "bob@harpa.test"

# --- Onboarding for bob -----------------------------------------------------
- runFlow:
    when:
      visible:
        id: "screen-onboarding"
    commands:
      - tapOn:
          id: "input-onboarding-name"
      - inputText: "Bob E2E"
      - tapOn:
          id: "input-onboarding-company"
      - inputText: "E2E Corp"
      - hideKeyboard
      - tapOn:
          id: "btn-onboarding-submit"
- extendedWaitUntil:
    visible:
      id: "btn-new-project"
    timeout: 15000

# --- Sign-out bob ----------------------------------------------------------
- runFlow: ../helpers/sign-out.yaml

# --- Sign back in as alice (ready for module 02) ---------------------------
- runFlow:
    file: ../helpers/sign-in.yaml
    env:
      EMAIL: "alice@harpa.test"
