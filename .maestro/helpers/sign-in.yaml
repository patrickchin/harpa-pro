appId: ${MAESTRO_APP_ID}
---
# sign-in.yaml — helper: sign in via email-OTP
#
# Required env var:
#   EMAIL — the email of an existing seeded user (e.g. alice@harpa.test).
#
# Required runtime services:
#   - The fixture-mode API on http://127.0.0.1:8787, with `/api/dev/last-otp`
#     mounted (`NODE_ENV !== 'production'`).
#   - adb reverse tcp:8787 tcp:8787 for Android.
#
# Pre-condition: sign-in (email) screen is visible (`input-email`).
# Post-condition: projects list is visible (`btn-new-project`).
#
# Usage:
#   - runFlow:
#       file: ../helpers/sign-in.yaml
#       env:
#         EMAIL: "alice@harpa.test"
- tapOn:
    id: "input-email"
- eraseText: 80
- inputText: "${EMAIL}"
- hideKeyboard
- tapOn:
    id: "btn-login-send-code"
- extendedWaitUntil:
    visible:
      id: "input-otp"
    timeout: 10000
# Pull the OTP that better-auth just persisted to public.verification.
- runScript:
    file: last-otp.js
    env:
      EMAIL: "${EMAIL}"
- tapOn:
    id: "input-otp"
- inputText: "${output.OTP}"
- tapOn:
    id: "btn-verify-code"
- extendedWaitUntil:
    visible:
      id: "btn-new-project"
    timeout: 15000
