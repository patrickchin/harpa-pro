name: site-dev

# Cloudflare Git publishes the dev branch. GitHub verifies that the stable
# alias serves this exact commit; it does not hold Cloudflare credentials.

on:
  push:
    branches: [dev]
    paths:
      - 'apps/site/**'
      - 'packages/api-contract/**'
      - 'scripts/ci/build-cloudflare-pages.sh'
      - 'scripts/ci/verify-pages-deployment.sh'
      - '.github/workflows/site-dev.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
  workflow_dispatch: {}

concurrency:
  group: site-dev
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'push' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Verify Cloudflare Git deployment
        run: >-
          bash scripts/ci/verify-pages-deployment.sh
          --origin https://dev.harpa-pro.pages.dev
          --commit "${{ github.sha }}"
          --branch dev
          --redirect-path /guides/getting-started
          --redirect-suffix /docs/guides/getting-started
