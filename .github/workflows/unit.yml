name: unit
on:
  pull_request:
  push:
    branches: [dev, main]
jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      AI_FIXTURE_MODE: replay
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-monorepo
      - run: pnpm --filter @harpa/api-contract build
      - run: pnpm test
