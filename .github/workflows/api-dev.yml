name: api-dev

# Build + deploy @harpa/api to Fly.io (harpa-pro-api-dev) on every
# push to `dev`. Mirrors api-prod.yml but targets the dev app, and
# applies pending Drizzle migrations to the long-lived Neon `dev`
# branch before the Fly deploy goes out.
#
# One-time setup:
#   flyctl apps create harpa-pro-api-dev
#   pnpm db:branch:ensure dev                      # creates the Neon branch
#   doppler configs tokens create ci-github --project harpa-pro --config dev
#     → set as repo secret DOPPLER_TOKEN_DEV
# Subsequent secret changes: edit in Doppler `dev` config, push to `dev`.
# This workflow stages the synced secrets onto Fly and the `flyctl deploy`
# step activates them — secrets and code ship together.

on:
  push:
    branches: [dev]
    paths:
      - "packages/api/**"
      - "packages/api-contract/**"
      - "packages/ai-fixtures/**"
      - "infra/fly/**"
      - "infra/neon/**"
      - "scripts/journeys/**"
      - ".github/workflows/api-dev.yml"
      - "pnpm-lock.yaml"
  # Allow manual re-deploys (e.g. rotating secrets without a code change).
  workflow_dispatch: {}

concurrency:
  group: api-dev
  cancel-in-progress: true # ok to cancel stale dev deploys

jobs:
  dev:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: ./.github/actions/setup-monorepo

      - name: Ensure Neon `dev` branch
        # Idempotent: returns the existing URI or creates the branch on
        # first run. Critical that this NOT recreate on every deploy —
        # `dev` is long-lived and holds seed data that R2 objects refer to.
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          URI=$(pnpm --silent db:branch:ensure dev)
          echo "::add-mask::$URI"
          echo "DATABASE_URL=$URI" >> "$GITHUB_ENV"

      - name: Apply pending migrations to Neon `dev`
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm --filter @harpa/api db:migrate

      - uses: superfly/flyctl-actions/setup-flyctl@1.5

      - uses: dopplerhq/cli-action@v3

      - name: Sync Fly secrets from Doppler
        # Pulls the `dev` config and stages it onto the Fly app. Filters
        # out vars that don't belong on Fly (Doppler/Neon/CF/build-time
        # PUBLIC_* / EXPO_PUBLIC_*). `--stage` defers activation; the
        # subsequent `flyctl deploy` is what flips them on, so secrets
        # + code ship in a single transaction.
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_DEV }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          doppler secrets download --no-file --format env \
            | grep -vE '^(DOPPLER_|NEON_|FLY_|CLOUDFLARE_|PUBLIC_|EXPO_PUBLIC_|PAGES_PROJECT|PORT|NODE_ENV|ADMIN_EMAIL)' \
            | flyctl secrets import --stage --app harpa-pro-api-dev

      - name: Deploy to Fly.io (dev)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          HEAD=$(ls packages/api/migrations | grep -E '\.sql$' | sort | tail -1)
          if [[ -z "$HEAD" ]]; then
            echo "ERROR: no .sql files in packages/api/migrations" >&2
            exit 1
          fi
          echo "deploy: MIGRATIONS_REQUIRED_HEAD=$HEAD"
          GIT_COMMIT=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "deploy: GIT_COMMIT=$GIT_COMMIT BUILD_TIME=$BUILD_TIME"
          flyctl deploy \
            --config infra/fly/fly.dev.toml \
            --dockerfile infra/fly/Dockerfile \
            --build-arg "MIGRATIONS_REQUIRED_HEAD=$HEAD" \
            --build-arg "GIT_COMMIT=$GIT_COMMIT" \
            --build-arg "BUILD_TIME=$BUILD_TIME" \
            --remote-only

      - name: Verify /readyz (dev)
        # Dev runs with `auto_stop_machines = "suspend"` and
        # `min_machines_running = 0`, so machines are stopped right
        # after a deploy and the first request has to wake them. The
        # cold-start (Linux + Node + DB pool + schema-head check)
        # routinely exceeds the old 5s curl budget — see
        # docs/bugs/README.md ("api-dev /readyz verify cold-start").
        # The shared script bumps the per-attempt timeout and retry
        # spacing so cold-starts pass without flakes.
        env:
          READYZ_URL: ${{ vars.API_READY_URL_DEV || 'https://harpa-pro-api-dev.fly.dev/readyz' }}
        run: bash scripts/ci/verify-readyz.sh

      - name: Diagnose readyz failure
        # Surface Fly machine state + recent logs in the workflow log
        # so the next regression doesn't require a separate spelunk
        # through the Fly dashboard. Only runs if /readyz didn't pass.
        if: failure()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "::group::flyctl status"
          flyctl status --app harpa-pro-api-dev || true
          echo "::endgroup::"
          echo "::group::flyctl logs (last 200 lines)"
          flyctl logs --app harpa-pro-api-dev --no-tail || true
          echo "::endgroup::"

      - name: Post-deploy journey tests
        # Runs curl journey scripts against the just-deployed dev API.
        # Order: stress (~10s, no AI) → core (~3min, live AI) → extended (~5min, live AI).
        # On failure the workflow goes red but the deploy is NOT rolled back.
        #
        # NOTE: Journey scripts default EMAIL=alice@e2e.harpapro.com and
        # EMAIL2=bob@e2e.harpapro.com. The API gates sign-in to the
        # comma-separated TEST_ACCOUNT_EMAILS_DEV value on Fly, and
        # `db:seed-test-account` (chained into release_command) creates
        # exactly those emails. So Fly's TEST_ACCOUNT_EMAILS_DEV must
        # include alice@e2e.harpapro.com,bob@e2e.harpapro.com — see
        # docs/bugs/2026-06-06-test-accounts-never-seeded-on-dev.md.
        env:
          PASSWORD: ${{ secrets.TEST_ACCOUNT_PASSWORD_DEV }}
        run: bash scripts/journeys/all.sh dev

