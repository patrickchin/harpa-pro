appId: ${MAESTRO_APP_ID}
name: 'Account deletion - confirm and sign out'
tags:
  - account
  - deletion
---
# Focused local flow for App Store account-deletion coverage.
#
# This flow permanently deletes test3@harpapro.com. Run it only against a
# fresh local database seeded by docker compose / reset-db, not against the
# shared dev deployment. The normal regression journey covers discoverability
# and cancel without destroying the primary test account.

- runFlow: helpers/launch-local-dev-client.yaml

- runFlow:
    file: helpers/sign-in.yaml
    env:
      EMAIL: 'test3@harpapro.com'

- runFlow:
    when:
      visible:
        id: 'screen-onboarding'
    commands:
      - tapOn:
          id: 'input-onboarding-name'
      - inputText: 'Delete Flow E2E'
      - tapOn:
          id: 'input-onboarding-company'
      - inputText: 'E2E Corp'
      - hideKeyboard
      # iOS can submit this form while dismissing the keyboard, which
      # navigates to Projects before Maestro reaches the explicit tap.
      - runFlow:
          when:
            visible:
              id: 'btn-onboarding-submit'
          commands:
            - tapOn:
                id: 'btn-onboarding-submit'

- extendedWaitUntil:
    visible:
      id: 'btn-new-project'
    timeout: 15000
- tapOn:
    id: 'btn-open-profile'
- extendedWaitUntil:
    visible:
      id: 'screen-profile'
    timeout: 10000
- tapOn:
    id: 'btn-open-account'
- extendedWaitUntil:
    visible:
      id: 'screen-account'
    timeout: 10000
- scrollUntilVisible:
    element:
      id: 'btn-open-delete-account'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'btn-open-delete-account'
- extendedWaitUntil:
    visible:
      id: 'dialog-sheet'
    timeout: 10000
- assertVisible: 'Delete account?'
- extendedWaitUntil:
    visible: '.*Projects deleted.*'
    timeout: 10000
- tapOn:
    id: 'input-delete-account-email'
- inputText: 'test3@harpapro.com'
- hideKeyboard
- runFlow:
    when:
      visible:
        id: 'btn-confirm-delete-account'
    commands:
      - tapOn:
          id: 'btn-confirm-delete-account'
- extendedWaitUntil:
    visible:
      id: 'input-email'
    timeout: 20000
