name: ai-live
# Live-LLM regression lane. Hits real OpenAI (and any other provider
# wired into the report path) to catch prompt/schema drift that
# fixtures cannot detect — see docs/v4/pitfalls.md Pitfall 13 and
# the entry in docs/bugs/README.md.
#
# Triggers:
#   - workflow_dispatch  → manual button (zero cost when idle).
#   - push to dev/main   → only when files that affect the live
#                          path change (prompts, services/ai.ts,
#                          contract schemas, provider adapters,
#                          recorded fixtures).
#   - PR                 → only when the same path-filter matches.
#                          Fork PRs are skipped because they cannot
#                          access secrets.
#
# Cost: ~3 short gpt-4o calls per run.

on:
  workflow_dispatch:
  push:
    branches: [dev, main]
    paths:
      - 'packages/api/src/prompts/**'
      - 'packages/api/src/services/ai.ts'
      - 'packages/api-contract/src/schemas/reports.ts'
      - 'packages/ai-fixtures/src/providers/**'
      - 'packages/ai-fixtures/fixtures/generate-report.*.json'
      - '.github/workflows/ai-live.yml'
  pull_request:
    paths:
      - 'packages/api/src/prompts/**'
      - 'packages/api/src/services/ai.ts'
      - 'packages/api-contract/src/schemas/reports.ts'
      - 'packages/ai-fixtures/src/providers/**'
      - 'packages/ai-fixtures/fixtures/generate-report.*.json'
      - '.github/workflows/ai-live.yml'

concurrency:
  group: ai-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    # Fork PRs cannot access secrets; skip rather than fail loudly.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AI_LIVE: '1'
      AI_FIXTURE_MODE: live
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-monorepo
      - run: pnpm --filter @harpa/api-contract build


      # Provider keys live in Doppler (config `dev`), not GH secrets.
      # `secrets-fetch-action` exposes them as masked step outputs;
      # we deliberately do NOT use `inject-env-vars` because that
      # would pull `NODE_ENV=production` and other Fly-only vars
      # from the config and confuse the test runner's env parser.
      - uses: dopplerhq/secrets-fetch-action@v2.0.0
        id: doppler
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN_DEV }}

      - name: Run live-LLM tests against real OpenAI
        env:
          OPENAI_API_KEY: ${{ steps.doppler.outputs.OPENAI_API_KEY }}
          KIMI_API_KEY: ${{ steps.doppler.outputs.KIMI_API_KEY }}
          GROQ_API_KEY: ${{ steps.doppler.outputs.GROQ_API_KEY }}
        run: pnpm --filter @harpa/api test:live

