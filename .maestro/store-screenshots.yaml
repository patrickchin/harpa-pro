appId: ${MAESTRO_APP_ID}
name: "Store screenshots: seeded projects, reports, photos, usage"
tags:
  - screenshots
  - store
---
# Captures marketplace screenshots for App Store / Play Store review.
#
# Preconditions:
#   - local compose API and auth broker are up with test accounts seeded
#   - scripts/maestro/seed-store-screenshots.sh has seeded Postgres + MinIO
#   - Metro is running with EXPO_PUBLIC_USE_FIXTURES=false and
#     EXPO_PUBLIC_SCREENSHOT_MODE=true
#   - Android callers have adb reverse for 8081, 8787, and 9000
#   - Android callers enable immersive mode before capture so navigation
#     chrome is absent from App Store / Play Store screenshots
#
# Screenshot mode uses the fixture recorder for deterministic
# voice-recording UI. Report data still comes from the seeded local API,
# so the finalized report and PDF reflect the store screenshot fixture
# report body.

- launchApp:
    clearState: true
    clearKeychain: true
    stopApp: true
- waitForAnimationToEnd
- openLink: "exp+harpa-pro-v4://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081%3FdisableOnboarding%3D1"
- waitForAnimationToEnd:
    timeout: 20000
- runFlow:
    file: helpers/dismiss-open-dialog.yaml
- extendedWaitUntil:
    visible:
      id: "input-email"
    timeout: 90000

- runFlow:
    file: helpers/sign-in.yaml
    env:
      EMAIL: "test3@harpapro.com"

- runFlow:
    when:
      visible:
        id: "screen-onboarding"
    commands:
      - tapOn:
          id: "input-onboarding-name"
      - inputText: "Avery Chen"
      - tapOn:
          id: "input-onboarding-company"
      - inputText: "HARPA Field Demo"
      - hideKeyboard
      # iOS can submit this form while dismissing the keyboard, which
      # navigates to Projects before Maestro reaches the explicit tap.
      - runFlow:
          when:
            visible:
              id: "btn-onboarding-submit"
          commands:
            - tapOn:
                id: "btn-onboarding-submit"

- extendedWaitUntil:
    visible:
      id: "btn-new-project"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "project-row-prj_rvrsd000001"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "project-row-prj_harbp000001"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: 01_projects_list

- tapOn:
    id: "project-row-prj_rvrsd000001"
- extendedWaitUntil:
    visible:
      id: "btn-open-reports"
    timeout: 15000
- tapOn:
    id: "btn-open-reports"
- extendedWaitUntil:
    visible:
      id: "btn-new-report"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "report-row-4"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "report-row-3"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: 02_reports_list

- openLink: "harpa://projects/prj_rvrsd000001"
- runFlow:
    file: helpers/dismiss-open-dialog.yaml
- extendedWaitUntil:
    visible:
      id: "link-project-members"
    timeout: 15000
- tapOn:
    id: "link-project-members"
- extendedWaitUntil:
    visible: "Members"
    timeout: 15000
- extendedWaitUntil:
    visible: "Avery Chen"
    timeout: 15000
- extendedWaitUntil:
    visible: "Priya Shah"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: 03_members_team

- openLink: "harpa://projects/prj_rvrsd000001/reports/4/generate"
- runFlow:
    file: helpers/dismiss-open-dialog.yaml
- extendedWaitUntil:
    visible:
      id: "input-note"
    timeout: 30000
- extendedWaitUntil:
    visible: "Access path follow-up"
    timeout: 30000
- tapOn:
    id: "btn-record-start"
- extendedWaitUntil:
    visible:
      id: "voice-record-strip"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "voice-record-duration"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: 04_voice_recording
- tapOn:
    id: "btn-record-cancel"

- openLink: "harpa://projects/prj_rvrsd000001/reports/3"
- runFlow:
    file: helpers/dismiss-open-dialog.yaml
- extendedWaitUntil:
    visible:
      id: "saved-report-pane"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "placed-photos-issue-.*"
    direction: DOWN
    timeout: 60000
- extendedWaitUntil:
    visible: "South foundation wall shows water intrusion"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: 05_final_report_issues

- scrollUntilVisible:
    element:
      id: "report-photos"
    direction: DOWN
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: "report-photos-grid"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: 06_final_report_sections_unplaced

- openLink: "harpa://projects/prj_rvrsd000001/reports/3"
- runFlow:
    file: helpers/dismiss-open-dialog.yaml
- scrollUntilVisible:
    element:
      id: "btn-report-actions"
    direction: UP
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: "btn-report-actions"
    timeout: 30000
- tapOn:
    id: "btn-report-actions"
- extendedWaitUntil:
    visible:
      id: "report-actions-menu"
    timeout: 15000
- tapOn:
    id: "btn-report-view-pdf"
- extendedWaitUntil:
    visible:
      id: "pdf-preview"
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: 07_pdf_preview

- tapOn:
    id: "btn-back"
- extendedWaitUntil:
    visible:
      id: "saved-report-pane"
    timeout: 15000
- openLink: "harpa://usage"
- runFlow:
    file: helpers/dismiss-open-dialog.yaml
- extendedWaitUntil:
    visible:
      id: "screen-usage"
    timeout: 30000
- extendedWaitUntil:
    notVisible:
      id: "usage-loading"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "usage-by-model"
    direction: DOWN
    timeout: 60000
    visibilityPercentage: 10
    centerElement: false
- scrollUntilVisible:
    element:
      id: "usage-recent-events"
    direction: DOWN
    timeout: 60000
    visibilityPercentage: 10
    centerElement: false
- waitForAnimationToEnd
- takeScreenshot: 08_usage

- openLink: "harpa://projects/prj_rvrsd000001/reports/3"
- runFlow:
    file: helpers/dismiss-open-dialog.yaml
- extendedWaitUntil:
    visible:
      id: "report-title-.*"
    timeout: 30000
- assertVisible:
    id: "report-header-controls"
- assertVisible:
    id: "saved-report-pane"
- assertVisible:
    id: "btn-tab-report"
- assertVisible:
    id: "btn-tab-review"
- tapOn:
    id: "btn-tab-review"
- extendedWaitUntil:
    visible: "Waterproofing repair details verified.*"
    timeout: 15000
- extendedWaitUntil:
    visible: "Fire lane staging plan reviewed.*"
    timeout: 15000
- assertVisible:
    id: "report-review-composer"
- waitForAnimationToEnd
- takeScreenshot: 09_report_review
