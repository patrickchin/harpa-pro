appId: ${MAESTRO_APP_ID}
name: "01b — Auth: sign in test2 via password"
tags:
  - regression
  - auth
---
# Module 01b — Sign in test2
#
# Covers:
#   - sign-out from test
#   - sign-in for test2 + onboarding
#   - sign-out
#   - sign back in as test (ready for module 02)
#
# Rationale: test2 must exist in the database BEFORE test can invite him.
# The add_project_member_by_email service errors with `user_not_found`
# if the email has no user row. So we sign test2 in here, sign him out,
# then resume the journey as test.
#
# Pre-condition: test is signed in on the projects list.
# Post-condition: test is signed in on the projects list (state unchanged
# from caller's view; test2 now exists in DB).

# --- Sign-out from test ---------------------------------------------------
- runFlow: ../helpers/sign-out.yaml

# --- Sign-in test2 --------------------------------------------------------
- runFlow:
    file: ../helpers/sign-in.yaml
    env:
      EMAIL: "test2@harpapro.com"

# --- Onboarding for test2 -----------------------------------------------------
- runFlow:
    when:
      visible:
        id: "screen-onboarding"
    commands:
      - tapOn:
          id: "input-onboarding-name"
      - inputText: "Test Two E2E"
      - tapOn:
          id: "input-onboarding-company"
      - inputText: "E2E Corp"
      - hideKeyboard
      - tapOn:
          id: "btn-onboarding-submit"
- extendedWaitUntil:
    visible:
      id: "btn-new-project"
    timeout: 15000

# --- Sign-out test2 ----------------------------------------------------------
- runFlow: ../helpers/sign-out.yaml

# --- Sign back in as test (ready for module 02) ---------------------------
- runFlow:
    file: ../helpers/sign-in.yaml
    env:
      EMAIL: "test@harpapro.com"
