appId: ${MAESTRO_APP_ID}
name: "06 — Members: alice removes bob; bob no longer sees project"
tags:
  - regression
  - members
---
# Module 06 — Member removal
#
# Covers:
#   - alice opens members screen
#   - taps remove button on bob's row
#   - confirms removal via confirm-remove-member dialog
#   - bob's row disappears
#   - sign in as bob: bob's project list does NOT include the project
#   - restore alice
#
# Pre-condition: alice on project home; bob is a viewer member.
# Post-condition: alice on project home; bob is removed.

# --- Alice opens members ---------------------------------------------------
- tapOn:
    id: "link-project-members"
- extendedWaitUntil:
    visible:
      id: "member-row-.*"
    timeout: 10000

# --- Remove bob's row -------------------------------------------------------
- tapOn:
    id: "btn-remove-member-.*"
- extendedWaitUntil:
    visible:
      id: "confirm-remove-member"
    timeout: 8000
- tapOn:
    id: "confirm-remove-member"

# --- Confirm bob's row is gone ---------------------------------------------
# `member-row-.*` still matches alice's owner row, so we assert the
# "Viewer" badge (only bob had it) is gone instead.
- extendedWaitUntil:
    notVisible:
      text: "Viewer"
    timeout: 8000

# --- Go back to project home -----------------------------------------------
- tapOn:
    id: "btn-back"
- extendedWaitUntil:
    visible:
      id: "btn-project-edit"
    timeout: 10000

# --- Switch to bob — bob no longer sees the project -----------------------
- runFlow: ../helpers/sign-out.yaml
- runFlow:
    file: ../helpers/sign-in.yaml
    env:
      EMAIL: "bob@harpa.test"

# Bob's project list should be empty (no project row for alice's project)
- assertNotVisible:
    text: "Regression Test Project \\(Edited\\)"

# --- Switch back to alice ---------------------------------------------------
- runFlow: ../helpers/sign-out.yaml
- runFlow:
    file: ../helpers/sign-in.yaml
    env:
      EMAIL: "alice@harpa.test"
- runFlow: ../helpers/open-project.yaml
