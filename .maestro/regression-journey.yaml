appId: ${MAESTRO_APP_ID}
name: "Regression journey — full end-to-end"
tags:
  - regression
---
# Full regression journey
#
# Sequence:
#   1. Auth — sign in test (auto-create + onboard), sign out, sign in
#   2. Projects CRUD — create, edit
#   3. Members invite — test invites test2 as Editor (creates test2 too)
#   4. Members permissions — test2 verifies editor access
#   5. Members viewer — test downgrades test2; test2 loses edit buttons
#   6. Members remove — test removes test2; test2 can't see project
#   7. Reports CRUD — create, navigate, delete report
#   8. Text notes — add and delete a text note
#   9. Voice notes — record/upload/transcribe/summarize/title/transcript/delete
#  10a. Photo notes (draft) — attachment sheet/camera upload/generated photos/delete
#  10b. Photo notes (finalized) — saved-report photo strip and preview
#  10c. Photo attachment picker — many photo groups force picker scroll
#  11. Generate + finalize — add note, generate, view report, finalize, unfinalize, re-finalize
#  12. Report debug — verify debug screen sections
#  13. Projects delete — delete the project, verify gone
#  14. Account — view profile, edit + cancel, edit + save
#  15. Usage — open Usage from Profile, assert screen renders
#  16. Profile — identity card + nav targets visible
#  17. Sign out cleanly
#
# Local pre-condition: clean database. Run `docker compose down -v &&
# docker compose up` locally to reset between runs. The API seeds
# password-login test accounts from TEST_ACCOUNT_EMAILS and
# TEST_ACCOUNT_PASSWORD.
#
# Auth delivery: `helpers/sign-in.yaml` goes through the local auth broker
# on 127.0.0.1:8790, which keeps the shared password out of Maestro logs
# while the mobile client still creates a normal better-auth session.

# ── 1. Auth (sign-in test + sign-out + sign-in round-trip) ──────────────
- runFlow: modules/01-auth.yaml

# ── 1b. Create test2 (must exist before test can invite him) ──────────────
- runFlow: modules/01b-signup-test2.yaml

# ── 2. Projects CRUD ──────────────────────────────────────────────────────
- runFlow: modules/02-projects-crud.yaml

# ── 3. Members invite ─────────────────────────────────────────────────────
- runFlow: modules/03-members-invite.yaml

# ── 4. Members permissions (editor) ───────────────────────────────────────
- runFlow: modules/04-members-permissions.yaml

# ── 5. Members viewer downgrade ────────────────────────────────────────────
- runFlow: modules/05-members-viewer.yaml

# ── 6. Members remove ─────────────────────────────────────────────────────
- runFlow: modules/06-members-remove.yaml

# ── 7. Reports CRUD ───────────────────────────────────────────────────────
# Module 06 ends with test signed in on the project home, so we go
# straight into 07 without re-running the sign-in helper.
- runFlow: modules/07-reports-crud.yaml

# ── 8. Text notes ─────────────────────────────────────────────────────────
# Pre-condition: test on project home
- runFlow: modules/08-text-notes.yaml

# ── 9. Voice notes (fixture recorder) ─────────────────────────────────────
# Covers fixture recording, upload, transcribe, summarize, title,
# transcript sheet, playback entry point, and delete. See
# docs/v4/design-voice-notes-e2e.md.
- runFlow: modules/09-voice-notes.yaml

# ── 10a. Photo notes (draft): camera → upload pipeline ────────────────────
# Pre-condition: test on project home
# Requires: app built with EXPO_PUBLIC_USE_FIXTURES=true; camera
# privacy grant on the sim.
- runFlow: modules/10a-photo-notes-draft.yaml

# ── 10b. Photo notes (finalized): saved-report photo strip ────────────────
# Pre-condition: test on project home
# Requires: same camera/upload fixture setup as 10a.
- runFlow: modules/10b-photo-notes-finalized.yaml

# ── 10c. Photo attachment picker scroll ───────────────────────────────────
# Pre-condition: test on project home
# Requires: same camera/upload fixture setup as 10a.
- runFlow: modules/10c-photo-attachment-picker-scroll.yaml

# ── 11. Generate + finalize ───────────────────────────────────────────────
# Pre-condition: test on project home
- runFlow: modules/11-generate-finalize.yaml

# ── 12. Report debug ──────────────────────────────────────────────────────
# Pre-condition: test on finalized saved-report screen (was 11's post)
- runFlow: modules/12-report-debug.yaml

# ── 13. Projects delete ───────────────────────────────────────────────────
# Pre-condition: test on saved-report screen (was 12's post)
- runFlow: modules/13-projects-delete.yaml

# ── 14. Account screen ────────────────────────────────────────────────────
# Pre-condition: test on empty projects index (post-13)
- runFlow: modules/14-account.yaml

# ── 15. Usage screen ──────────────────────────────────────────────────────
# Pre-condition: test on profile screen (post-14)
- runFlow: modules/15-usage.yaml

# ── 16. Profile identity + nav surface ────────────────────────────────────
# Pre-condition: test on profile screen (post-15)
- runFlow: modules/16-profile.yaml

# ── 17. Sign out cleanly ──────────────────────────────────────────────────
- runFlow: helpers/sign-out.yaml
