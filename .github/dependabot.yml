# GitHub reads this file from the default branch (`main`). Routine version
# updates target `dev`; security updates are enabled in repository settings
# and continue to target the default branch.
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Shanghai'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # Keep compatibility-coupled packages in reviewed stacks. These groups
      # must stay before the broad patch groups below because Dependabot assigns
      # a dependency to the first matching group.
      better-auth-stack:
        patterns:
          - 'better-auth'
          - '@better-auth/*'
          - 'auth'
        update-types:
          - 'minor'
          - 'patch'
      react-stack:
        patterns:
          - 'react'
          - 'react-dom'
          - 'react-test-renderer'
          - '@types/react'
          - '@types/react-dom'
          - '@types/react-test-renderer'
        update-types:
          - 'minor'
          - 'patch'
      astro-stack:
        patterns:
          - 'astro'
          - '@astrojs/*'
          - 'vite'
          - '@tailwindcss/vite'
        update-types:
          - 'minor'
          - 'patch'
      drizzle-stack:
        patterns:
          - 'drizzle-*'
        update-types:
          - 'patch'
      aws-sdk-stack:
        patterns:
          - '@aws-sdk/*'
        update-types:
          - 'minor'
          - 'patch'
      typescript-eslint-stack:
        patterns:
          - '@typescript-eslint/*'
        update-types:
          - 'minor'
          - 'patch'
      production-patches:
        patterns:
          - '*'
        dependency-type: 'production'
        update-types:
          - 'patch'
      development-patches:
        patterns:
          - '*'
        dependency-type: 'development'
        update-types:
          - 'patch'
    ignore:
      # Expo Doctor / `expo install` owns this native compatibility graph.
      # Upgrade it as one staged, human-reviewed SDK migration.
      # Because this update entry targets `dev`, none of its options apply to
      # default-branch security updates.
      - dependency-name: 'expo*'
      - dependency-name: '@expo/*'
      - dependency-name: 'react-native*'
      - dependency-name: '@react-native/*'

      # Expo SDK 55 owns the Babel major boundary.
      - dependency-name: '@babel/core'
        update-types: ['version-update:semver-major']

      # Compatibility-stack majors need their own migration plans.
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'react-test-renderer'
      - dependency-name: '@types/react*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'astro'
        update-types: ['version-update:semver-major']
      - dependency-name: '@astrojs/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vite'
        update-types: ['version-update:semver-major']
      - dependency-name: '@tailwindcss/vite'
        update-types: ['version-update:semver-major']
      - dependency-name: 'drizzle-*'
        update-types:
          - 'version-update:semver-minor'
          - 'version-update:semver-major'
      - dependency-name: 'better-auth'
        update-types: ['version-update:semver-major']
      - dependency-name: '@better-auth/*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
      time: '09:00'
      timezone: 'Asia/Shanghai'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions-minor-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'bundler'
    directory: '/'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
      day: 'wednesday'
      time: '09:00'
      timezone: 'Asia/Shanghai'
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'chore(deps)'
