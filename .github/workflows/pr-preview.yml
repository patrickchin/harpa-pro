name: pr-preview

# Per-PR Neon branch lifecycle. Creates on open/sync, deletes on
# close. DATABASE_URL secret is set on the PR's preview environment
# by the create job.
#
# Optimisation: only create a Neon branch when the PR actually
# touches API code or migrations. Docs/marketing/mobile-only PRs
# don't need a database branch. Close-events still always run so we
# don't orphan branches that were created earlier in the PR's life.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  changes:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.paths.outputs.api }}
      api-migrations: ${{ steps.paths.outputs.api-migrations }}
    steps:
      - uses: actions/checkout@v4
      - id: paths
        uses: ./.github/actions/changed-paths

  # Migration-filename lint. Cheap; runs whenever any API path
  # changes so typos are caught at PR time, not prod time.
  guard:
    needs: changes
    if: github.event.action != 'closed' && needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - name: Lint migration filenames
        run: |
          set -euo pipefail
          MIG_DIR=packages/api/migrations
          bad=0
          for f in $(ls "$MIG_DIR" | grep -E '\.sql$' || true); do
            if ! echo "$f" | grep -qE '^[0-9]+_[a-z0-9_]+(\.notx)?\.sql$'; then
              echo "::error file=$MIG_DIR/$f::filename must match <digits>_<slug>[.notx].sql"
              bad=$((bad+1))
            fi
          done
          if [[ "$bad" -gt 0 ]]; then exit 1; fi
          dups=$(ls "$MIG_DIR" | grep -E '\.sql$' | awk -F_ '{print $1}' | sort | uniq -d)
          if [[ -n "$dups" ]]; then
            echo "::error::duplicate migration prefix(es): $dups"
            exit 1
          fi

  branch:
    # Always run on close (delete the branch if it exists). On
    # open/sync, only run when API or migration paths changed.
    needs: changes
    if: |
      github.event.action == 'closed' ||
      needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-monorepo
      - name: Create branch
        if: github.event.action != 'closed'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          # --silent suppresses pnpm's "> harpa-pro@0.0.0 ..." banner
          # so only the connection URI ends up on stdout / GITHUB_ENV.
          URI=$(pnpm --silent db:branch:create ${{ github.event.pull_request.number }})
          echo "::add-mask::$URI"
          echo "DATABASE_URL=$URI" >> "$GITHUB_ENV"
      - name: Run migrations
        if: github.event.action != 'closed'
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm --filter @harpa/api db:migrate
      - name: Delete branch
        if: github.event.action == 'closed'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        # `|| true` so closing a PR that never had a branch
        # (docs-only PR) is a no-op rather than a failure.
        run: pnpm db:branch:delete ${{ github.event.pull_request.number }} || true
# When a Fly preview machine is added, the `Run migrations` step above
# moves into that machine's release_command and this workflow's last
# step becomes a `curl --fail $PREVIEW/readyz`. See
# docs/v4/arch-cicd-and-migrations.md §Open questions.
