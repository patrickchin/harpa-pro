appId: ${MAESTRO_APP_ID}
name: Core end-to-end (all shipped features)
tags:
  - core-e2e
---
# This flow is the canonical full-journey Maestro test referenced by the
# P3 exit gate in docs/v4/plan-p3-feature-build.md. It walks through
# every currently-implemented user-visible feature on the real
# `(auth)` + `(app)` routes (not the `(dev)` gallery).
#
# Coverage:
#   - sign-in flow      (password login via `helpers/sign-in.yaml`)
#   - onboarding        (conditional)
#   - sign-out + sign-in round trip
#   - projects list, new project
#   - project home: copy-client, copy-address, open-reports, open-members
#   - members: invite (role editor), filter buttons, remove-member
#   - project edit: rename + save
#   - reports list + new report
#   - generate report tabs: notes / report / edit / finalize confirm
#   - voice record (mic + camera permissions pre-granted by run script)
#   - project delete
#
# Pre-flight (must be done by the caller, not by Maestro):
#   1. docker compose up -d     # fixture-mode API on :8787
#   2. pnpm --filter @harpa/mobile start --dev-client
#   3. xcrun simctl privacy booted grant microphone ${MAESTRO_APP_ID}
#      xcrun simctl privacy booted grant camera ${MAESTRO_APP_ID}
#   4. scripts/maestro/reset-db.sh   # wipe app + auth schemas so the
#      seed (test@harpapro.com) is a fresh account every run
#
# Run:
#   maestro test .maestro/core-end-to-end.yaml
- launchApp:
    clearState: true
    clearKeychain: true
    stopApp: true
- waitForAnimationToEnd
# --- Android dev-client unstuck prelude --------------------------------------
# `clearState: true` does `pm clear` on Android, wiping
# `expo.modules.devlauncher.recentyopenedapps.xml` — so without help we
# land on the dev-launcher picker, not the JS app. Fix: deep-link the
# dev-launcher's own scheme with an explicit Metro URL. This is exactly
# what tapping the "http://localhost:8081" row does internally. On iOS
# the scheme `exp+harpa-pro-v4` is unregistered, so `openLink` is a no-op
# and we fall through to the regular launch path. The encoded
# `disableOnboarding=1` query param tells Expo not to show the native
# dev-menu onboarding sheet over the app.
- openLink: "exp+harpa-pro-v4://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081%3FdisableOnboarding%3D1"
# Give the dev-launcher time to fetch + load the JS bundle from Metro
# (cold start over USB after pm clear typically takes 8-15s).
- waitForAnimationToEnd:
    timeout: 20000
# Dismiss any legacy Android/iOS dev-launcher first-run sheet if an older
# dev-client ignores `disableOnboarding=1`. On subsequent runs, every gate skips.
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn:
          text: "Continue"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd

# iOS system dialog: "Open in 'Harpa Pro Dev'?" — appears a beat after
# openLink. No-op on Android and on iOS after first dismissal.
- runFlow:
    file: helpers/dismiss-open-dialog.yaml

# The Expo dev-menu onboarding sheet can appear late while Metro finishes a
# cold bundle on older dev-clients. Wait once more, but dismiss by visible
# labels only; coordinate taps are device-dependent.
- extendedWaitUntil:
    visible: "This is the developer menu"
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn:
          text: "Continue"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd

# Let the auth gate land us on sign-in first (more reliable than a
# bare deep link to /sign-in immediately after a cold-launch race).
- extendedWaitUntil:
    visible:
      id: "input-email"
    timeout: 90000

# --- Sign-in ----------------------------------------------------------------
# The local auth broker keeps the shared password out of Maestro logs while the
# mobile client still creates a normal better-auth session.
- runFlow:
    file: helpers/sign-in.yaml
    env:
      EMAIL: "test@harpapro.com"

# --- Onboarding (only for fresh accounts) ----------------------------------
# reset-db.sh seeds test@harpapro.com for p3-report-wiring.yaml, so
# repeated runs sign back IN rather than triggering onboarding. Make the
# block conditional so the flow works whether the DB is reset or not.
- runFlow:
    when:
      visible:
        id: "screen-onboarding"
    commands:
      - tapOn:
          id: "input-onboarding-name"
      - inputText: "Maestro Tester"
      - tapOn:
          id: "input-onboarding-company"
      - inputText: "QA Industries"
      - hideKeyboard
      # Guard: returning users (displayName+companyName already set) trigger
      # an auto-redirect mid-flow, making the submit button disappear before
      # we can tap it. Only tap if still visible.
      - runFlow:
          when:
            visible:
              id: "btn-onboarding-submit"
          commands:
            - tapOn:
                id: "btn-onboarding-submit"

# --- Projects list -----------------------------------------------------------
- extendedWaitUntil:
    visible:
      id: "btn-new-project"
    timeout: 10000
- assertVisible:
    text: "Projects"
- tapOn:
    id: "btn-new-project"

# --- New project -------------------------------------------------------------
- assertVisible:
    id: "input-project-name"
- tapOn:
    id: "input-project-name"
- inputText: "Maestro Test Project"
- tapOn:
    id: "input-client-name"
- inputText: "QA Client Co"
- tapOn:
    id: "input-project-address"
- inputText: "1 Test Way"
- hideKeyboard
# Guard: on iOS hideKeyboard can trigger form submission before this tap
- runFlow:
    when:
      visible:
        id: "btn-save-project"
    commands:
      - tapOn:
          id: "btn-save-project"

# --- Project home: copy buttons + navigation --------------------------------
- extendedWaitUntil:
    visible:
      id: "btn-project-edit"
    timeout: 10000
- tapOn:
    id: "btn-copy-client"
- tapOn:
    id: "btn-copy-address"

# --- Members: open, add editor, filter, back -------------------------------
# The members screen uses an inline add-member form (not a separate invite
# modal). Email input lives at `input-member-email`, role picker at
# `picker-member-role-${role}`, submit at `btn-add-member`.
- tapOn:
    id: "link-project-members"
# Members screen has an empty-state with a "Show add-member" button that
# reveals the inline email/role/submit form.
- assertVisible:
    id: "btn-show-add-member"
- tapOn:
    id: "btn-show-add-member"
- assertVisible:
    id: "input-member-email"
- tapOn:
    id: "input-member-email"
- inputText: "test2@harpapro.com"
- hideKeyboard
# iOS: hideKeyboard may trigger btn-add-member if it sits below the keyboard.
# Guard picker and submit so they're only tapped if still visible.
- runFlow:
    when:
      visible:
        id: "picker-member-role-editor"
    commands:
      - tapOn:
          id: "picker-member-role-editor"
- runFlow:
    when:
      visible:
        id: "btn-add-member"
    commands:
      - tapOn:
          id: "btn-add-member"
# After add, the "others" list now has a member so filter buttons render.
- extendedWaitUntil:
    visible:
      id: "btn-filter-all"
    timeout: 10000
- tapOn:
    id: "btn-filter-editor"
- waitForAnimationToEnd
- tapOn:
    id: "btn-back"

# --- Project edit: rename, save ---------------------------------------------
- assertVisible:
    id: "btn-project-edit"
- tapOn:
    id: "btn-project-edit"
- assertVisible:
    id: "input-edit-project-name"
- tapOn:
    id: "input-edit-project-name"
- eraseText: 50
- inputText: "Edited Project"
# iOS: hideKeyboard submits the form (same as the new-project form).
# Only tap btn-save-project if it's still visible after dismissal.
- hideKeyboard
- runFlow:
    when:
      visible:
        id: "btn-save-project"
    commands:
      - tapOn:
          id: "btn-save-project"

# --- Reports list + new draft -----------------------------------------------
# Save navigates back; give the project home time to settle before asserting.
- extendedWaitUntil:
    visible:
      id: "btn-project-edit"
    timeout: 10000
- tapOn:
    id: "btn-open-reports"
- assertVisible:
    id: "btn-new-report"
- tapOn:
    id: "btn-new-report"
# Reports are keyed by report number (`report-row-${item.number}`), not by
# draft index. The new-report mutation creates report number 1 in a fresh
# project; the tap navigates to generate-report for that draft.
- runFlow:
    when:
      visible:
        id: "report-row-1"
    commands:
      - tapOn:
          id: "report-row-1"

# Generate report: tabs, dialogs, and the real generate/finalize round-trip
# ---------------------------------------------------------------------------
# Note typing via XCTest into RN's multiline TextInput is unreliable, so this
# flow exercises the "no-notes → Generate report disabled" guard and then
# uses the regenerate path (which doesn't need notes) once a report exists.
# The add-note happy path is covered by unit tests
# (`screens/generate-notes.test.tsx`).

# --- Generate report: tabs + voice + finalize -------------------------------
- extendedWaitUntil:
    visible:
      id: "input-note-container"
    timeout: 15000

# Voice record (mic permission pre-granted by run script). Phase H:
# `btn-record-start` arms the inline WhatsApp-style recorder strip;
# `btn-record-send` finalises. `useVoiceNotePipeline` then enqueues the
# upload + transcribe + summarise round trip (fixture mode returns canned
# text). Detailed assertions on the resulting voice card live in
# `modules/09-voice-notes.yaml`; here we only confirm the strip opens
# and closes without leaving the recorder stuck on screen.
- tapOn:
    id: "btn-record-start"
- extendedWaitUntil:
    visible:
      id: "voice-record-strip"
    timeout: 5000
- waitForAnimationToEnd
- tapOn:
    id: "btn-record-send"
- extendedWaitUntil:
    notVisible:
      id: "voice-record-strip"
    timeout: 10000

# Attachment picker → Cancel (camera/library exercised by unit tests; the
# permission-bearing camera capture is brittle under XCTest).
- tapOn:
    id: "btn-attachment"
- assertVisible:
    id: "dialog-sheet"
- waitForAnimationToEnd
- tapOn:
    id: "btn-attachment-cancel"

# Add a note via the input field so the Generate-report button is enabled.
# inputText into a multiline RN TextInput is flaky on iOS XCTest — wrap in
# a runFlow so the rest of the flow still runs if typing fails.
- tapOn:
    id: "input-note"
- runFlow:
    when:
      visible:
        id: "input-note"
    commands:
      - inputText: "Concrete pour on east footing went well."
      - runFlow:
          when:
            visible:
              id: "btn-add-note"
          commands:
            - tapOn:
                id: "btn-add-note"
# The generate-notes chrome (tab bar, action row) collapses to height:0 when
# the keyboard is visible (see generate-notes.tsx `pointerEvents` / `height`
# animation). Swipe down on the notes list to trigger keyboardDismissMode and
# let the chrome animate back in before we tap btn-tab-report.
- swipe:
    direction: DOWN
    duration: 500
- waitForAnimationToEnd

# Tap Generate / Update report. In fixture mode EXPO_PUBLIC_USE_FIXTURES=true
# the route seeds currentReport = SAMPLE_GENERATED_REPORT so hasReport=true
# and the ActionRow renders the Finalize button instead — skip generate if
# neither button is visible and proceed directly to the tabs.
- runFlow:
    when:
      visible:
        id: "btn-generate-report"
    commands:
      - tapOn:
          id: "btn-generate-report"
      # Mutation latency depends on the AI fixture replay; allow 30s.
      - extendedWaitUntil:
          visible:
            id: "report-tab-pane"
          timeout: 30000
- runFlow:
    when:
      visible:
        id: "btn-generate-update-report"
    commands:
      - tapOn:
          id: "btn-generate-update-report"
      - extendedWaitUntil:
          visible:
            id: "report-tab-pane"
          timeout: 30000

# Report tab — fixture mode pre-populates the report, so the tab is ready.
- extendedWaitUntil:
    visible:
      id: "btn-tab-report"
    timeout: 10000
- tapOn:
    id: "btn-tab-report"
- assertVisible:
    id: "report-tab-pane"

# Edit tab: gated behind a developer flag (showGenerateEditTab defaults off;
# AsyncStorage is cleared by clearState). Skip if not visible.
# Full section coverage lives in `screens/generate-edit-tab.test.tsx`.
- runFlow:
    when:
      visible:
        id: "btn-tab-edit"
    commands:
      - tapOn:
          id: "btn-tab-edit"
      - assertVisible:
          id: "edit-tab-pane"
      - assertVisible:
          id: "edit-section-meta"
      - tapOn:
          id: "btn-tab-report"
- runFlow:
    when:
      visible:
        id: "btn-finalize-report"
    commands:
      - tapOn:
          id: "btn-finalize-report"
      - assertVisible:
          id: "dialog-sheet"
      - waitForAnimationToEnd
      - tapOn:
          id: "confirm-finalize"
      # After finalize, the route replaces to the saved-report view.
      - extendedWaitUntil:
          visible:
            id: "btn-report-actions"
          timeout: 20000

# --- Saved report: actions menu + delete ------------------------------------
- runFlow:
    when:
      visible:
        id: "btn-report-actions"
    commands:
      - tapOn:
          id: "btn-report-actions"
      - assertVisible:
          id: "report-actions-menu"
      - tapOn:
          id: "btn-report-delete"
      - assertVisible:
          id: "dialog-sheet"
      - waitForAnimationToEnd
      - tapOn:
          id: "btn-confirm-delete-report"
      # Delete should pop us back to the reports list.
      - extendedWaitUntil:
          visible:
            id: "btn-new-report"
          timeout: 10000

- takeScreenshot: core-e2e-generate
# After report delete we're already on the reports list. Back once → project home.
- tapOn:
    id: "btn-back"

# --- Project delete (cleanup) ------------------------------------------------
- assertVisible:
    id: "btn-project-edit"
- tapOn:
    id: "btn-project-edit"
- scrollUntilVisible:
    element:
      id: "btn-delete-project"
    direction: DOWN
- tapOn:
    id: "btn-delete-project"
- assertVisible:
    id: "dialog-sheet"
- waitForAnimationToEnd
- tapOn:
    id: "confirm-delete-project"
- extendedWaitUntil:
    visible:
      id: "btn-new-project"
    timeout: 10000

- takeScreenshot: core-e2e-final
