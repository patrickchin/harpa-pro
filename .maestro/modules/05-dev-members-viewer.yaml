appId: ${MAESTRO_APP_ID}
name: "05-dev - Members: alice removes bob and re-invites as viewer"
tags:
  - regression
  - members
  - dev
---

- tapOn:
    id: "link-project-members"
- extendedWaitUntil:
    visible:
      id: "member-row-.*"
    timeout: 10000
- tapOn:
    id: "btn-remove-member-.*"
- extendedWaitUntil:
    visible:
      id: "confirm-remove-member"
    timeout: 5000
- tapOn:
    id: "confirm-remove-member"
- extendedWaitUntil:
    notVisible:
      id: "btn-remove-member-.*"
    timeout: 10000

- tapOn:
    id: "btn-show-add-member"
- extendedWaitUntil:
    visible:
      id: "input-member-phone"
    timeout: 8000
- tapOn:
    id: "input-member-phone"
- inputText: "${DEV_BOB_PHONE_E164}"
- hideKeyboard
- tapOn:
    id: "picker-member-role-viewer"
- tapOn:
    id: "btn-add-member"
- extendedWaitUntil:
    visible:
      text: "Viewer"
    timeout: 10000

- tapOn:
    id: "btn-back"
- extendedWaitUntil:
    visible:
      id: "btn-project-edit"
    timeout: 10000

- runFlow: ../helpers/sign-out.yaml
- runFlow:
    file: ../helpers/dev-password-login.yaml
    env:
      PHONE_ENCODED: "%2B15550199002"
      NAME: "Bob Dev E2E"
      COMPANY: "Dev E2E Corp"

- tapOn:
    text: "${PROJECT_NAME_EDITED}"
- extendedWaitUntil:
    visible:
      id: "link-project-members"
    timeout: 10000
- assertNotVisible:
    id: "btn-project-edit"

- tapOn:
    id: "link-project-members"
- extendedWaitUntil:
    visible:
      text: "Viewer"
    timeout: 10000
- tapOn:
    id: "btn-back"

- tapOn:
    id: "btn-open-reports"
- extendedWaitUntil:
    visible:
      id: "btn-back"
    timeout: 5000
- assertNotVisible:
    id: "btn-new-report"
- tapOn:
    id: "btn-back"

- tapOn:
    id: "btn-back"
- runFlow: ../helpers/sign-out.yaml
- runFlow:
    file: ../helpers/dev-password-login.yaml
    env:
      PHONE_ENCODED: "%2B15550199001"
      NAME: "Alice Dev E2E"
      COMPANY: "Dev E2E Corp"
- runFlow: ../helpers/open-project-dev.yaml
