name: admin-preview

# Build and browser-test the standalone admin console for every pull request.
# Cloudflare Git publishes the mirrored pr-N branch. The PR number remains the
# single identifier shared by Pages, Fly, and both Neon branches.

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'apps/admin/**'
      - 'packages/api-contract/**'
      # The browser flow crosses the whole API process (routing, global
      # middleware, app data, and dedicated admin auth), so do not try to
      # maintain a brittle list of admin-looking filenames here.
      - 'packages/api/**'
      - '.github/actions/changed-paths/**'
      - '.github/actions/setup-monorepo/**'
      - '.github/workflows/admin-preview.yml'
      - '.github/workflows/pages-preview-ref.yml'
      - '.github/workflows/pr-preview.yml'
      - 'infra/fly/fly.preview.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/ci/build-cloudflare-pages.sh'
      - 'scripts/ci/verify-pages-deployment.sh'
      - 'tsconfig.base.json'

concurrency:
  group: admin-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      API_PREVIEW_ORIGIN: https://harpa-pro-api-pr-${{ github.event.pull_request.number }}.fly.dev
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-monorepo

      - name: Test admin site
        run: pnpm --filter @harpa/admin test

      - name: Lint admin site
        run: pnpm --filter @harpa/admin lint

      - name: Typecheck admin site
        run: pnpm --filter @harpa/admin typecheck

      - name: Install Playwright Chromium
        run: pnpm --filter @harpa/admin exec playwright install --with-deps chromium

      - name: Browser-test dedicated admin authentication
        run: pnpm --filter @harpa/admin test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: admin-playwright-artifacts
          path: |
            apps/admin/playwright-report/
            apps/admin/test-results/
          retention-days: 14

      # Playwright builds with its local Testcontainers API. Rebuild after it
      # finishes so the uploaded static artifact contains the matching Fly URL.
      - name: Build admin site for the matching API preview
        env:
          PUBLIC_API_BASE_URL: ${{ env.API_PREVIEW_ORIGIN }}
        run: pnpm --filter @harpa/admin build

      - name: Verify matching API URL is inlined
        run: |
          grep -R -Fq --include='*.js' "$API_PREVIEW_ORIGIN" apps/admin/dist
          if grep -R -Fq --include='*.js' 'http://localhost:8787' apps/admin/dist; then
            echo "::error::admin preview artifact still points at the local E2E API" >&2
            exit 1
          fi

  deployment:
    needs: verify
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      ADMIN_BRANCH: pr-${{ github.event.pull_request.number }}
      ADMIN_PREVIEW_ORIGIN: https://pr-${{ github.event.pull_request.number }}.harpa-pro-admin.pages.dev
      API_PREVIEW_ORIGIN: https://harpa-pro-api-pr-${{ github.event.pull_request.number }}.fly.dev
    steps:
      - uses: actions/checkout@v7

      - name: Verify Cloudflare Git deployment
        run: >-
          bash scripts/ci/verify-pages-deployment.sh
          --origin "$ADMIN_PREVIEW_ORIGIN"
          --commit "${{ github.event.pull_request.head.sha }}"
          --branch "$ADMIN_BRANCH"
          --title 'Business activity — Harpa Pro Admin'
          --missing-route /__missing_admin_route__
