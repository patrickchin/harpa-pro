name: admin-prod

# Cloudflare Git publishes main. Verify the exact commit on the Pages hostname
# and the canonical admin custom domain.

on:
  push:
    branches: [main]
    paths:
      - 'apps/admin/**'
      - 'packages/api-contract/**'
      - 'scripts/ci/build-cloudflare-pages.sh'
      - 'scripts/ci/verify-pages-deployment.sh'
      - '.github/workflows/admin-prod.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
  workflow_dispatch: {}

concurrency:
  group: admin-prod
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        origin:
          - https://harpa-pro-admin.pages.dev
          - https://admin.harpapro.com
    steps:
      - uses: actions/checkout@v7
      - name: Verify Cloudflare Git deployment
        run: >-
          bash scripts/ci/verify-pages-deployment.sh
          --origin "${{ matrix.origin }}"
          --commit "${{ github.sha }}"
          --branch main
          --title 'Business activity — Harpa Pro Admin'
          --missing-route /__missing_admin_route__
