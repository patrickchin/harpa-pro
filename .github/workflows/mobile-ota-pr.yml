name: mobile-ota-pr

# Push an OTA update to the `development` EAS channel on every PR
# push (open / new commits / reopen) so devices with a `development`
# native build can pick up the PR's JS bundle on next launch.
#
# Only runs for PRs opened from branches in this repository — PRs
# from forks are skipped because they cannot access EXPO_TOKEN and
# we don't want to publish untrusted code to our `development`
# channel.
#
# Requires:
#   - EXPO_TOKEN repo secret (EAS access token with publish scope)

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "apps/mobile/**"
      - "packages/api-contract/**"
      - ".github/actions/changed-paths/**"
      - ".github/workflows/mobile-ota-pr.yml"
      - "pnpm-lock.yaml"

# Keyed per-PR. New pushes cancel any in-flight OTA for that PR, and
# the `closed` event below joins the same group so merging / closing
# the PR also cancels the in-flight run.
concurrency:
  group: mobile-ota-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.paths.outputs.api }}
    steps:
      - uses: actions/checkout@v4
      - id: paths
        uses: ./.github/actions/changed-paths

  ota:
    name: EAS Update (development)
    needs: changes
    # Skip PRs from forked repositories — they can't access secrets
    # and we don't auto-publish untrusted code.
    # Skip the `closed` event — that run exists only to join the
    # concurrency group and cancel any in-flight publish.
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: ./.github/actions/setup-monorepo
        with:
          node-version: '20'

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Resolve API base URL
        id: api-url
        run: |
          if [[ "${{ needs.changes.outputs.api }}" == "true" ]]; then
            echo "url=https://harpa-pro-api-pr-${{ github.event.pull_request.number }}.fly.dev" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://harpa-pro-api-dev.fly.dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Push OTA update to development channel
        working-directory: apps/mobile
        # PRs with backend changes talk to their matching per-PR Fly preview
        # API (`harpa-pro-api-pr-<n>.fly.dev`, deployed by pr-preview.yml).
        # Frontend-only PRs use the shared dev API because pr-preview.yml
        # intentionally skips Fly/Neon for those changes. The `development`
        # EAS branch holds only the most recent PR push — engineers select
        # older PR bundles via the dev-client launcher (Updates →
        # development → pick).
        #
        # Why `EXPO_PUBLIC_API_URL_OVERRIDE` and not just
        # `EXPO_PUBLIC_API_URL`: passing `--environment development`
        # pulls EAS-managed env vars (Sentry DSN + auth token used for
        # source-map upload) and those values *override* the
        # workflow's shell env when the same key is defined on EAS.
        # `EXPO_PUBLIC_API_URL` is one of those keys (it's set to the
        # shared dev Fly app on EAS), so setting it from the shell
        # silently has no effect. The override key is intentionally
        # NOT defined on EAS, so the shell value wins; `lib/config/env.ts`
        # prefers the override when present. See pitfalls.md.
        env:
          EXPO_PUBLIC_API_URL_OVERRIDE: ${{ steps.api-url.outputs.url }}
          EXPO_PUBLIC_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          eas update \
            --channel development \
            --environment development \
            --message "PR #${{ github.event.pull_request.number }} (${{ github.event.pull_request.head.ref }}) $(git rev-parse --short HEAD)" \
            --non-interactive
