appId: ${MAESTRO_APP_ID}
name: "01 — Auth: sign-in alice via email-OTP"
tags:
  - regression
  - auth
---
# Module 01 — Auth (email-OTP)
#
# Covers:
#   - cold launch with clean state
#   - sign-in via email-OTP (better-auth emailOtp plugin)
#   - sign-out + sign-in round trip
#
# Pre-condition: app just cold-launched with clearState + clearKeychain;
# alice@harpa.test exists in the database (better-auth creates the user
# automatically on first verify, so the first run also covers sign-up).
# Post-condition: alice is signed in, projects list visible.

# Cold launch with clean state
- launchApp:
    clearState: true
    clearKeychain: true
    stopApp: true
- waitForAnimationToEnd

# Android dev-client unstuck prelude: after `clearState: true`, Android
# lands on the dev-launcher picker, not the JS app. Deep-link the
# dev-launcher's own scheme with an explicit Metro URL. See
# `core-end-to-end.yaml` for the full explanation.
# On Android: openLink deep-links the dev-launcher to load the Metro bundle.
# On iOS: the exp+harpa-pro-v4 scheme is unregistered, so this is a no-op;
# the dev-launcher already remembers the Metro URL from the last run.
- openLink: "exp+harpa-pro-v4://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
# Wait for bundle load / animation. On Android first run the dev-launcher
# shows a "This is the developer menu" sheet with a "Continue" button.
# On iOS (and Android subsequent runs), this may not appear — use a timed
# wait + conditional gates (never unconditional extendedWaitUntil) so iOS
# doesn't stall for 60 s.
- waitForAnimationToEnd:
    timeout: 20000

# Dismiss the Android/iOS dev-launcher first-run sheet if it appears.
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn:
          text: "Continue"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd

# iOS system dialog: after `clearState: true`, the first `openLink` of
# the day to `exp+harpa-pro-v4://...` triggers an "Open in 'Harpa Pro
# Dev'?" confirm sheet. No-op on Android / iOS after first dismissal.
- runFlow:
    file: ../helpers/dismiss-open-dialog.yaml

# Land on sign-in (email) screen.
- extendedWaitUntil:
    visible:
      id: "input-email"
    timeout: 30000

# --- Sign-in alice (better-auth creates the user on first verify) ---------
- runFlow:
    file: ../helpers/sign-in.yaml
    env:
      EMAIL: "alice@harpa.test"

# --- Onboarding (only on first sign-in for this email; skipped on a
#     pre-onboarded account) -----------------------------------------------
- runFlow:
    when:
      visible:
        id: "screen-onboarding"
    commands:
      - tapOn:
          id: "input-onboarding-name"
      - inputText: "Alice E2E"
      - tapOn:
          id: "input-onboarding-company"
      - inputText: "E2E Corp"
      - hideKeyboard
      - tapOn:
          id: "btn-onboarding-submit"

# --- Verify projects list ---------------------------------------------------
- extendedWaitUntil:
    visible:
      id: "btn-new-project"
    timeout: 15000

# --- Sign-out ---------------------------------------------------------------
- runFlow: ../helpers/sign-out.yaml

# --- Sign-in (round-trip) --------------------------------------------------
- runFlow:
    file: ../helpers/sign-in.yaml
    env:
      EMAIL: "alice@harpa.test"
- assertVisible:
    id: "btn-new-project"
