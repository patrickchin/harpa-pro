name: dashboard-dev

# Deploy the office dashboard to the stable `dev` preview branch of the
# dedicated Cloudflare Pages project. A compatible dev API must be live first.

on:
  push:
    branches: [dev]
    paths:
      - 'apps/dashboard/**'
      - 'packages/api-contract/**'
      - 'packages/report-core/**'
      - '.github/workflows/dashboard-*.yml'
      - 'scripts/ci/ensure-dashboard-pages-project.sh'
      - 'scripts/ci/verify-dashboard-pages.sh'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tsconfig*.json'
  workflow_dispatch: {}

concurrency:
  group: dashboard-dev
  cancel-in-progress: true

jobs:
  dev:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      VITE_API_BASE_URL: https://harpa-pro-api-dev.fly.dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-monorepo

      - name: Test dashboard
        run: pnpm --filter @harpa/dashboard test

      - name: Lint dashboard
        run: pnpm --filter @harpa/dashboard lint

      - name: Typecheck dashboard
        run: pnpm --filter @harpa/dashboard typecheck

      - name: Build dashboard
        run: pnpm --filter @harpa/dashboard build

      - name: Assert Cloudflare Pages SPA artifact
        shell: bash
        run: |
          test -f apps/dashboard/dist/index.html
          if [[ -e apps/dashboard/dist/404.html ]]; then
            echo "::error::A top-level 404.html disables Cloudflare Pages SPA routing"
            exit 1
          fi

      - name: Verify compatible dev API
        env:
          API_HEALTH_URL: https://harpa-pro-api-dev.fly.dev/healthz
          API_READY_URL: https://harpa-pro-api-dev.fly.dev/readyz
          API_PATH_PATTERN: '^(packages/api/|packages/api-contract/|packages/ai-fixtures/|infra/fly/|infra/neon/|scripts/journeys/|pnpm-lock\.yaml$|tsconfig.*\.json$|\.github/workflows/api-dev\.yml$)'
          EXPECTED_GIT_COMMIT: ${{ github.sha }}
          API_RELEASE_ATTEMPTS: 30
          API_RELEASE_SLEEP: 10
        run: bash scripts/ci/verify-api-release.sh

      - name: Ensure dashboard Cloudflare Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/ci/ensure-dashboard-pages-project.sh

      - name: Deploy dashboard to Cloudflare Pages (dev)
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '3.90.0'
          packageManager: pnpm
          command: >-
            pages deploy apps/dashboard/dist
            --project-name=harpa-pro-dashboard
            --branch=dev
            --commit-hash=${{ github.sha }}
            --commit-dirty=true

      - name: Verify deployed dashboard SPA
        if: steps.deploy.outputs.deployment-url
        env:
          DASHBOARD_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: bash scripts/ci/verify-dashboard-pages.sh
