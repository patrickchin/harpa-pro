name: neon-snapshot-prune

# Delete `snapshot-<sha>` branches older than KEEP_DAYS so storage
# doesn't accumulate forever. Per-deploy snapshots are copy-on-write
# (cheap) but not free. 30 days is plenty: any rollback older than
# that should be done with Neon's PITR window from the console.
#
# See docs/v4/arch-cicd-and-migrations.md §Failure & rollback playbook.

on:
  schedule:
    - cron: "17 4 * * *" # 04:17 UTC daily
  workflow_dispatch: {}

concurrency:
  group: neon-snapshot-prune
  cancel-in-progress: false

env:
  KEEP_DAYS: "30"

jobs:
  prune:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prune stale snapshots
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: pnpm db:branch:prune-snapshots "$KEEP_DAYS"
