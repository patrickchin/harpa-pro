appId: ${MAESTRO_APP_ID}
name: P3.12 / P3.15.2 — Camera capture + Done handoff (dev mirror)
tags:
  - p3
  - camera
# Uses the (dev)/camera-capture mirror because reaching the real
# (camera)/capture route requires sign-in → project → report navigation
# and a live camera, neither of which Maestro can drive reliably in CI.
# The mirror exercises the same `screens/camera-capture.tsx` body —
# including the P3.15.2 gestures + save-to-roll toggle — with a stubbed
# preview and a synthetic shutter.
---
- launchApp:
    clearState: true
    clearKeychain: true
    stopApp: true
- waitForAnimationToEnd
- openLink: harpa://dev/camera-capture
- assertVisible:
    id: "camera-capture-root"
- assertVisible:
    id: "btn-camera-save-to-roll"
- assertVisible:
    id: "btn-camera-shutter"
- tapOn:
    id: "btn-camera-shutter"
- tapOn:
    id: "btn-camera-shutter"
- assertVisible:
    id: "lbl-camera-count"
- tapOn:
    id: "btn-camera-done"
# After Done the dev mirror flips back to 'granted' (no captures),
# which means the session-commit handoff fired successfully.
- assertVisible:
    id: "camera-capture-root"
- assertNotVisible:
    id: "lbl-camera-count"
