name: lint-typecheck

# Two-job pattern: a tiny `changes` job computes path-filter outputs.
# The required `lint-typecheck` job always reports and always checks the
# reviewed Node pins, including on PRs that change only `.nvmrc` or `.npmrc`.
# Heavy lint/typecheck steps still short-circuit when no code paths changed.
# Push events always run the full job (we want full coverage on main / dev).

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      any-code: ${{ steps.paths.outputs.any-code }}
    steps:
      - uses: actions/checkout@v4
      - id: paths
        uses: ./.github/actions/changed-paths

  lint-typecheck:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node version policy
        run: bash scripts/ci/__tests__/node-version-policy.test.sh
      - uses: ./.github/actions/setup-monorepo
        if: needs.changes.outputs.any-code == 'true' || github.event_name == 'push'
      - run: pnpm --filter @harpa/api-contract build
        if: needs.changes.outputs.any-code == 'true' || github.event_name == 'push'
      - run: pnpm lint
        if: needs.changes.outputs.any-code == 'true' || github.event_name == 'push'
      - run: pnpm typecheck
        if: needs.changes.outputs.any-code == 'true' || github.event_name == 'push'
      - name: Removal verification gates
        if: needs.changes.outputs.any-code == 'true' || github.event_name == 'push'
        run: |
          bash scripts/check-no-supabase.sh
          bash scripts/check-no-unistyles.sh
          bash scripts/check-scope-tests.sh
          bash scripts/check-mobile-lib-flat.sh
      - name: CI policy tests
        if: needs.changes.outputs.any-code == 'true' || github.event_name == 'push'
        # Focused policy checks for dependencies and shell glue. Keeps them
        # honest without spinning up the full integration matrix.
        run: |
          node scripts/ci/__tests__/shell-quote-security-policy.test.cjs
          bash scripts/ci/__tests__/api-prod-policy.test.sh
          bash scripts/ci/__tests__/stress-viewer-policy.test.sh
          bash scripts/ci/__tests__/stress-auth-error-policy.test.sh
          bash scripts/ci/__tests__/verify-readyz.test.sh
          bash scripts/ci/__tests__/verify-api-release.test.sh
          bash scripts/ci/__tests__/mobile-ota-release-policy.test.sh
          bash scripts/ci/__tests__/dashboard-visual-contract.test.sh
          bash scripts/ci/__tests__/check-no-maestro-point-taps.test.sh
          bash scripts/ci/__tests__/prepare-android-emulator.test.sh
          bash scripts/ci/__tests__/storage-lifecycle-deploy-policy.test.sh
          bash scripts/ci/__tests__/repair-storage-worker-topology.test.sh
          bash scripts/ci/__tests__/verify-storage-worker-started.test.sh
          bash scripts/ci/__tests__/verify-deployed-sha.test.sh
          bash scripts/ci/__tests__/release-confidence-gates.test.sh
          bash scripts/ci/__tests__/admin-site-separation.test.sh
          bash scripts/ci/__tests__/admin-deploy-smoke-policy.test.sh
          bash scripts/ci/__tests__/cloudflare-pages-build.test.sh
          bash scripts/ci/__tests__/cloudflare-pages-git-policy.test.sh
          bash scripts/ci/__tests__/verify-pages-deployment.test.sh
          bash scripts/ci/__tests__/dependabot-trust-policy.test.sh
      - name: Shellcheck CI helpers
        if: needs.changes.outputs.any-code == 'true' || github.event_name == 'push'
        # Lint shared shell scripts that ship in CI workflows. Catches
        # syntactic regressions (unquoted vars, broken loops, useless
        # echos) at PR time, before they reach dev/main and break a
        # post-merge-only workflow. Covers:
        #   - scripts/ci/*.sh           — shared CI helpers (verify-readyz, …)
        #   - scripts/journeys/*.sh     — post-deploy smoke scripts run
        #                                 from api-dev / api-prod
        # See docs/v4/arch-cicd-and-migrations.md "Workflow trigger matrix"
        # for the post-merge-only blind spot this guards.
        run: |
          shellcheck --version
          find scripts/ci scripts/journeys -name '*.sh' -print0 | xargs -0 shellcheck
          shellcheck scripts/maestro/prepare-android-emulator.sh
