name: main-gate

# Pre-merge gate for PRs targeting `main` (production).
#
# Runs the curl journey suite against an exact-SHA deployment to prove the
# contract still works end-to-end before changing `main`. Normal `dev → main`
# promotions use the live dev deployment. Focused API/admin main hotfixes use
# the isolated Fly + Neon environment created by `pr-preview.yml` for that PR.
# Website-only focused PRs verify their exact-SHA Pages preview instead.
# Required check on `main`'s branch protection — see
# docs/v4/arch-cicd-and-migrations.md.
#
# Normal promotions reuse dev's already-proved deployment. Focused hotfixes use
# one isolated preview so the exact PR head can be tested without exposing
# production data or pointing older code at dev's newer schema.

on:
  pull_request:
    branches: [main]

concurrency:
  group: main-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 180 # site-preview includes a 150-minute deployment window
    permissions:
      actions: read
      contents: read
    steps:
      - name: Reject direct Dependabot production promotions
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        run: |
          echo "::error::Port the dependency update through dev in a coordinated, human-owned PR before promoting it to main." >&2
          exit 1

      - uses: actions/checkout@v7
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          lfs: true # voice samples for core/extended journeys
          fetch-depth: 0

      - name: Resolve production gate scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "$HEAD_REF" == "dev" ]]; then
            echo "kind=api" >> "$GITHUB_OUTPUT"
          else
            git show "$BASE_SHA:scripts/ci/main-gate-scope.cjs" > "$RUNNER_TEMP/main-gate-scope.cjs"
            kind=$(node "$RUNNER_TEMP/main-gate-scope.cjs" "$BASE_SHA" "$HEAD_SHA")
            echo "kind=$kind" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for exact-SHA site validation and deployment
        if: >-
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          steps.scope.outputs.kind == 'site'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_WORKFLOW_FILE: site-preview.yml
          PREVIEW_JOB_NAME: deployment
          PREVIEW_RUN_ATTEMPTS: 990
        run: bash scripts/ci/wait-for-pr-preview.sh

      - name: Verify exact-SHA website preview
        if: >-
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          steps.scope.outputs.kind == 'site'
        env:
          SITE_PREVIEW_ORIGIN: https://pr-${{ github.event.pull_request.number }}.harpa-pro.pages.dev
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: pr-${{ github.event.pull_request.number }}
        run: >-
          bash scripts/ci/verify-pages-deployment.sh
          --origin "$SITE_PREVIEW_ORIGIN"
          --commit "$PR_HEAD_SHA"
          --branch "$PR_BRANCH"
          --redirect-path /guides/getting-started
          --redirect-suffix /reports/docs/guides/getting-started

      - name: Resolve exact-SHA journey target
        id: target
        if: >-
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          steps.scope.outputs.kind == 'api'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          DEV_HEALTH_URL: ${{ vars.API_HEALTH_URL_DEV || 'https://harpa-pro-api-dev.fly.dev/healthz' }}
          PREVIEW_BASE_URL: https://harpa-pro-api-pr-${{ github.event.pull_request.number }}.fly.dev
        run: |
          set -euo pipefail
          if [[ "$HEAD_REF" == "dev" ]]; then
            base_url="${DEV_HEALTH_URL%/healthz}"
          else
            base_url="$PREVIEW_BASE_URL"
          fi
          echo "base_url=$base_url" >> "$GITHUB_OUTPUT"

      - name: Wait for exact-SHA preview provenance
        if: >-
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.event.pull_request.head.ref != 'dev' &&
          steps.scope.outputs.kind == 'api'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci/wait-for-pr-preview.sh

      - name: Verify deployed SHA
        if: >-
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          steps.scope.outputs.kind == 'api'
        env:
          HEALTH_URL: ${{ steps.target.outputs.base_url }}/healthz
          EXPECTED_GIT_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci/verify-deployed-sha.sh

      - name: Run journeys against verified target
        if: >-
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          steps.scope.outputs.kind == 'api'
        # Order: stress (~10s, no AI) → core (~3min, live AI) → extended (~5min, live AI).
        # The target was SHA-bound above, whether it is shared dev or an
        # isolated focused-hotfix preview.
        env:
          PASSWORD: ${{ secrets.TEST_ACCOUNT_PASSWORD_DEV }}
          EMAIL: ${{ vars.TEST_ACCOUNT_EMAIL_DEV }}
          EMAIL2: ${{ vars.TEST_ACCOUNT_EMAIL2_DEV }}
        run: |
          if [[ -z "${EMAIL:-}" ]]; then
            echo "::error::TEST_ACCOUNT_EMAIL_DEV repo variable is unset; cannot run journeys" >&2
            exit 1
          fi
          bash scripts/journeys/all.sh "${{ steps.target.outputs.base_url }}"
