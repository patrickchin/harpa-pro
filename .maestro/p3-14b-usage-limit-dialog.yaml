appId: ${MAESTRO_APP_ID}
name: P3.14b — Usage-limit dialog on 403 usage_limit_exceeded
tags:
  - p3
  - usage-limits
# Phase 3 of per-account usage limits (docs/v4/arch-usage-limits.md
# §11). When the report generate / regenerate route returns 403
# `usage_limit_exceeded`, the GenerateNotes screen mounts the
# UsageLimitDialog (themed AppDialogSheet — hard rule #4: no
# Alert.alert).
#
# **Status: not yet wired into CI.** Two reasons:
#
#   1. Reaching the "limit-hit" state deterministically needs a DB
#      seed step that pre-loads the user's `app.report_usage` rows
#      to the plan cap (free = 5). `scripts/maestro/reset-db.sh`
#      does not yet do that — add a `seed-at-limit` flag before
#      enabling this flow in the regression journey.
#   2. The alternative — generating 5 reports inline — costs real
#      AI tokens and takes minutes, so it should stay opt-in.
#
# When enabling, expected wiring:
#   ./scripts/maestro/reset-db.sh --seed-at-limit
#   maestro test .maestro/p3-14b-usage-limit-dialog.yaml
#
# The dialog is keyed by:
#   - title text "Monthly limit reached"
#   - `usage-limit-dialog-ok` (OK button)
#   - `usage-limit-dialog-details` (the plan/override hint slot)
---
- launchApp:
    clearState: true
    clearKeychain: true
    stopApp: true
- waitForAnimationToEnd
- openLink: harpa://sign-in/phone
- assertVisible:
    id: "input-phone"
- runFlow: helpers/sign-in-alice.yaml

# --- Create a project and a draft report ----------------------------------
- tapOn:
    id: "btn-new-project"
- extendedWaitUntil:
    visible:
      id: "input-project-name"
    timeout: 10000
- tapOn:
    id: "input-project-name"
- inputText: "Limit Hit Test"
- tapOn:
    point: "50%,15%"
- tapOn:
    id: "btn-create-project"
- extendedWaitUntil:
    visible:
      id: "btn-open-reports"
    timeout: 10000
- tapOn:
    id: "btn-open-reports"
- extendedWaitUntil:
    visible:
      id: "btn-new-report"
    timeout: 10000
- tapOn:
    id: "btn-new-report"
- extendedWaitUntil:
    visible:
      id: "input-note"
    timeout: 15000

# --- Add a text note so the Generate button is enabled --------------------
- tapOn:
    id: "input-note"
- inputText: "Usage-limit regression note."
- tapOn:
    point: "50%,15%"
- tapOn:
    id: "btn-add-note"
- extendedWaitUntil:
    visible:
      id: "note-row-.*"
    timeout: 8000

# --- Tap Generate. Because Alice is at her per-month report cap, the
#     route returns 403 usage_limit_exceeded. The mobile error handler
#     parses the envelope (lib/api/usage-limit-error.ts) and opens
#     UsageLimitDialog instead of the inline error banner. -----------------
- tapOn:
    id: "btn-generate-report"
- extendedWaitUntil:
    visible:
      text: "Monthly limit reached"
    timeout: 30000

# --- Dialog content + dismiss ---------------------------------------------
- assertVisible:
    id: "usage-limit-dialog-details"
- assertVisible:
    id: "usage-limit-dialog-ok"
- tapOn:
    id: "usage-limit-dialog-ok"
- assertNotVisible:
    text: "Monthly limit reached"

# --- Cleanup --------------------------------------------------------------
# We don't delete the project here — the at-limit state is the
# whole point of the seed, so a separate cleanup pass should drop
# the test project + reset the usage table.
