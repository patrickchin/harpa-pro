appId: ${MAESTRO_APP_ID}
name: "Regression journey — full end-to-end"
tags:
  - regression
---
# Full regression journey
#
# Sequence:
#   1. Auth — sign up alice, sign out, sign in
#   2. Projects CRUD — create, edit
#   3. Members invite — alice invites bob as Editor (signs bob up too)
#   4. Members permissions — bob verifies editor access
#   5. Members viewer — alice downgrades bob; bob loses edit buttons
#   6. Members remove — alice removes bob; bob can't see project
#   7. Reports CRUD — create, navigate, delete report
#   8. Text notes — add and delete a text note
#   9. Voice notes — record (fixture) + transcript card on timeline
#  10a. Photo notes (draft) — camera capture → upload → image note
#  11. Generate + finalize — add note, generate, view report, finalize, unfinalize, re-finalize
#  12. Report debug — verify debug screen sections
#  13. Projects delete — delete the project, verify gone
#  14. Account — view profile, edit + cancel, edit + save
#  15. Usage — open Usage from Profile, assert screen renders
#  16. Profile — identity card + nav targets visible
#  17. Sign out cleanly
#
# Pre-condition: clean database. Run `docker compose down -v && docker
# compose up` locally to reset between runs. Alice (+15550000001) and
# Bob (+15550000002) are created via the normal sign-up flow as part of
# the journey; no API backdoors needed.
#
# OTP code: `000000` (TWILIO_VERIFY_FAKE_CODE default, accepted when
# TWILIO_LIVE=0 — the default for local dev).

# ── 1. Auth (sign-up alice + sign-out + sign-in) ─────────────────────────
- runFlow: modules/01-auth.yaml

# ── 1b. Sign-up bob (must exist before alice can invite him) ──────────────
- runFlow: modules/01b-signup-bob.yaml

# ── 2. Projects CRUD ──────────────────────────────────────────────────────
- runFlow: modules/02-projects-crud.yaml

# ── 3. Members invite ─────────────────────────────────────────────────────
- runFlow: modules/03-members-invite.yaml

# ── 4. Members permissions (editor) ───────────────────────────────────────
- runFlow: modules/04-members-permissions.yaml

# ── 5. Members viewer downgrade ────────────────────────────────────────────
- runFlow: modules/05-members-viewer.yaml

# ── 6. Members remove ─────────────────────────────────────────────────────
- runFlow: modules/06-members-remove.yaml

# ── 7. Reports CRUD ───────────────────────────────────────────────────────
# Module 06 ends with alice signed in on the project home, so we go
# straight into 07 without re-running the sign-in helper.
- runFlow: modules/07-reports-crud.yaml

# ── 8. Text notes ─────────────────────────────────────────────────────────
# Pre-condition: alice on project home
- runFlow: modules/08-text-notes.yaml

# ── 9. Voice notes (fixture recorder) ─────────────────────────────────────
# DISABLED on iOS: the fixture voice asset path uses Metro dynamic
# import (`await import('@/assets/fixtures/voice-sample.m4a')`) which
# does not resolve at runtime on iOS sim (see morning-review.md).
# Re-enable once the recorder asset loader is fixed.
# - runFlow: modules/09-voice-notes.yaml

# ── 10a. Photo notes (draft): camera → upload pipeline ────────────────────
# Pre-condition: alice on project home
# Requires: app built with EXPO_PUBLIC_USE_FIXTURES=true; camera
# privacy grant on the sim.
- runFlow: modules/10a-photo-notes-draft.yaml

# ── 11. Generate + finalize ───────────────────────────────────────────────
# Pre-condition: alice on project home
- runFlow: modules/11-generate-finalize.yaml

# ── 12. Report debug ──────────────────────────────────────────────────────
# Pre-condition: alice on finalized saved-report screen
- runFlow: modules/12-report-debug.yaml

# ── 13. Projects delete ───────────────────────────────────────────────────
# Pre-condition: alice on saved-report screen
- runFlow: modules/13-projects-delete.yaml

# ── 14. Account screen ────────────────────────────────────────────────────
# Pre-condition: alice on empty projects index (post-13)
- runFlow: modules/14-account.yaml

# ── 15. Usage screen ──────────────────────────────────────────────────────
# Pre-condition: alice on profile screen (post-14)
- runFlow: modules/15-usage.yaml

# ── 16. Profile identity + nav surface ────────────────────────────────────
# Pre-condition: alice on profile screen (post-15)
- runFlow: modules/16-profile.yaml

# ── 17. Sign out cleanly ──────────────────────────────────────────────────
- runFlow: helpers/sign-out.yaml
