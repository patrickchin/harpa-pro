appId: ${MAESTRO_APP_ID}
name: "06-dev - Members: test removes test2; test2 no longer sees project"
tags:
  - regression
  - members
  - dev
---

- tapOn:
    id: "link-project-members"
- extendedWaitUntil:
    visible:
      id: "member-row-.*"
    timeout: 10000
- tapOn:
    id: "btn-remove-member-.*"
- extendedWaitUntil:
    visible:
      id: "confirm-remove-member"
    timeout: 8000
- tapOn:
    id: "confirm-remove-member"
- extendedWaitUntil:
    notVisible:
      text: "Viewer"
    timeout: 8000

- tapOn:
    id: "btn-back"
- extendedWaitUntil:
    visible:
      id: "btn-project-edit"
    timeout: 10000

- runFlow: ../helpers/sign-out.yaml
- runFlow:
    file: ../helpers/dev-password-login.yaml
    env:
      EMAIL_ENCODED: "test2%40harpapro.com"
      NAME: "Test Two Dev E2E"
      COMPANY: "Dev E2E Corp"

- assertNotVisible:
    text: "${PROJECT_NAME_EDITED}"

- runFlow: ../helpers/sign-out.yaml
- runFlow:
    file: ../helpers/dev-password-login.yaml
    env:
      EMAIL_ENCODED: "test%40harpapro.com"
      NAME: "Test Dev E2E"
      COMPANY: "Dev E2E Corp"
- runFlow: ../helpers/open-project-dev.yaml
