[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maestro-orchestrator"
version = "0.1.0"
description = "mo — orchestrator for Maestro E2E runs across Windows+Android and macOS+iOS Simulator."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "harpa-pro" }]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "psutil>=5.9",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.scripts]
mo = "maestro_orchestrator.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-mock>=3.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/maestro_orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
