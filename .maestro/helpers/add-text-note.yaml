appId: ${MAESTRO_APP_ID}
---
# add-text-note.yaml - helper: add one text note to the current draft report.
#
# Required env:
#   NOTE_INDEX - expected zero-based note row index after the note is saved.
#   NOTE_TEXT  - note body to type.
#
# Pre-condition: current screen is the draft generate Notes tab.
# Post-condition: the expected note row is visible.
- tapOn:
    id: "input-note"
- inputText: "${NOTE_TEXT}"
- tapOn:
    id: "btn-add-note"
- extendedWaitUntil:
    visible:
      id: "note-row-${NOTE_INDEX}"
    timeout: 15000
# The multiline RN TextInput is not reliably dismissible via hideKeyboard on
# iOS XCTest. The Add button sits above the keyboard, so save first, then drag
# the notes list to restore the generate chrome for the next command.
- swipe:
    direction: DOWN
    duration: 500
- waitForAnimationToEnd
