appId: ${MAESTRO_APP_ID}
name: "15 — Usage screen: navigate + render"
tags:
  - regression
  - usage
---
# Module 15 — Usage screen render
#
# Covers:
#   - navigate from Profile → Usage (`btn-open-usage`)
#   - usage screen renders (`screen-usage`)
#   - one of {usage-loading → usage-empty / usage-by-model /
#     usage-recent-events} resolves within a reasonable timeout
#   - per-account limits card renders with the default free-plan buckets
#
# We assert the empty-state path because the regression journey never
# generates a paid report — test never crossed any usage threshold.
# If a future module finalises a real report, swap to assert
# `usage-by-model` or `usage-recent-events`.
#
# Pre-condition: test signed in on profile screen.
# Post-condition: test on profile screen.

# --- Open Usage from Profile -----------------------------------------------
- tapOn:
    id: "btn-open-usage"
- extendedWaitUntil:
    visible:
      id: "screen-usage"
    timeout: 10000

# --- Either the empty state, the by-model card, or events list is visible --
# Loading spinner clears within a few seconds; we accept any of the
# steady-state surfaces.
- extendedWaitUntil:
    notVisible:
      id: "usage-loading"
    timeout: 15000

# At least one of these should be visible. We probe each as optional
# and rely on the assertion that follows.
- runFlow:
    when:
      visible:
        id: "usage-empty"
    commands:
      - assertVisible:
          id: "usage-empty"
- runFlow:
    when:
      visible:
        id: "usage-by-model"
    commands:
      - assertVisible:
          id: "usage-by-model"
- runFlow:
    when:
      visible:
        id: "usage-recent-events"
    commands:
      - assertVisible:
          id: "usage-recent-events"

# --- UsageLimitsCard mounts when /me/limits resolves -----------------------
# This card is rendered for every signed-in user. The default free-plan
# buckets are stable enough to assert directly, replacing the old
# standalone P3.14a flow.
- extendedWaitUntil:
    visible:
      id: "usage-limits-card"
    timeout: 10000
- assertVisible:
    id: "usage-limits-plan"
- assertVisible:
    id: "usage-limit-report_generate"
- assertVisible:
    id: "usage-limit-bar-report_generate"
- assertVisible:
    id: "usage-limit-voice_transcribe"
- assertVisible:
    id: "usage-limit-voice_summarize"

# --- Back to profile -------------------------------------------------------
- tapOn:
    id: "btn-back"
- extendedWaitUntil:
    visible:
      id: "screen-profile"
    timeout: 10000
