# Fly.io app config for @harpa/api (dev environment).
# Mirrors fly.toml but targets harpa-pro-api-dev.
# Deployed automatically on push to `dev` by api-dev.yml.
# Create the app once with: flyctl apps create harpa-pro-api-dev

app = "harpa-pro-api-dev"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Apply pending migrations AND seed test accounts inside the release
  # machine so a broken migration or missing test-user aborts the
  # rollout cleanly. Matches prod (fly.toml) for migrate; the seed
  # step is dev-only because TEST_ACCOUNT_EMAILS / TEST_ACCOUNT_PASSWORD
  # are intentionally unset in prod, so the seed script no-ops there
  # if you ever re-use this layout. api-dev.yml ALSO runs db:migrate
  # against the Neon dev branch from CI as a pre-flight — release_command
  # is the belt to that braces. See docs/v4/arch-cicd-and-migrations.md
  # and docs/bugs/2026-06-06-test-accounts-never-seeded-on-dev.md.
  release_command = "sh -c 'pnpm --filter @harpa/api db:migrate && pnpm --filter @harpa/api db:migrate:admin && pnpm --filter @harpa/api db:seed-test-account'"

[env]
  NODE_ENV = "production"
  PORT = "8787"
  BACKGROUND_MAINTENANCE_ENABLED = "0"
  ADMIN_CORS_ORIGINS = "https://dev.harpa-pro-admin.pages.dev"

[processes]
  app = "pnpm --filter @harpa/api exec tsx src/server.ts"
  # Match production's single-process launcher and memory headroom so dev
  # catches worker-runtime regressions before promotion.
  storage-worker = "node --import tsx packages/api/src/workers/storage-delete.ts"

[http_service]
  processes = ["app"]
  internal_port = 8787
  force_https = true
  # Use `suspend` (not `stop`) so the dev API resumes in <500ms when
  # the first request hits a sleeping machine — matters for the iOS
  # simulator round-trip during development. Still allows full sleep
  # (min_machines_running = 0) to keep dev cheap.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0 # allow full auto-sleep to save cost on dev

  # Mirror prod's burst-scale trigger so dev catches concurrency
  # regressions early (e.g. a route that holds a DB connection too
  # long would saturate one machine and force a scale-up here too).
  [http_service.concurrency]
    type = "requests"
    soft_limit = 25
    hard_limit = 50

# Application DB readiness probe. Admin DB readiness is checked separately
# after deployment at /admin/readyz.
[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/readyz"

[[vm]]
  processes = ["app"]
  size = "shared-cpu-1x"
  memory = "512mb"

[[vm]]
  processes = ["storage-worker"]
  size = "shared-cpu-1x"
  memory = "512mb"
