name: dashboard-preview

# Test and deploy the office dashboard to a unique Cloudflare Pages preview.
# Every dashboard preview uses the matching isolated Fly/Neon PR backend so
# live browser journeys never mutate the shared dev environment. Forks are
# skipped because deployment and test credentials are unavailable.

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'apps/dashboard/**'
      - 'packages/api/**'
      - 'packages/api-contract/**'
      - 'packages/ai-fixtures/**'
      - 'packages/design-tokens/**'
      - 'packages/report-core/**'
      - '.github/actions/changed-paths/**'
      - '.github/actions/setup-monorepo/**'
      - '.github/workflows/dashboard-*.yml'
      - '.github/workflows/pr-preview.yml'
      - 'infra/fly/fly.preview.toml'
      - 'scripts/ci/ensure-dashboard-pages-project.sh'
      - 'scripts/ci/verify-dashboard-pages.sh'
      - 'scripts/ci/verify-api-release.sh'
      - 'scripts/ci/__tests__/dashboard-live-e2e-policy.test.sh'
      - 'scripts/ci/__tests__/dashboard-pages-policy.test.sh'
      - 'scripts/ci/__tests__/ensure-dashboard-pages-project.test.sh'
      - 'scripts/ci/__tests__/verify-dashboard-pages.test.sh'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tsconfig*.json'

concurrency:
  group: dashboard-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-monorepo

      - name: Select preview API
        id: api
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          base_url="https://harpa-pro-api-pr-${PR_NUMBER}.fly.dev"
          echo "base-url=$base_url" >> "$GITHUB_OUTPUT"
          echo "VITE_API_BASE_URL=$base_url" >> "$GITHUB_ENV"

      - name: Test dashboard deployment policy
        run: |
          bash scripts/ci/__tests__/dashboard-pages-policy.test.sh
          bash scripts/ci/__tests__/dashboard-live-e2e-policy.test.sh
          bash scripts/ci/__tests__/ensure-dashboard-pages-project.test.sh
          bash scripts/ci/__tests__/verify-dashboard-pages.test.sh

      - name: Validate dashboard live identities
        shell: bash
        env:
          DASHBOARD_LIVE_OWNER_EMAIL: ${{ vars.TEST_ACCOUNT_EMAIL_DEV }}
          DASHBOARD_LIVE_EDITOR_EMAIL: ${{ vars.TEST_ACCOUNT_EMAIL2_DEV }}
        run: |
          if [[ -z "$DASHBOARD_LIVE_OWNER_EMAIL" || -z "$DASHBOARD_LIVE_EDITOR_EMAIL" ]]; then
            echo "::error::TEST_ACCOUNT_EMAIL_DEV and TEST_ACCOUNT_EMAIL2_DEV must match the Doppler test-account allowlist"
            exit 1
          fi

      - name: Test dashboard
        run: pnpm --filter @harpa/dashboard test

      - name: Lint dashboard
        run: pnpm --filter @harpa/dashboard lint

      - name: Typecheck dashboard
        run: pnpm --filter @harpa/dashboard typecheck

      - name: Install dashboard browser engines
        run: pnpm --filter @harpa/dashboard exec playwright install --with-deps chromium firefox webkit msedge

      - name: Test dashboard browser journeys
        run: pnpm --filter @harpa/dashboard test:e2e

      - name: Build dashboard
        env:
          VITE_API_BASE_URL: ${{ steps.api.outputs.base-url }}
          VITE_PASSWORD_ACCOUNT_EMAILS: '${{ vars.TEST_ACCOUNT_EMAIL_DEV }},${{ vars.TEST_ACCOUNT_EMAIL2_DEV }}'
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DASHBOARD_DSN }}
          VITE_SENTRY_ENVIRONMENT: preview
          VITE_SENTRY_RELEASE: ${{ github.sha }}
        run: pnpm --filter @harpa/dashboard build

      - name: Assert Cloudflare Pages SPA artifact
        shell: bash
        run: |
          test -f apps/dashboard/dist/index.html
          if [[ -e apps/dashboard/dist/404.html ]]; then
            echo "::error::A top-level 404.html disables Cloudflare Pages SPA routing"
            exit 1
          fi

      - name: Verify compatible preview API
        env:
          API_HEALTH_URL: ${{ steps.api.outputs.base-url }}/healthz
          API_READY_URL: ${{ steps.api.outputs.base-url }}/readyz
          # This preview is rebuilt for every dashboard PR, so an ancestor is
          # never sufficient: browser and API must share the exact merge SHA.
          API_PATH_PATTERN: '.*'
          # pr-preview.yml and this workflow both test GitHub's synthetic
          # pull-request merge ref, so compatibility must use github.sha.
          EXPECTED_GIT_COMMIT: ${{ github.sha }}
          API_RELEASE_ATTEMPTS: 60
          API_RELEASE_SLEEP: 10
        run: bash scripts/ci/verify-api-release.sh

      - name: Ensure dashboard Cloudflare Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/ci/ensure-dashboard-pages-project.sh

      - name: Deploy dashboard preview to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: pnpm
          command: >-
            pages deploy apps/dashboard/dist
            --project-name=harpa-pro-dashboard
            --branch=pr-${{ github.event.pull_request.number }}
            --commit-hash=${{ github.sha }}
            --commit-dirty=true

      - name: Verify deployed dashboard SPA
        if: steps.deploy.outputs.deployment-url
        env:
          DASHBOARD_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: bash scripts/ci/verify-dashboard-pages.sh

      - uses: dopplerhq/cli-action@v4

      - name: Load dashboard live credentials
        if: steps.deploy.outputs.deployment-url
        shell: bash
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_DEV }}
        run: |
          set -euo pipefail
          dashboard_live_password="$(doppler secrets get TEST_ACCOUNT_PASSWORD --plain)"
          if [[ -z "$dashboard_live_password" ]]; then
            echo "::error::TEST_ACCOUNT_PASSWORD is missing from Doppler dev"
            exit 1
          fi
          echo "::add-mask::$dashboard_live_password"
          echo "DASHBOARD_LIVE_PASSWORD=$dashboard_live_password" >> "$GITHUB_ENV"

      - name: Test deployed dashboard live journeys
        if: steps.deploy.outputs.deployment-url
        shell: bash
        env:
          DASHBOARD_LIVE_BASE_URL: ${{ steps.deploy.outputs.deployment-url }}
          DASHBOARD_LIVE_API_URL: ${{ steps.api.outputs.base-url }}
          DASHBOARD_LIVE_OWNER_EMAIL: ${{ vars.TEST_ACCOUNT_EMAIL_DEV }}
          DASHBOARD_LIVE_EDITOR_EMAIL: ${{ vars.TEST_ACCOUNT_EMAIL2_DEV }}
          DASHBOARD_LIVE_RUN_ID: pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: pnpm --filter @harpa/dashboard test:e2e:live

      - name: Upload live journey failure screenshots
        if: failure() && steps.deploy.outputs.deployment-url
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-live-e2e-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: apps/dashboard/test-results-live/**/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Comment dashboard preview URLs on PR
        if: steps.deploy.outputs.deployment-url
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: dashboard-preview
          message: |
            ### Office dashboard preview

            - **Test URL (this commit):** ${{ steps.deploy.outputs.deployment-url }}
            - **PR alias (latest push):** ${{ steps.deploy.outputs.pages-deployment-alias-url }}
            - **API:** ${{ steps.api.outputs.base-url }}
            - **Tested merge:** `${{ github.sha }}`
            - **PR head:** `${{ github.event.pull_request.head.sha }}`

            The immutable test URL and direct client-side route passed the
            Cloudflare Pages SPA check. The deployed Chromium journey also
            exercised real auth, Fly, Neon, and one live AI generation against
            the isolated `harpa-pro-api-pr-${{ github.event.pull_request.number }}` preview.
