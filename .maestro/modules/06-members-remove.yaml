appId: ${MAESTRO_APP_ID}
name: "06 — Members: test removes test2; test2 no longer sees project"
tags:
  - regression
  - members
---
# Module 06 — Member removal
#
# Covers:
#   - test opens members screen
#   - taps remove button on test2's row
#   - confirms removal via confirm-remove-member dialog
#   - test2's row disappears
#   - sign in as test2: test2's project list does NOT include the project
#   - restore test
#
# Pre-condition: test on project home; test2 is a viewer member.
# Post-condition: test on project home; test2 is removed.

# --- Test opens members ---------------------------------------------------
- tapOn:
    id: "link-project-members"
- extendedWaitUntil:
    visible:
      id: "member-row-.*"
    timeout: 10000

# --- Remove test2's row -------------------------------------------------------
- tapOn:
    id: "btn-remove-member-.*"
- extendedWaitUntil:
    visible:
      id: "confirm-remove-member"
    timeout: 8000
- tapOn:
    id: "confirm-remove-member"

# --- Confirm test2's row is gone ---------------------------------------------
# `member-row-.*` still matches test's owner row, so we assert the
# "Viewer" badge (only test2 had it) is gone instead.
- extendedWaitUntil:
    notVisible:
      text: "Viewer"
    timeout: 8000

# --- Go back to project home -----------------------------------------------
- tapOn:
    id: "btn-back"
- extendedWaitUntil:
    visible:
      id: "btn-project-edit"
    timeout: 10000

# --- Switch to test2 — test2 no longer sees the project -----------------------
- runFlow: ../helpers/sign-out.yaml
- runFlow:
    file: ../helpers/sign-in.yaml
    env:
      EMAIL: "test2@harpapro.com"

# Test Two's project list should be empty (no project row for test's project)
- assertNotVisible:
    text: "Regression Test Project \\(Edited\\)"

# --- Switch back to test ---------------------------------------------------
- runFlow: ../helpers/sign-out.yaml
- runFlow:
    file: ../helpers/sign-in.yaml
    env:
      EMAIL: "test@harpapro.com"
- runFlow: ../helpers/open-project.yaml
