appId: ${MAESTRO_APP_ID}
name: "03-dev - Members: test invites test2 as editor"
tags:
  - regression
  - members
  - dev
---
- tapOn:
    id: "link-project-members"
- extendedWaitUntil:
    visible:
      id: "btn-show-add-member"
    timeout: 10000
- tapOn:
    id: "btn-show-add-member"
- extendedWaitUntil:
    visible:
      id: "input-member-email"
    timeout: 8000
- tapOn:
    id: "input-member-email"
- inputText: "test2@harpapro.com"
- hideKeyboard
- tapOn:
    id: "picker-member-role-editor"
- tapOn:
    id: "btn-add-member"
- extendedWaitUntil:
    visible:
      id: "member-row-.*"
    timeout: 10000
- tapOn:
    id: "btn-back"
- extendedWaitUntil:
    visible:
      id: "btn-project-edit"
    timeout: 10000
