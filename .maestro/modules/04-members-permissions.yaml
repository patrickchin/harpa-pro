appId: ${MAESTRO_APP_ID}
name: "04 — Members: test2 sees project and can edit as editor"
tags:
  - regression
  - members
---
# Module 04 — Member permissions (editor)
#
# Covers:
#   - sign out test → sign in test2
#   - test2 sees the project in his list (test invited him)
#   - test2 opens the project home
#   - test2's role badge shows "Editor"
#   - test2 can access the reports screen (editor has reports access)
#   - sign out test2 → sign in test (restore for next module)
#
# Pre-condition: test is signed in.
# Post-condition: test is signed in on project home.

# --- Switch to test2 ---------------------------------------------------------
- runFlow: ../helpers/sign-out.yaml
- runFlow:
    file: ../helpers/sign-in.yaml
    env:
      EMAIL: "test2@harpapro.com"

# --- Test Two sees the project ---------------------------------------------------
- assertVisible:
    text: "Regression Test Project \\(Edited\\)"
- tapOn:
    text: "Regression Test Project \\(Edited\\)"

# --- Test Two's role badge shows Editor -----------------------------------------
# The role badge lives on the project members screen (one badge per
# member row, testID `member-role-badge-<userId>`), not on the project
# home. Navigate there from the "Members" card.
- extendedWaitUntil:
    visible:
      id: "btn-project-edit"
    timeout: 10000
- tapOn:
    id: "link-project-members"
- extendedWaitUntil:
    visible:
      text: "Editor"
    timeout: 10000
- tapOn:
    id: "btn-back"

# --- Test Two can open reports ---------------------------------------------------
- tapOn:
    id: "btn-open-reports"
- extendedWaitUntil:
    visible:
      id: "btn-new-report"
    timeout: 10000
- tapOn:
    id: "btn-back"

# --- Switch back to test ---------------------------------------------------
- tapOn:
    id: "btn-back"
- runFlow: ../helpers/sign-out.yaml
- runFlow:
    file: ../helpers/sign-in.yaml
    env:
      EMAIL: "test@harpapro.com"

# --- Test navigates back to project home ----------------------------------
- runFlow: ../helpers/open-project.yaml
