appId: ${MAESTRO_APP_ID}
---
# sign-out.yaml — helper: sign the current user out
#
# Navigates to Profile tab → Developer section sign-out button,
# then waits for the sign-in screen.
#
# Pre-condition: app is logged in (Projects list or any (app) tab visible).
# Post-condition: sign-in screen (input-phone visible).
#
# Usage:
#   - runFlow: .maestro/helpers/sign-out.yaml

# Defensive: if the Expo dev-menu sheet is somehow already open
# (iOS shake gesture quirks during the run), close it first.
- runFlow:
    when:
      visible: "Reload"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 3000
- tapOn:
    id: "btn-open-profile"
# On Android dev builds the floating "Tools" overlay button sits at the
# same top-right corner as `btn-open-profile`, and on iOS the expo
# dev-menu trigger sits there too. Tapping `btn-open-profile` sometimes
# lands on the dev-menu instead (Android: "Tools button"; iOS:
# Reload/Go home sheet with Close X). Dismiss it if it's there and
# re-tap.
- runFlow:
    when:
      visible: "Tools button"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd
      - tapOn:
          id: "btn-open-profile"
- runFlow:
    when:
      visible: "Reload"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd
      - tapOn:
          id: "btn-open-profile"
- extendedWaitUntil:
    visible:
      id: "btn-sign-out"
    timeout: 10000
- tapOn:
    id: "btn-sign-out"
- extendedWaitUntil:
    visible:
      id: "input-phone"
    timeout: 10000
