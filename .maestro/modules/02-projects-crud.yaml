appId: ${MAESTRO_APP_ID}
name: "02 — Projects CRUD: create, edit, verify"
tags:
  - regression
  - projects
---
# Module 02 — Projects CRUD
#
# Covers:
#   - create a new project (name, client, address)
#   - edit project name
#   - project home is accessible (btn-project-edit visible)
#
# Pre-condition: alice is signed in (btn-new-project visible).
# Post-condition: alice is on project home of the renamed project.

# --- Create project ---------------------------------------------------------
- tapOn:
    id: "btn-new-project"
- extendedWaitUntil:
    visible:
      id: "input-project-name"
    timeout: 10000
- tapOn:
    id: "input-project-name"
- inputText: "Regression Test Project"
- tapOn:
    id: "input-client-name"
- inputText: "Regression Client"
- tapOn:
    id: "input-project-address"
- inputText: "1 Regression Way"
- tapOn:
    point: "50%,15%"
- tapOn:
    id: "btn-save-project"

# --- Project home visible ---------------------------------------------------
- extendedWaitUntil:
    visible:
      id: "btn-project-edit"
    timeout: 10000

# --- Edit project name ------------------------------------------------------
- tapOn:
    id: "btn-project-edit"
- extendedWaitUntil:
    visible:
      id: "input-edit-project-name"
    timeout: 10000
- tapOn:
    id: "input-edit-project-name"
- eraseText: 50
- inputText: "Regression Test Project (Edited)"
# Dismiss the soft keyboard and scroll the save button into view. On
# the edit screen, the Save button sits below the Delete button at the
# bottom of a ScrollView, so the keyboard often hides it.
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "btn-save-project"
    direction: DOWN
- tapOn:
    id: "btn-save-project"

# --- Back on project home with new name ------------------------------------
- extendedWaitUntil:
    visible:
      id: "btn-project-edit"
    timeout: 10000
