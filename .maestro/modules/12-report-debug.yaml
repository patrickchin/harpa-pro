appId: ${MAESTRO_APP_ID}
name: "12 — Report Debug screen: prompt + notes + LLM response"
tags:
  - regression
  - debug
---
# Module 12 — Report Debug screen
#
# Covers:
#   - open the Report Debug screen from the actions menu
#   - debug-prompt section is visible (user prompt text)
#   - debug-report-notes section is visible (notes timeline entries)
#   - debug-llm-response section is visible (LLM output text)
#   - no debug-empty-state (because the report has been generated)
#   - navigate back to saved-report screen
#
# Pre-condition: test is on the finalized saved-report screen
#   (btn-report-actions visible); REPORT_NUMBER set.
# Post-condition: test is back on the saved-report screen.
#
# Note: showDeveloperSection is true only in fixture/dev builds
# (EXPO_PUBLIC_USE_FIXTURES=true || __DEV__). The debug button is
# hidden in production builds.

# --- Open actions menu -----------------------------------------------------
- tapOn:
    id: "btn-report-actions"
- extendedWaitUntil:
    visible:
      id: "btn-open-report-debug"
    timeout: 8000

# --- Open debug screen -----------------------------------------------------
- tapOn:
    id: "btn-open-report-debug"
- extendedWaitUntil:
    visible:
      id: "report-debug-scroll"
    timeout: 10000

# --- Verify prompt section has content ------------------------------------
# debug-prompt-system renders first and its MonoBlock is tall enough that
# debug-prompt (user prompt) can be taller than the viewport after module 11
# edits. Scroll until any meaningful part is visible; requiring 100% visibility
# is impossible for the whole section.
- scrollUntilVisible:
    element:
      id: "debug-prompt"
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 10
    centerElement: true
    optional: true
- assertVisible:
    id: "debug-prompt"
- assertVisible:
    id: "debug-prompt-text"

# --- Verify report notes section has content --------------------------------
# Section scrolls can land correctly while Maestro reports a miss; keep the
# scroll as positioning and let the assertion below enforce visibility.
- scrollUntilVisible:
    element:
      id: "debug-report-notes"
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 10
    centerElement: true
    optional: true
- assertVisible:
    id: "debug-report-notes"
- assertNotVisible:
    id: "debug-report-notes-empty"

# --- Scroll down to LLM response section -----------------------------------
- scrollUntilVisible:
    element:
      id: "debug-llm-response"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 10
    centerElement: true
    optional: true
- assertVisible:
    id: "debug-llm-response"
- assertVisible:
    id: "debug-llm-response-text"

# --- No empty state (report was generated) ---------------------------------
- assertNotVisible:
    id: "debug-empty-state"

# --- Navigate back to saved-report ----------------------------------------
- tapOn:
    id: "btn-back"
- extendedWaitUntil:
    visible:
      id: "btn-report-actions"
    timeout: 10000
