appId: ${MAESTRO_APP_ID}
---
# pick-country-us.yaml — helper: switch the phone-input country picker to US
#
# Phones used by the regression journey (+1555000000X) are US (NANP)
# numbers. The phone input's default country is determined by the
# device's region (expo-localization), which on developer hardware is
# often GB, so we explicitly switch the picker to US before typing.
#
# Pre-condition: a country-picker button (matches "btn-.*country-picker")
#                is visible. The helper opens it, searches for "United
#                States", and taps the US option.
# Post-condition: the picker is closed and the dial code reads "+1".
#
# Usage:
#   - runFlow:
#       file: ../helpers/pick-country-us.yaml
#       env:
#         COUNTRY_BUTTON_ID: "btn-signup-country-picker"   # or btn-country-picker, etc.
- runFlow:
    when:
      notVisible: "+1"
    commands:
      - tapOn:
          id: "${COUNTRY_BUTTON_ID}"
      - extendedWaitUntil:
          visible:
            id: "country-picker-sheet"
          timeout: 8000
      # iOS: empty RN TextInputs don't expose their testID via XCTest,
      # but the placeholder text "Search country or code" is rendered
      # as a visible Text element we can tap to focus the input.
      # Android: testID path also works; placeholder fallback is
      # equally fine.
      - runFlow:
          when:
            visible:
              id: "country-picker-search"
          commands:
            - tapOn:
                id: "country-picker-search"
      - runFlow:
          when:
            notVisible:
              id: "country-picker-search"
          commands:
            - tapOn:
                text: "Search country or code"
      - inputText: "United States"
      # Dismiss the keyboard by tapping the modal header (stable text,
      # always above the keyboard). `hideKeyboard` is unreliable on
      # iOS while the picker is in flux.
      - tapOn:
          text: "Select country"
      - extendedWaitUntil:
          visible:
            text: "United States of America"
          timeout: 5000
      - tapOn:
          text: "United States of America"
      - extendedWaitUntil:
          notVisible:
            id: "country-picker-sheet"
          timeout: 8000
