appId: ${MAESTRO_APP_ID}
name: Core end-to-end (all shipped features)
tags:
  - core-e2e
---
# This flow is the canonical full-journey Maestro test referenced by the
# P3 exit gate in docs/v4/plan-p3-feature-build.md. It walks through
# every currently-implemented user-visible feature on the real
# `(auth)` + `(app)` routes (not the `(dev)` gallery).
#
# Coverage:
#   - sign-up flow      (deep link `harpa://sign-up/phone`)
#   - onboarding        (conditional)
#   - sign-out + sign-in round trip
#   - projects list, new project
#   - project home: copy-client, copy-address, open-reports, open-members
#   - members: invite (role editor), filter buttons, remove-member
#   - project edit: rename + save
#   - reports list + new report
#   - generate report tabs: notes / report / edit / finalize confirm
#   - voice record (mic + camera permissions pre-granted by run script)
#   - project delete
#
# Pre-flight (must be done by the caller, not by Maestro):
#   1. docker compose up -d     # fixture-mode API on :8787
#   2. pnpm --filter @harpa/mobile start --dev-client
#   3. xcrun simctl privacy booted grant microphone ${MAESTRO_APP_ID}
#      xcrun simctl privacy booted grant camera ${MAESTRO_APP_ID}
#   4. scripts/maestro/reset-db.sh   # wipe app + auth schemas so the
#      sign-up phone (+15550100100) is a fresh account every run
#
# Run:
#   maestro test .maestro/core-end-to-end.yaml
- launchApp:
    clearState: true
    clearKeychain: true
    stopApp: true
- waitForAnimationToEnd
# Let the auth gate land us on sign-in first (more reliable than a
# bare deep link to /sign-up immediately after a cold-launch race).
- extendedWaitUntil:
    visible:
      id: "input-phone"
    timeout: 15000

# --- Sign-up (fresh account) -------------------------------------------------
- openLink: harpa://sign-up/phone
- extendedWaitUntil:
    visible:
      id: "input-signup-phone"
    timeout: 15000
- tapOn:
    id: "input-signup-phone"
- inputText: "+15550100100"
- tapOn:
    point: "50%,15%"
- tapOn:
    id: "btn-signup-send-code"
- assertVisible:
    id: "input-signup-otp"
- tapOn:
    id: "input-signup-otp"
- inputText: "000000"
- tapOn:
    point: "50%,15%"
- tapOn:
    id: "btn-signup-verify"

# --- Onboarding (always shown after fresh sign-up) ---------------------------
- extendedWaitUntil:
    visible:
      id: "screen-onboarding"
    timeout: 10000
- tapOn:
    id: "input-onboarding-name"
- inputText: "Maestro Tester"
- tapOn:
    id: "input-onboarding-company"
- inputText: "QA Industries"
- tapOn:
    point: "50%,15%"
- tapOn:
    id: "btn-onboarding-submit"

# --- Projects list -----------------------------------------------------------
- assertVisible:
    text: "Projects"
- assertVisible:
    id: "btn-new-project"
- tapOn:
    id: "btn-new-project"

# --- New project -------------------------------------------------------------
- assertVisible:
    id: "input-project-name"
- tapOn:
    id: "input-project-name"
- inputText: "Maestro Test Project"
- tapOn:
    id: "input-client-name"
- inputText: "QA Client Co"
- tapOn:
    id: "input-project-address"
- inputText: "1 Test Way"
- tapOn:
    point: "50%,15%"
- tapOn:
    id: "btn-submit-project"

# --- Project home: copy buttons + navigation --------------------------------
- assertVisible:
    id: "btn-edit-project"
- tapOn:
    id: "btn-copy-client"
- tapOn:
    id: "btn-copy-address"

# --- Members: open, invite editor, filter, remove ---------------------------
- tapOn:
    id: "btn-open-members"
- assertVisible:
    id: "btn-add-member"
- tapOn:
    id: "btn-add-member"
- assertVisible:
    id: "input-invite-phone"
- tapOn:
    id: "input-invite-phone"
- inputText: "+15550100200"
- tapOn:
    point: "50%,15%"
- tapOn:
    id: "btn-invite-role-editor"
- tapOn:
    id: "btn-invite-submit"
# After invite, the "others" list now has a member so filter buttons render.
- extendedWaitUntil:
    visible:
      id: "btn-filter-all"
    timeout: 8000
- tapOn:
    id: "btn-filter-editor"
- waitForAnimationToEnd
- tapOn:
    id: "btn-back"

# --- Project edit: rename, save ---------------------------------------------
- assertVisible:
    id: "btn-edit-project"
- tapOn:
    id: "btn-edit-project"
- assertVisible:
    id: "input-edit-project-name"
- tapOn:
    id: "input-edit-project-name"
- eraseText: 50
- inputText: "Edited Project"
- scrollUntilVisible:
    element:
      id: "btn-save-project"
    direction: DOWN
- tapOn:
    id: "btn-save-project"

# --- Reports list + new draft -----------------------------------------------
- assertVisible:
    id: "btn-edit-project"
- tapOn:
    id: "btn-open-reports"
- assertVisible:
    id: "btn-new-report"
- tapOn:
    id: "btn-new-report"
- runFlow:
    when:
      visible:
        id: "report-row-draft-0"
    commands:
      - tapOn:
          id: "report-row-draft-0"

# Generate report: tabs, dialogs, and the real generate/finalize round-trip
# ---------------------------------------------------------------------------
# Note typing via XCTest into RN's multiline TextInput is unreliable, so this
# flow exercises the "no-notes → Generate report disabled" guard and then
# uses the regenerate path (which doesn't need notes) once a report exists.
# The add-note happy path is covered by unit tests
# (`screens/generate-notes.test.tsx`).

# --- Generate report: tabs + voice + finalize -------------------------------
- extendedWaitUntil:
    visible:
      id: "input-note-container"
    timeout: 15000

# Voice record (mic permission pre-granted by run script). Phase H:
# `btn-record-start` arms the inline WhatsApp-style recorder strip;
# `btn-record-send` finalises. `useVoiceNotePipeline` then enqueues the
# upload + transcribe + summarise round trip (fixture mode returns canned
# text). Detailed assertions on the resulting voice card live in
# `p3-15-voice-record.yaml`; here we only confirm the strip opens
# and closes without leaving the recorder stuck on screen.
- tapOn:
    id: "btn-record-start"
- extendedWaitUntil:
    visible:
      id: "voice-record-strip"
    timeout: 5000
- waitForAnimationToEnd
- tapOn:
    id: "btn-record-send"
- extendedWaitUntil:
    notVisible:
      id: "voice-record-strip"
    timeout: 10000

# Attachment picker → Cancel (camera/library exercised by unit tests; the
# permission-bearing camera capture is brittle under XCTest).
- tapOn:
    id: "btn-attachment"
- assertVisible:
    id: "dialog-sheet"
- waitForAnimationToEnd
- tapOn:
    id: "dialog-action-3"

# Add a note via the input field so the Generate-report button is enabled.
# inputText into a multiline RN TextInput is flaky on iOS XCTest — wrap in
# a runFlow so the rest of the flow still runs if typing fails.
- tapOn:
    id: "input-note"
- runFlow:
    when:
      visible:
        id: "input-note"
    commands:
      - inputText: "Concrete pour on east footing went well."
      - runFlow:
          when:
            visible:
              id: "btn-add-note"
          commands:
            - tapOn:
                id: "btn-add-note"

# Tap Generate / Update report. The button is wired to
# useGenerateReportMutation; we wait for the busy → idle transition.
- runFlow:
    when:
      visible:
        id: "btn-generate-update-report"
    commands:
      - tapOn:
          id: "btn-generate-update-report"
      # Mutation latency depends on the AI fixture replay; allow 30s.
      - extendedWaitUntil:
          visible:
            id: "report-tab-pane"
          timeout: 30000

# Report tab → edit-manually round-trip
- tapOn:
    id: "btn-tab-report"
- assertVisible:
    id: "report-tab-pane"
- runFlow:
    when:
      visible:
        id: "btn-edit-manually"
    commands:
      - tapOn:
          id: "btn-edit-manually"
      - assertVisible:
          id: "edit-tab-pane"
      - tapOn:
          id: "btn-tab-report"

# Edit tab: assert the seven section cards exist
- tapOn:
    id: "btn-tab-edit"
- assertVisible:
    id: "edit-tab-pane"
- assertVisible:
    id: "edit-section-meta"
- scrollUntilVisible:
    element:
      id: "edit-section-sections"
    direction: DOWN

# Finalize confirm dialog → confirm (dialog-action-0). The finalize
# mutation now navigates to the saved-report view on success.
- tapOn:
    id: "btn-tab-report"
- runFlow:
    when:
      visible:
        id: "btn-finalize-report"
    commands:
      - tapOn:
          id: "btn-finalize-report"
      - assertVisible:
          id: "dialog-sheet"
      - waitForAnimationToEnd
      - tapOn:
          id: "dialog-action-0"
      # After finalize, the route replaces to the saved-report view.
      - extendedWaitUntil:
          visible:
            id: "btn-report-actions"
          timeout: 20000

# --- Saved report: actions menu + delete ------------------------------------
- runFlow:
    when:
      visible:
        id: "btn-report-actions"
    commands:
      - tapOn:
          id: "btn-report-actions"
      - assertVisible:
          id: "report-actions-menu"
      - tapOn:
          id: "btn-report-delete"
      - assertVisible:
          id: "dialog-sheet"
      - waitForAnimationToEnd
      - tapOn:
          id: "dialog-action-0"
      # Delete should pop us back to the reports list.
      - extendedWaitUntil:
          visible:
            id: "btn-new-report"
          timeout: 10000

- takeScreenshot: core-e2e-generate
- tapOn:
    id: "btn-back"

# --- Project delete (cleanup) ------------------------------------------------
- assertVisible:
    id: "btn-edit-project"
- tapOn:
    id: "btn-edit-project"
- scrollUntilVisible:
    element:
      id: "btn-delete-project"
    direction: DOWN
- tapOn:
    id: "btn-delete-project"
- assertVisible:
    id: "dialog-sheet"
- waitForAnimationToEnd
- tapOn:
    id: "dialog-action-0"
- extendedWaitUntil:
    visible:
      id: "btn-new-project"
    timeout: 10000

- takeScreenshot: core-e2e-final
