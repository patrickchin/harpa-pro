name: admin-prod

# Cloudflare Git publishes main. Verify the exact commit on the Pages hostname
# and the canonical admin custom domain.

on:
  push:
    branches: [main]
    paths:
      - 'apps/admin/**'
      - 'packages/api-contract/**'
      - 'packages/api/**'
      - 'packages/ai-fixtures/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*'
      - 'turbo.json'
      - '.npmrc'
      - '.nvmrc'
      - 'patches/**'
      - 'scripts/ci/**'
      - '.github/**'
  workflow_dispatch: {}

concurrency:
  group: admin-prod
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.paths.outputs.admin }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: paths
        uses: ./.github/actions/pages-changes

  verify:
    needs: changes
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.deploy == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        origin:
          - https://harpa-pro-admin.pages.dev
          - https://admin.harpapro.com
    steps:
      - uses: actions/checkout@v7
      - name: Verify Cloudflare Git deployment
        run: >-
          bash scripts/ci/verify-pages-deployment.sh
          --origin "${{ matrix.origin }}"
          --commit "${{ github.sha }}"
          --branch main
          --title 'Business activity — Harpa Pro Admin'
          --missing-route /__missing_admin_route__
