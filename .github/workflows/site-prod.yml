name: site-prod

# Cloudflare Git publishes main. This workflow verifies the exact commit on
# the Pages hostname and both production custom domains.

on:
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      - 'packages/api-contract/**'
      - 'scripts/ci/build-cloudflare-pages.sh'
      - 'scripts/ci/verify-pages-deployment.sh'
      - '.github/workflows/site-prod.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
  workflow_dispatch: {}

concurrency:
  group: site-prod
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        origin:
          - https://harpa-pro.pages.dev
          - https://harpapro.com
          - https://www.harpapro.com
    steps:
      - uses: actions/checkout@v7
      - name: Verify Cloudflare Git deployment
        run: >-
          bash scripts/ci/verify-pages-deployment.sh
          --origin "${{ matrix.origin }}"
          --commit "${{ github.sha }}"
          --branch main
          --redirect-path /guides/getting-started
          --redirect-suffix /docs/guides/getting-started
