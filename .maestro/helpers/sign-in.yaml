appId: ${MAESTRO_APP_ID}
---
# sign-in.yaml — helper: sign in through the local CLI auth broker
#
# Required env vars:
#   EMAIL — the password-login test account email, normally
#           test@harpapro.com, test2@harpapro.com, or test3@harpapro.com.
#
# Required runtime services:
#   - The fixture-mode API on http://127.0.0.1:8787.
#   - The local auth broker on http://127.0.0.1:8790.
#
# Post-condition: either onboarding or the projects list is visible. Caller is
# responsible for handling both.
#
# Usage:
#   - runFlow:
#       file: ../helpers/sign-in.yaml
#       env:
#         EMAIL: "test@harpapro.com"
- openLink: "harpa://e2e-password-login?email=${EMAIL}&broker=http%3A%2F%2F127.0.0.1%3A8790"
- runFlow:
    file: dismiss-open-dialog.yaml
- extendedWaitUntil:
    visible:
      id: "screen-onboarding|btn-new-project|e2e-password-login-error"
    timeout: 45000
- assertNotVisible:
    id: "e2e-password-login-error"
- extendedWaitUntil:
    visible:
      id: "screen-onboarding|btn-new-project"
    timeout: 15000
