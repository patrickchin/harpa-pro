name: admin-dev

# Cloudflare Git publishes the admin dev branch. GitHub verifies the stable
# alias and exact commit without Cloudflare credentials.

on:
  push:
    branches: [dev]
    paths:
      - 'apps/admin/**'
      - 'packages/api-contract/**'
      - 'packages/api/**'
      - 'packages/ai-fixtures/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*'
      - 'turbo.json'
      - '.npmrc'
      - '.nvmrc'
      - 'patches/**'
      - 'scripts/ci/**'
      - '.github/**'
  workflow_dispatch: {}

concurrency:
  group: admin-dev
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.paths.outputs.admin }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: paths
        uses: ./.github/actions/pages-changes

  verify:
    needs: changes
    if: >-
      github.ref == 'refs/heads/dev' &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.deploy == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Verify Cloudflare Git deployment
        run: >-
          bash scripts/ci/verify-pages-deployment.sh
          --origin https://dev.harpa-pro-admin.pages.dev
          --commit "${{ github.sha }}"
          --branch dev
          --title 'Business activity — Harpa Pro Admin'
          --missing-route /__missing_admin_route__
