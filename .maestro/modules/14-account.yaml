appId: ${MAESTRO_APP_ID}
name: "14 — Account screen: view, edit-cancel, edit-save, deletion cancel"
tags:
  - regression
  - account
---
# Module 14 — Account screen lifecycle
#
# Covers:
#   - navigate from projects index → Profile → Account
#   - account screen renders (`screen-account`)
#   - phone, full-name, company-name fields visible
#   - tap Edit, then Cancel — fields revert to read-only
#   - tap Edit, type a new full name, Save — name persists,
#     editor closes back to read-only
#   - account deletion entry point is visible, opens a themed dialog,
#     requires email confirmation, and can be cancelled without signing out
#
# Pre-condition: test signed in on empty projects index
#                (post-condition of module 13).
# Post-condition: test on profile screen, signed in.

# --- Open profile → account ------------------------------------------------
- tapOn:
    id: "btn-open-profile"
- extendedWaitUntil:
    visible:
      id: "screen-profile"
    timeout: 10000
- tapOn:
    id: "btn-open-account"
- extendedWaitUntil:
    visible:
      id: "screen-account"
    timeout: 10000

# --- Read-only sanity ------------------------------------------------------
- assertVisible:
    id: "input-full-name"
- assertVisible:
    id: "input-company-name"
- assertVisible:
    id: "btn-edit-profile"

# --- Enter edit mode then cancel — verify editor toggles off ----------------
- tapOn:
    id: "btn-edit-profile"
- extendedWaitUntil:
    visible:
      id: "btn-save-profile"
    timeout: 8000
- assertVisible:
    id: "btn-cancel-edit"
- tapOn:
    id: "btn-cancel-edit"
- extendedWaitUntil:
    visible:
      id: "btn-edit-profile"
    timeout: 8000

# --- Edit + save — append a marker, save, confirm editor closes -------------
- tapOn:
    id: "btn-edit-profile"
- extendedWaitUntil:
    visible:
      id: "btn-save-profile"
    timeout: 8000
- tapOn:
    id: "input-full-name"
# Clear field via long-press → Select All → backspace is unreliable on
# iOS XCTest, so just append. Worst case test's name grows by a few
# chars across reruns, which doesn't affect any other assertion.
- inputText: " Edit"
- hideKeyboard
- tapOn:
    id: "btn-save-profile"
- extendedWaitUntil:
    visible:
      id: "btn-edit-profile"
    timeout: 10000
- assertNotVisible:
    id: "account-save-error"

# --- Account deletion dialog: discoverable + cancellable --------------------
- scrollUntilVisible:
    element:
      id: "btn-open-delete-account"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "btn-open-delete-account"
- extendedWaitUntil:
    visible:
      id: "dialog-sheet"
    timeout: 10000
- assertVisible: "Delete account?"
- extendedWaitUntil:
    visible: ".*Projects deleted.*"
    timeout: 10000
- assertVisible:
    id: "input-delete-account-email"
- assertVisible:
    id: "btn-confirm-delete-account"
- tapOn:
    id: "btn-cancel-delete-account"
- extendedWaitUntil:
    visible:
      id: "screen-account"
    timeout: 10000
- assertVisible:
    id: "btn-edit-profile"

# --- Back to profile -------------------------------------------------------
- tapOn:
    id: "btn-back"
- extendedWaitUntil:
    visible:
      id: "screen-profile"
    timeout: 10000
