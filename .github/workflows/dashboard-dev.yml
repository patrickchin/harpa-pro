name: dashboard-dev

# Cloudflare Git publishes the dashboard dev branch. GitHub verifies the
# matching Fly API, exact Pages commit, and SPA fallback without credentials.

on:
  push:
    branches: [dev]
    paths:
      - 'apps/dashboard/**'
      - 'packages/api-contract/**'
      - 'packages/design-tokens/**'
      - 'packages/api/**'
      - 'packages/ai-fixtures/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*'
      - 'turbo.json'
      - '.npmrc'
      - '.nvmrc'
      - 'patches/**'
      - 'scripts/ci/**'
      - '.github/**'
  workflow_dispatch: {}

concurrency:
  group: dashboard-dev
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.paths.outputs.dashboard }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: paths
        uses: ./.github/actions/pages-changes

  verify:
    needs: changes
    if: >-
      github.ref == 'refs/heads/dev' &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.deploy == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      DASHBOARD_ORIGIN: https://dev.harpa-pro-dashboard.pages.dev
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify compatible dev API
        env:
          API_HEALTH_URL: https://harpa-pro-api-dev.fly.dev/healthz
          API_READY_URL: https://harpa-pro-api-dev.fly.dev/readyz
          API_PATH_PATTERN: '^(packages/api/|packages/api-contract/|packages/ai-fixtures/|infra/fly/|infra/neon/|scripts/journeys/|pnpm-lock\.yaml$|tsconfig.*\.json$|\.github/workflows/api-dev\.yml$)'
          EXPECTED_GIT_COMMIT: ${{ github.sha }}
          API_RELEASE_ATTEMPTS: 30
          API_RELEASE_SLEEP: 10
        run: bash scripts/ci/verify-api-release.sh

      - name: Verify Cloudflare Git deployment
        run: >-
          bash scripts/ci/verify-pages-deployment.sh
          --origin "$DASHBOARD_ORIGIN"
          --commit "${{ github.sha }}"
          --branch dev
          --title 'Harpa Pro Dashboard'

      - name: Verify deployed dashboard SPA
        env:
          DASHBOARD_URL: ${{ env.DASHBOARD_ORIGIN }}
        run: bash scripts/ci/verify-dashboard-pages.sh
