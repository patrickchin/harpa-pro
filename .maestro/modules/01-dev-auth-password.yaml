appId: ${MAESTRO_APP_ID}
name: "01-dev - Auth: password login alice"
tags:
  - regression
  - auth
  - dev
---
# Module 01-dev - Auth against the development deployment.
#
# Uses the local CLI auth broker instead of email-OTP so the shared
# test-account password stays out of Maestro logs (the broker calls
# better-auth `signIn.email` with the password and hands the password
# back to the mobile client to install the cookie).
# Metro is expected on 127.0.0.1:8082 through adb reverse because
# Windows localhost binding can otherwise resolve to an IPv6-only listener.

- launchApp:
    clearState: true
    clearKeychain: true
    stopApp: true
- waitForAnimationToEnd

- openLink: "exp+harpa-pro-v4://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8082"
# Use timed wait + conditional gates — never unconditional extendedWaitUntil
# for the "Continue" button (stalls 60 s on iOS where the scheme is a no-op).
- waitForAnimationToEnd:
    timeout: 20000
- runFlow:
    when:
      platform: android
      visible: "This is the developer menu"
    commands:
      - tapOn:
          point: "90%,71%"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn:
          text: "Continue"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd
- runFlow:
    file: ../helpers/dismiss-open-dialog.yaml

- runFlow:
    file: ../helpers/dev-password-login.yaml
    env:
      EMAIL_ENCODED: "test%2B1%40harpapro.com"
      NAME: "Alice Dev E2E"
      COMPANY: "Dev E2E Corp"

- runFlow: ../helpers/sign-out.yaml

- runFlow:
    file: ../helpers/dev-password-login.yaml
    env:
      EMAIL_ENCODED: "test%2B1%40harpapro.com"
      NAME: "Alice Dev E2E"
      COMPANY: "Dev E2E Corp"
