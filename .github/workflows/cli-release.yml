name: cli-release
# Builds single-file `harpa` binaries via `bun build --compile` for the
# four supported Unix targets (linux x64/arm64, darwin x64/arm64) and
# attaches them to a GitHub Release. Triggered by pushing a tag of the
# form `cli-v<semver>` (e.g. cli-v0.1.0). See docs/v4/arch-tui-layout.md
# §6 phase L1.

on:
  push:
    tags: ['cli-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. cli-v0.1.0) — for manual builds without publishing a release'
        required: false

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            asset: harpa-linux-x64
          - target: bun-linux-arm64
            asset: harpa-linux-arm64
          - target: bun-darwin-x64
            asset: harpa-darwin-x64
          - target: bun-darwin-arm64
            asset: harpa-darwin-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.3 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.3.14' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @harpa/api-contract build
      - name: Compile binary
        working-directory: apps/cli
        run: |
          bun build --compile --minify --sourcemap \
            --target=${{ matrix.target }} \
            src/index.ts \
            --outfile ../../dist/${{ matrix.asset }}
      - name: Smoke test (native targets only)
        if: matrix.target == 'bun-linux-x64'
        run: ./dist/${{ matrix.asset }} --help
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/cli-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum harpa-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/harpa-*
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
