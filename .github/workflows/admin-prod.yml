name: admin-prod

# Deploy the standalone admin console to the production branch of its own
# Cloudflare Pages project. Verify the Pages host first; map and cut over
# admin.harpapro.com separately only after the production artifact exists.

on:
  push:
    branches: [main]
    paths:
      - 'apps/admin/**'
      - 'packages/api-contract/**'
      - '.github/actions/setup-monorepo/**'
      - '.github/workflows/admin-prod.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
  workflow_dispatch: {}

concurrency:
  group: admin-prod
  cancel-in-progress: false

jobs:
  prod:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-monorepo

      - name: Build admin site
        env:
          PUBLIC_API_BASE_URL: https://api.harpapro.com
        run: pnpm --filter @harpa/admin build

      - name: Verify admin API URL is inlined
        env:
          EXPECTED_API_ORIGIN: https://api.harpapro.com
        run: |
          grep -R -Fq --include='*.js' "$EXPECTED_API_ORIGIN" apps/admin/dist
          if grep -R -Fq --include='*.js' 'http://localhost:8787' apps/admin/dist; then
            echo "::error::admin production artifact still points at the local E2E API" >&2
            exit 1
          fi

      - name: Deploy admin site to Cloudflare Pages (production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy apps/admin/dist
            --project-name=harpa-pro-admin
            --branch=main
            --commit-dirty=true

      - name: Verify stable admin Pages host
        shell: bash
        env:
          ADMIN_ORIGIN: https://harpa-pro-admin.pages.dev
        run: |
          set -euo pipefail

          retry() {
            local description="$1"
            shift
            local deadline=$((SECONDS + 180))
            while true; do
              if "$@"; then
                return 0
              fi
              if (( SECONDS >= deadline )); then
                break
              fi
              sleep 5
            done
            echo "::error::$description" >&2
            return 1
          }

          verify_root() {
            local remote_html
            if ! remote_html="$(mktemp)"; then
              return 1
            fi
            if ! curl --fail --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              --output "$remote_html" \
              "${ADMIN_ORIGIN}/"; then
              rm -f -- "$remote_html"
              return 1
            fi
            if ! grep -Fq '<title>Business activity — Harpa Pro Admin</title>' "$remote_html"; then
              echo "Stable admin root returned unexpected HTML" >&2
              rm -f -- "$remote_html"
              return 1
            fi
            if ! cmp -s apps/admin/dist/index.html "$remote_html"; then
              echo "Stable admin root does not match the deployed artifact" >&2
              rm -f -- "$remote_html"
              return 1
            fi
            rm -f -- "$remote_html"
          }

          retry "Stable admin root did not serve the deployed console" verify_root
