appId: ${MAESTRO_APP_ID}
name: "01 — Auth: sign-in test via password"
tags:
  - regression
  - auth
---
# Module 01 — Auth (password)
#
# Covers:
#   - cold launch with clean state
#   - sign-in via the local auth broker + better-auth emailAndPassword
#   - sign-out + sign-in round trip
#
# Pre-condition: app just cold-launched with clearState + clearKeychain;
# test@harpapro.com exists in the test-account password allowlist.
# Post-condition: test is signed in, projects list visible.

# Cold launch with clean state
- launchApp:
    clearState: true
    clearKeychain: true
    stopApp: true
- waitForAnimationToEnd

# Android dev-client unstuck prelude: after `clearState: true`, Android
# lands on the dev-launcher picker, not the JS app. Deep-link the
# dev-launcher's own scheme with an explicit Metro URL. See
# `core-end-to-end.yaml` for the full explanation.
# On Android: openLink deep-links the dev-launcher to load the Metro bundle.
# On iOS: the exp+harpa-pro-v4 scheme is unregistered, so this is a no-op;
# the dev-launcher already remembers the Metro URL from the last run. The
# encoded `disableOnboarding=1` query param suppresses Expo's native dev-menu
# onboarding sheet before the app bundle loads.
- openLink: "exp+harpa-pro-v4://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081%3FdisableOnboarding%3D1"
# Wait for bundle load / animation. Older dev-clients may still show a
# "This is the developer menu" sheet with a "Continue" button, so keep
# timed fallback gates; never use unconditional extendedWaitUntil here or
# iOS can stall for 60 s where the scheme is a no-op.
- waitForAnimationToEnd:
    timeout: 20000

# Dismiss any legacy Android/iOS dev-launcher first-run sheet if an older
# dev-client ignores `disableOnboarding=1`.
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn:
          text: "Continue"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd

# iOS system dialog: after `clearState: true`, the first `openLink` of
# the day to `exp+harpa-pro-v4://...` triggers an "Open in 'Harpa Pro
# Dev'?" confirm sheet. No-op on Android / iOS after first dismissal.
- runFlow:
    file: ../helpers/dismiss-open-dialog.yaml

# The Expo dev-menu onboarding sheet can appear late while Metro finishes a
# cold bundle on older dev-clients. Wait once more, but dismiss by visible
# labels only; coordinate taps are device-dependent.
- extendedWaitUntil:
    visible: "This is the developer menu"
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn:
          text: "Continue"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd

# Land on sign-in (email) screen.
- extendedWaitUntil:
    visible:
      id: "input-email"
    timeout: 90000

# --- Sign-in test --------------------------------------------------------
- runFlow:
    file: ../helpers/sign-in.yaml
    env:
      EMAIL: "test@harpapro.com"

# --- Onboarding (only on first sign-in for this email; skipped on a
#     pre-onboarded account) -----------------------------------------------
- runFlow:
    when:
      visible:
        id: "screen-onboarding"
    commands:
      - tapOn:
          id: "input-onboarding-name"
      - inputText: "Test E2E"
      - tapOn:
          id: "input-onboarding-company"
      - inputText: "E2E Corp"
      - hideKeyboard
      - tapOn:
          id: "btn-onboarding-submit"

# --- Verify projects list ---------------------------------------------------
- extendedWaitUntil:
    visible:
      id: "btn-new-project"
    timeout: 15000

# --- Sign-out ---------------------------------------------------------------
- runFlow: ../helpers/sign-out.yaml

# --- Sign-in (round-trip) --------------------------------------------------
- runFlow:
    file: ../helpers/sign-in.yaml
    env:
      EMAIL: "test@harpapro.com"
- assertVisible:
    id: "btn-new-project"
