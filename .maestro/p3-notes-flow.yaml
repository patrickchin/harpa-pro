appId: com.harpa.pro
name: P3 notes — delete a seeded text note
tags:
  - p3
  - notes
---
# Exercises the delete-note wiring shipped after commit dcecdaa:
#   - 3-dot options button on each text note row (TextNoteCard)
#   - "Delete" action in the per-row AppDialogSheet options menu
#   - Provider-owned delete-confirm AppDialogSheet → useDeleteNoteMutation
#   - timeline empty-state appears once the only note is gone
#
# Pre-flight is the same as core-end-to-end.yaml:
#   docker compose up -d
#   pnpm --filter @harpa/mobile start --dev-client
#   scripts/maestro/reset-db.sh
#
# We sign in as Alice (+15550100100) — reset-db.sh seeds her draft
# report with exactly one text note (id `not_aaaaaaaaaaaa`). Edit is
# covered by the screens/generate-notes.test.tsx unit tests (Maestro
# / XCTest cannot reliably deliver inputText to multiline TextInputs).

- launchApp:
    clearState: true
    clearKeychain: true
    stopApp: true
- waitForAnimationToEnd

# --- Sign in as the seeded Alice (+15550100100) ----------------------------
- extendedWaitUntil:
    visible:
      id: "input-phone"
    timeout: 15000
- tapOn:
    id: "input-phone"
- inputText: "+15550100100"
- tapOn:
    id: "btn-login-send-code"
- extendedWaitUntil:
    visible:
      id: "input-otp"
    timeout: 10000
- tapOn:
    id: "input-otp"
- inputText: "000000"
- extendedWaitUntil:
    visible:
      id: "btn-verify-code"
    timeout: 5000
- tapOn:
    id: "btn-verify-code"

# --- Open seeded project → reports → seeded draft (Generate screen) -------
- extendedWaitUntil:
    visible:
      id: "project-row-0"
    timeout: 15000
- tapOn:
    id: "project-row-0"
- extendedWaitUntil:
    visible:
      id: "btn-open-reports"
    timeout: 10000
- tapOn:
    id: "btn-open-reports"
- extendedWaitUntil:
    visible:
      id: "report-row-draft-0"
    timeout: 10000
- tapOn:
    id: "report-row-draft-0"

# --- Confirm we landed on Generate with the seeded note visible ------------
- extendedWaitUntil:
    visible:
      id: "note-timeline"
    timeout: 10000
- assertVisible:
    id: "note-row-0"
- assertVisible:
    id: "btn-note-options-.*"

# --- Open per-row options → tap Delete → confirm in the next sheet ---------
- tapOn:
    id: "btn-note-options-.*"
- extendedWaitUntil:
    visible:
      id: "dialog-action-text-note-delete-0"
    timeout: 5000
- tapOn:
    id: "dialog-action-text-note-delete-0"
# Provider-owned delete-confirm AppDialogSheet — use the destructive
# confirm by testID we set in GenerateReportDialogs.
- extendedWaitUntil:
    visible:
      id: "dialog-action-confirm-delete-note"
    timeout: 8000
- tapOn:
    id: "dialog-action-confirm-delete-note"

# --- Empty state appears once the timeline has no rows ---------------------
- extendedWaitUntil:
    visible: "Start capturing site notes"
    timeout: 10000
- takeScreenshot: notes-delete-empty
