appId: ${MAESTRO_APP_ID}
name: "05-dev - Members: test removes test2 and re-invites as viewer"
tags:
  - regression
  - members
  - dev
---

- tapOn:
    id: "link-project-members"
- extendedWaitUntil:
    visible:
      id: "member-row-.*"
    timeout: 10000
- tapOn:
    id: "btn-remove-member-.*"
- extendedWaitUntil:
    visible:
      id: "confirm-remove-member"
    timeout: 5000
- tapOn:
    id: "confirm-remove-member"
- extendedWaitUntil:
    notVisible:
      id: "btn-remove-member-.*"
    timeout: 10000

- tapOn:
    id: "btn-show-add-member"
- extendedWaitUntil:
    visible:
      id: "input-member-email"
    timeout: 8000
- tapOn:
    id: "input-member-email"
- inputText: "test2@harpapro.com"
- hideKeyboard
- tapOn:
    id: "picker-member-role-viewer"
- tapOn:
    id: "btn-add-member"
- extendedWaitUntil:
    visible:
      text: "Viewer"
    timeout: 10000

- tapOn:
    id: "btn-back"
- extendedWaitUntil:
    visible:
      id: "btn-project-edit"
    timeout: 10000

- runFlow: ../helpers/sign-out.yaml
- runFlow:
    file: ../helpers/dev-password-login.yaml
    env:
      EMAIL_ENCODED: "test2%40harpapro.com"
      NAME: "Test Two Dev E2E"
      COMPANY: "Dev E2E Corp"

- tapOn:
    text: "${PROJECT_NAME_EDITED}"
- extendedWaitUntil:
    visible:
      id: "link-project-members"
    timeout: 10000
- assertNotVisible:
    id: "btn-project-edit"

- tapOn:
    id: "link-project-members"
- extendedWaitUntil:
    visible:
      text: "Viewer"
    timeout: 10000
- tapOn:
    id: "btn-back"

- tapOn:
    id: "btn-open-reports"
- extendedWaitUntil:
    visible:
      id: "btn-back"
    timeout: 5000
- assertNotVisible:
    id: "btn-new-report"
- tapOn:
    id: "btn-back"

- tapOn:
    id: "btn-back"
- runFlow: ../helpers/sign-out.yaml
- runFlow:
    file: ../helpers/dev-password-login.yaml
    env:
      EMAIL_ENCODED: "test%40harpapro.com"
      NAME: "Test Dev E2E"
      COMPANY: "Dev E2E Corp"
- runFlow: ../helpers/open-project-dev.yaml
