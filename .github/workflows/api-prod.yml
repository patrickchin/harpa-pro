name: api-prod

# Build + deploy @harpa/api to Fly.io on every push to `main`
# (the default branch — see AGENTS.md hard rule #7). Manual deploys
# can still be run via `./infra/fly/deploy.sh`.

on:
  push:
    branches: [main]
    paths:
      - 'packages/api/**'
      - 'packages/api-contract/**'
      - 'packages/ai-fixtures/**'
      - 'infra/fly/**'
      - 'infra/neon/**'
      - 'scripts/journeys/**'
      - '.github/workflows/api-prod.yml'
      - 'pnpm-lock.yaml'
  # Allow manual re-deploys (e.g. rotating secrets without a code change).
  workflow_dispatch: {}

concurrency:
  group: api-prod
  cancel-in-progress: false # never cancel a prod deploy

env:
  # Public readiness endpoint hit post-deploy to prove the rollout served
  # traffic against the migrated schema. Override via repo variable
  # API_READY_URL if the prod hostname changes.
  API_READY_URL: ${{ vars.API_READY_URL || 'https://harpa-pro-api.fly.dev/readyz' }}

jobs:
  # Filename lint for migrations. Cheap insurance against a typo that
  # would silently desync the head check or break lexical ordering.
  # See docs/v4/arch-cicd-and-migrations.md.
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Lint migration filenames
        run: |
          set -euo pipefail
          MIG_DIR=packages/api/migrations
          MIGRATION_FILES=("$MIG_DIR"/*.sql)
          if [[ ! -e "${MIGRATION_FILES[0]}" ]]; then
            echo "::error::no .sql files in $MIG_DIR"
            exit 1
          fi
          MIGRATION_NAMES=("${MIGRATION_FILES[@]##*/}")
          bad=0
          for f in "${MIGRATION_NAMES[@]}"; do
            if ! echo "$f" | grep -qE '^[0-9]+_[a-z0-9_]+(\.notx)?\.sql$'; then
              echo "::error file=$MIG_DIR/$f::filename must match <digits>_<slug>[.notx].sql"
              bad=$((bad+1))
            fi
          done
          if [[ "$bad" -gt 0 ]]; then
            echo "migration filename lint failed ($bad bad file(s))" >&2
            exit 1
          fi
          dups=$(printf '%s\n' "${MIGRATION_NAMES[@]}" | awk -F_ '{print $1}' | sort | uniq -d)
          if [[ -n "$dups" ]]; then
            echo "::error::duplicate migration prefix(es): $dups"
            exit 1
          fi
          HEAD=$(printf '%s\n' "${MIGRATION_NAMES[@]}" | LC_ALL=C sort | tail -1)
          echo "computed MIGRATIONS_REQUIRED_HEAD=$HEAD"

          ADMIN_MIG_DIR=packages/api/admin-migrations
          ADMIN_MIGRATION_FILES=("$ADMIN_MIG_DIR"/*.sql)
          if [[ ! -e "${ADMIN_MIGRATION_FILES[0]}" ]]; then
            echo "::error::no .sql files in $ADMIN_MIG_DIR"
            exit 1
          fi
          ADMIN_MIGRATION_NAMES=("${ADMIN_MIGRATION_FILES[@]##*/}")
          bad=0
          for f in "${ADMIN_MIGRATION_NAMES[@]}"; do
            if ! echo "$f" | grep -qE '^[0-9]+_[a-z0-9_]+\.sql$'; then
              echo "::error file=$ADMIN_MIG_DIR/$f::filename must match <digits>_<slug>.sql"
              bad=$((bad+1))
            fi
          done
          if [[ "$bad" -gt 0 ]]; then
            echo "admin migration filename lint failed ($bad bad file(s))" >&2
            exit 1
          fi
          dups=$(printf '%s\n' "${ADMIN_MIGRATION_NAMES[@]}" | awk -F_ '{print $1}' | sort | uniq -d)
          if [[ -n "$dups" ]]; then
            echo "::error::duplicate admin migration prefix(es): $dups"
            exit 1
          fi
          ADMIN_HEAD=$(printf '%s\n' "${ADMIN_MIGRATION_NAMES[@]}" | LC_ALL=C sort | tail -1)
          echo "computed ADMIN_MIGRATIONS_REQUIRED_HEAD=$ADMIN_HEAD"

  prod:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: ./.github/actions/setup-monorepo

      - name: Resolve admin Neon `main` URI
        # The admin project's main branch is independent from the app project.
        # Resolve a direct URI; pooled connections are not safe for the admin
        # migrator's session advisory lock.
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_ADMIN_PROJECT_ID }}
          NEON_DATABASE_NAME: harpa_admin
          NEON_ROLE_NAME: harpa_admin_owner
        run: |
          URI=$(pnpm --silent db:branch:ensure main)
          echo "::add-mask::$URI"
          echo "ADMIN_DATABASE_URL=$URI" >> "$GITHUB_ENV"

      # Pre-deploy Neon snapshot named after the commit SHA. Gives us
      # a copy-on-write rollback target before Fly's release_command
      # applies any pending migration. This is a blocking safety gate:
      # missing credentials or a Neon API failure aborts the workflow
      # before prod schema or data can change.
      # See docs/v4/arch-cicd-and-migrations.md §Failure & rollback.
      # (pnpm + node already set up at top of job; node_modules persists.)
      - name: Prune and snapshot prod DB (pre-deploy)
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          set -euo pipefail
          # Cap at two before creation so the new snapshot becomes the third.
          pnpm db:branch:prune-snapshots 30 2
          pnpm db:branch:snapshot "${GITHUB_SHA}" main

      - name: Prune and snapshot admin prod DB (pre-deploy)
        # A separate snapshot in the admin project preserves its independent
        # rollback boundary before db:migrate:admin runs. The same 2 + 1 cap
        # reserves at least five PR branch slots beside main and dev.
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_ADMIN_PROJECT_ID }}
        run: |
          set -euo pipefail
          pnpm db:branch:prune-snapshots 30 2
          pnpm db:branch:snapshot "${GITHUB_SHA}" main

      - uses: superfly/flyctl-actions/setup-flyctl@1.5

      - uses: dopplerhq/cli-action@v3

      - name: Sync Fly secrets from Doppler
        # See api-dev.yml for rationale. `--stage` defers activation;
        # the subsequent deploy is what flips them on.
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          FLY_SECRET_LIST=$(flyctl secrets list --app harpa-pro-api)
          if printf '%s\n' "$FLY_SECRET_LIST" \
            | awk 'NR > 1 { print $1 }' \
            | grep -qx ADMIN_CORS_ORIGINS; then
            flyctl secrets unset ADMIN_CORS_ORIGINS \
              --stage --app harpa-pro-api
          fi
          {
            doppler secrets download --no-file --format env \
              | grep -vE '^(DOPPLER_|NEON_|FLY_|CLOUDFLARE_|PUBLIC_|EXPO_PUBLIC_|PAGES_PROJECT|PORT|NODE_ENV|ADMIN_EMAIL|ADMIN_DATABASE_URL=|ADMIN_CORS_ORIGINS=|BETTER_AUTH_URL=)'
            echo "ADMIN_DATABASE_URL=$ADMIN_DATABASE_URL"
            echo "BETTER_AUTH_URL=https://api.harpapro.com"
          } | flyctl secrets import --stage --app harpa-pro-api

      - name: Deploy to Fly.io
        # Migration application belongs exclusively to fly.toml's
        # release_command. Fly aborts the rollout if migration or seed
        # fails, after the blocking snapshot above has succeeded.
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: ./infra/fly/deploy.sh --remote-only

      # Closes the loop on the 2026-05-20 incident: a green workflow now
      # means the new image is up AND able to serve real traffic against
      # the migrated schema. Prod currently runs `min_machines_running = 0`,
      # so this uses the same cold-resume-tolerant verifier as dev and
      # preview. See docs/bugs/README.md.
      - name: Verify /readyz
        env:
          READYZ_URL: ${{ env.API_READY_URL }}
        run: bash scripts/ci/verify-readyz.sh

      - name: Verify /admin/readyz
        # Deliberately post-deploy: admin DB health must not control Fly's
        # routing health for the application API.
        env:
          READYZ_URL: https://harpa-pro-api.fly.dev/admin/readyz
        run: bash scripts/ci/verify-readyz.sh

      - name: Diagnose readyz failure
        if: failure()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "::group::flyctl status"
          flyctl status --app harpa-pro-api || true
          echo "::endgroup::"
          echo "::group::flyctl logs (last 200 lines)"
          flyctl logs --app harpa-pro-api --no-tail || true
          echo "::endgroup::"

      - name: Post-deploy journey tests
        # Runs curl journey scripts against the just-deployed prod API.
        # Order: stress (~10s, no AI) → core (~3min, live AI) → extended (~5min, live AI).
        # On failure the workflow goes red but the deploy is NOT rolled back.
        # Requires TEST_ACCOUNT_EMAILS + TEST_ACCOUNT_PASSWORD in Doppler prd
        # (so they're synced to the Fly app and seeded by release_command)
        # and TEST_ACCOUNT_PASSWORD as a GitHub Actions secret (so this
        # step can authenticate).
        env:
          PASSWORD: ${{ secrets.TEST_ACCOUNT_PASSWORD_PRD }}
          EMAIL: ${{ vars.TEST_ACCOUNT_EMAIL_PRD }}
          EMAIL2: ${{ vars.TEST_ACCOUNT_EMAIL2_PRD }}
        run: |
          if [[ -z "${EMAIL:-}" ]]; then
            echo "::error::TEST_ACCOUNT_EMAIL_PRD repo variable is unset; cannot run journeys" >&2
            exit 1
          fi
          bash scripts/journeys/all.sh prod

  mobile-ota:
    name: Publish API-dependent mobile OTA
    needs: prod
    permissions:
      contents: write
    uses: ./.github/workflows/mobile-ota-prod.yml
    with:
      release_sha: ${{ github.sha }}
      api_deploy_succeeded: true
    secrets: inherit
