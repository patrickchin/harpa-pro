appId: ${MAESTRO_APP_ID}
name: Photo placement — place a captured photo onto an issue
tags:
  - reports
  - photos
  - placement
# Exercises the photo-placement UI added in
# docs/v4/design-photo-placement.md:
#   - draft saved-report renders the "Unplaced photos" card with a
#     `Place into…` chip per photo group
#   - regenerating an existing report keeps placement controls visible
#     but disabled while the backend write is in flight
#   - the placement sheet lists the report's issues + sections
#   - tapping an issue PATCHes report.body attachments and the photo
#     re-renders inline under that issue (`placed-photos-issue-N`)
#   - the bottom photo strip drops the now-placed group
#   - finalized saved-report view keeps the placed photo visible but
#     does not expose placement or manual-edit controls
#
# Pre-flight is identical to the photo upload modules: docker compose stack
# up, fresh DB via `scripts/maestro/reset-db.sh`, fixture-mode Metro, local
# auth broker, and camera permission. The reset supplies Wiring Smoke Project,
# draft report 1, and a text note. Fixture generation supplies the report issue
# targeted below; the flow captures its own image note.
#
# Run:
#   bash scripts/maestro/prepare-android-emulator.sh
#   ./scripts/maestro/reset-db.sh
#   maestro test .maestro/place-photo-on-issue.flow.yml
---
# Use the same clear-state launch recovery and current email/password auth as
# the canonical local regression journey. Module 01 finishes signed in on the
# projects list.
- runFlow: modules/01-auth.yaml

# Open reset-db's seeded project and draft report.
- extendedWaitUntil:
    visible:
      id: 'project-row-prj_aaaaaaaaaaaa'
    timeout: 15000
- tapOn:
    id: 'project-row-prj_aaaaaaaaaaaa'
- extendedWaitUntil:
    visible:
      id: 'btn-open-reports'
    timeout: 10000
- tapOn:
    id: 'btn-open-reports'
- extendedWaitUntil:
    visible:
      id: 'report-row-1'
    timeout: 15000
- tapOn:
    id: 'report-row-1'
- extendedWaitUntil:
    visible:
      id: 'input-note'
    timeout: 15000

# Capture and persist one photo through the current fixture-camera pipeline.
- runFlow: helpers/capture-one-photo-note.yaml

# Wait for the route-level auto-regeneration triggered by the uploaded note,
# then open the Report tab. Do not conditionally tap the Generate / Update
# label: the automatic mutation can finish between Maestro's condition check
# and tap. `btn-finalize-report` appears only after regeneration has settled.
# The canonical replay fixture contains issues, so placement-sheet-issue-0 is
# a deterministic target.
- extendedWaitUntil:
    visible:
      id: 'btn-tab-report'
    timeout: 15000
- runFlow: helpers/wait-for-auto-regeneration.yaml
- tapOn:
    id: 'btn-tab-report'
- extendedWaitUntil:
    visible:
      id: 'report-tab-live'
    timeout: 45000
- extendedWaitUntil:
    visible:
      id: 'report-view-.*'
    timeout: 15000

# Switch to the Report tab — the photo lands in the Unplaced photos
# card with a `Place into…` chip.
- scrollUntilVisible:
    element:
      id: 'btn-generate-report-photos-place-.*'
    direction: DOWN
    timeout: 60000
- assertVisible:
    id: 'generate-report-photos'
- assertVisible: 'Unplaced photos'
- assertVisible:
    id: 'btn-generate-report-photos-place-.*'

# Regenerate while the existing report remains visible. Placement controls must
# stay mounted to avoid layout shift, but they must be disabled because the
# backend response will replace report.body. The helper asserts the disabled
# state when the fixture response is slow enough for Maestro to observe it.
- runFlow: helpers/assert-report-generation-write-lock.yaml
- scrollUntilVisible:
    element:
      id: 'btn-generate-report-photos-place-.*'
    direction: DOWN
    timeout: 60000
- assertVisible:
    id: 'btn-generate-report-photos-place-.*'

# Tap the chip to open the placement sheet.
- tapOn:
    id: 'btn-generate-report-photos-place-.*'
- extendedWaitUntil:
    visible:
      id: 'placement-sheet'
    timeout: 10000

# Pick the first issue. The sheet's row testIDs follow the
# `placement-sheet-issue-{index}` convention from PhotoGroupPlacementSheet.
- assertVisible:
    id: 'placement-sheet-issue-0'
- tapOn:
    id: 'placement-sheet-issue-0'

# Sheet closes; the photo now renders under the first issue. The placement
# control was at the bottom of the report, so move back up to the issue card
# instead of requiring its off-screen accessibility node immediately.
- scrollUntilVisible:
    element:
      id: 'placed-photos-issue-0'
    direction: UP
    timeout: 60000
- assertVisible:
    id: 'placed-photos-issue-0'

# And the bottom Unplaced photos card is gone (or empty) — the only
# group has been moved out of it.
- assertNotVisible:
    id: 'btn-generate-report-photos-place-.*'

# Placement is an optimistic report write. Wait for its API response, report
# refetch, and version handoff before Finalize can consume that body version.
- runFlow: helpers/wait-for-auto-regeneration.yaml

# Finalized saved reports are read-only: the placed photo remains visible,
# but move/place/add-attachment/manual-edit affordances are absent.
- extendedWaitUntil:
    visible:
      id: 'btn-finalize-report'
    timeout: 15000
- tapOn:
    id: 'btn-finalize-report'
- extendedWaitUntil:
    visible:
      id: 'confirm-finalize'
    timeout: 8000
- tapOn:
    id: 'confirm-finalize'
- extendedWaitUntil:
    visible:
      id: 'btn-report-actions'
    timeout: 20000
- assertVisible:
    id: 'report-title-.*'
- scrollUntilVisible:
    element:
      id: 'placed-photos-issue-0'
    direction: DOWN
    timeout: 60000
- assertVisible:
    id: 'placed-photos-issue-0'
- assertNotVisible:
    id: 'btn-move-placed-photo-.*'
- assertNotVisible:
    id: 'btn-place-photo-.*'
- assertNotVisible:
    id: 'btn-add-attachments-issue-.*'
- assertNotVisible:
    id: 'btn-edit-issue-.*'
- assertNotVisible: 'Change placement'
- assertNotVisible: 'Place into…'
