appId: ${MAESTRO_APP_ID}
name: "16 — Profile screen: identity card + nav targets"
tags:
  - regression
  - profile
---
# Module 16 — Profile screen identity and navigation surface
#
# Covers:
#   - profile screen renders (`screen-profile`)
#   - identity card shows `profile-display-name` + `profile-email`
#   - the four primary nav targets are visible: account, usage,
#     sign-out, clear-cache (developer section)
#
# Pre-condition: test on profile screen (post-condition of module 15).
# Post-condition: test on profile screen, signed in.

- assertVisible:
    id: "screen-profile"
- assertVisible:
    id: "profile-display-name"
- assertVisible:
    id: "profile-email"
- assertVisible:
    id: "btn-open-account"
- assertVisible:
    id: "btn-open-usage"
- assertVisible:
    id: "btn-sign-out"
