appId: ${MAESTRO_APP_ID}
---
# Required env: ACTION_ID
# Companion to tap-dialog-action.yaml for the bottom Cancel row.
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            id: '${ACTION_ID}'
          timeout: 8000
      - tapOn:
          id: '${ACTION_ID}'

- runFlow:
    when:
      platform: iOS
    commands:
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          point: '50%,92%'
          waitToSettleTimeoutMs: 3000
