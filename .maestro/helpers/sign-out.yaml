appId: ${MAESTRO_APP_ID}
---
# sign-out.yaml — helper: sign the current user out
#
# Navigates to Profile tab → Developer section sign-out button,
# then waits for the sign-in screen.
#
# Pre-condition: app is logged in (Projects list or any (app) tab visible).
# Post-condition: sign-in screen (input-phone visible).
#
# Usage:
#   - runFlow: .maestro/helpers/sign-out.yaml
- tapOn:
    id: "btn-open-profile"
# On Android dev builds the floating "Tools" overlay button sits at the
# same top-right corner as `btn-open-profile`. Tapping `btn-open-profile`
# sometimes lands on the Tools button instead and pops the Expo
# dev-menu bottom sheet (which obscures the profile screen). Dismiss it
# if it's there and re-tap. On iOS or when the overlay isn't visible the
# runFlow skips and the canonical path continues.
- runFlow:
    when:
      visible: "Tools button"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd
      - tapOn:
          id: "btn-open-profile"
- extendedWaitUntil:
    visible:
      id: "btn-sign-out"
    timeout: 10000
- tapOn:
    id: "btn-sign-out"
- extendedWaitUntil:
    visible:
      id: "input-phone"
    timeout: 10000
