name: lint-typecheck

# Two-job pattern: a tiny `changes` job computes path-filter outputs,
# and `lint` (the required-check job) skips when no code paths
# changed. A skipped required check is treated as passing by branch
# protection — see
# https://docs.github.com/en/actions/using-jobs/using-conditions-to-control-job-execution
# Push events always run (we want full coverage on main / dev).

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      any-code: ${{ steps.paths.outputs.any-code }}
    steps:
      - uses: actions/checkout@v4
      - id: paths
        uses: ./.github/actions/changed-paths

  lint-typecheck:
    needs: changes
    if: needs.changes.outputs.any-code == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-monorepo
      - run: pnpm --filter @harpa/api-contract build
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Removal verification gates
        run: |
          bash scripts/check-no-supabase.sh
          bash scripts/check-no-unistyles.sh
          bash scripts/check-scope-tests.sh
          bash scripts/check-mobile-lib-flat.sh
      - name: CI shell policy tests
        # Self-tests and focused policy checks for shell glue. Keeps it
        # honest without spinning up the full integration matrix.
        run: |
          bash scripts/ci/__tests__/api-prod-policy.test.sh
          bash scripts/ci/__tests__/stress-viewer-policy.test.sh
          bash scripts/ci/__tests__/verify-readyz.test.sh
          bash scripts/ci/__tests__/mobile-ota-release-policy.test.sh
          bash scripts/ci/__tests__/check-no-maestro-point-taps.test.sh
          bash scripts/ci/__tests__/verify-deployed-sha.test.sh
          bash scripts/ci/__tests__/release-confidence-gates.test.sh
      - name: Shellcheck CI helpers
        # Lint shared shell scripts that ship in CI workflows. Catches
        # syntactic regressions (unquoted vars, broken loops, useless
        # echos) at PR time, before they reach dev/main and break a
        # post-merge-only workflow. Covers:
        #   - scripts/ci/*.sh           — shared CI helpers (verify-readyz, …)
        #   - scripts/journeys/*.sh     — post-deploy smoke scripts run
        #                                 from api-dev / api-prod
        # See docs/v4/arch-cicd-and-migrations.md "Workflow trigger matrix"
        # for the post-merge-only blind spot this guards.
        run: |
          shellcheck --version
          find scripts/ci scripts/journeys -name '*.sh' -print0 | xargs -0 shellcheck
