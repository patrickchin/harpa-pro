# Fly.io app config for @harpa/api (per-PR preview).
# Deployed by the `fly-preview` job in pr-preview.yml on every push to a PR
# that touches API code. App name is per-PR (`harpa-pro-api-pr-<n>`) and is
# passed via `flyctl deploy --app <name>`, so this config intentionally omits
# `app =`. Destroyed on PR close by the `fly-destroy` job.
#
# Trade-offs vs fly.dev.toml:
#   - `auto_stop_machines = "stop"` (not "suspend"): preview machines may
#     idle for hours between reviewer touches; full stop is cheaper and
#     cold-resume latency is acceptable for a manual review session.
#   - `min_machines_running = 0`: no idle floor — the app sleeps fully
#     between touches.
#   - Single VM, no HA. Previews don't need redundancy.
#   - No storage-worker process. The deploy arms upload-lease enforcement
#     but leaves DELETE /me disabled; preview data is disposable and must
#     not add one continuously billed worker per open PR.

primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Apply pending migrations inside the release machine — same mechanism as
  # dev/prod. Fly only promotes the new image to app machines if this exits 0,
  # so a broken migration aborts the rollout cleanly. No CI-side migrate step
  # for previews; release_command is the single source of truth.
  # See docs/v4/arch-cicd-and-migrations.md.
  release_command = "sh -c 'pnpm --filter @harpa/api db:migrate && pnpm --filter @harpa/api db:migrate:admin'"

[env]
  NODE_ENV = "production"
  PORT = "8787"
  HARPAPRO_PR_BUILD = "1"
  EMAIL_OTP_LIVE = "0"
  # Hosted PR site origins are dynamic and cannot satisfy the exact-origin
  # cookie policy. Browser admin auth is intentionally disabled in hosted
  # previews; the two-database Playwright flow is the preview gate.
  ADMIN_CORS_ORIGINS = "https://admin-preview.invalid"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 25
    hard_limit = 50

# Application DB readiness probe — same as dev/prod. Admin DB readiness is
# checked separately after deployment at /admin/readyz.
[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/readyz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
