name: pr-preview

# Per-PR ephemeral preview environment.
#
# Lifecycle (all keyed on PR number `${{ github.event.pull_request.number }}`):
#
#   on open / synchronize / reopen
#     ├─ neon-create        → app Neon `pr-<n>` from app `dev`
#     ├─ admin-neon-create  → admin Neon `pr-<n>` from admin `dev`
#     └─ fly-preview        → Fly app `harpa-pro-api-pr-<n>` (create + deploy)
#                       └─ release_command migrates both isolated branches
#                          and seeds configured test/demo password accounts
#                       └─ /readyz verified after deploy
#                       └─ /admin/readyz verified separately after deploy
#                       └─ both DB branches expire automatically after 7 days
#                       └─ sticky PR comment with the preview URL
#
#   on close (merged or not)
#     ├─ fly-destroy  → flyctl apps destroy harpa-pro-api-pr-<n>
#     ├─ neon-destroy       → app Neon branch deleted (after fly-destroy)
#     └─ admin-neon-destroy → admin Neon branch deleted (after fly-destroy)
#
# Optimisation: run for PRs that touch API code/migrations, the standalone
# admin site, or the office dashboard. Browser-app previews need an isolated
# API/Neon target for credentialed auth and live journeys. Docs / marketing /
# mobile-only PRs skip Neon and Fly. Close events always run so we never orphan
# resources created earlier in the PR's life.
#
# Changed-path and migration guards are credential-free. Privileged preview
# lifecycle jobs skip forks and Dependabot (no control-plane credentials are
# exposed to dependency-controlled code).

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  # One in-flight preview deploy per PR. A second push cancels the first —
  # the still-pending Fly deploy would have produced a stale image anyway.
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.paths.outputs.api }}
      admin: ${{ steps.paths.outputs.admin }}
      dashboard: ${{ steps.paths.outputs.dashboard }}
      api-migrations: ${{ steps.paths.outputs.api-migrations }}
    steps:
      - uses: actions/checkout@v7
      - id: paths
        uses: ./.github/actions/changed-paths

  # Migration-filename lint. Cheap; runs whenever an API or browser-app change
  # needs a preview so typos are caught at PR time, not prod time.
  guard:
    needs: changes
    if: >-
      github.event.action != 'closed' &&
      (needs.changes.outputs.api == 'true' || needs.changes.outputs.admin == 'true' || needs.changes.outputs.dashboard == 'true')
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v7
      - name: Lint migration filenames
        run: |
          set -euo pipefail
          MIG_DIR=packages/api/migrations
          MIGRATION_FILES=("$MIG_DIR"/*.sql)
          if [[ ! -e "${MIGRATION_FILES[0]}" ]]; then
            echo "::error::no .sql files in $MIG_DIR"
            exit 1
          fi
          MIGRATION_NAMES=("${MIGRATION_FILES[@]##*/}")
          bad=0
          for f in "${MIGRATION_NAMES[@]}"; do
            if ! echo "$f" | grep -qE '^[0-9]+_[a-z0-9_]+(\.notx)?\.sql$'; then
              echo "::error file=$MIG_DIR/$f::filename must match <digits>_<slug>[.notx].sql"
              bad=$((bad+1))
            fi
          done
          if [[ "$bad" -gt 0 ]]; then exit 1; fi
          dups=$(printf '%s\n' "${MIGRATION_NAMES[@]}" | awk -F_ '{print $1}' | sort | uniq -d)
          if [[ -n "$dups" ]]; then
            echo "::error::duplicate migration prefix(es): $dups"
            exit 1
          fi

          ADMIN_MIG_DIR=packages/api/admin-migrations
          ADMIN_MIGRATION_FILES=("$ADMIN_MIG_DIR"/*.sql)
          if [[ ! -e "${ADMIN_MIGRATION_FILES[0]}" ]]; then
            echo "::error::no .sql files in $ADMIN_MIG_DIR"
            exit 1
          fi
          ADMIN_MIGRATION_NAMES=("${ADMIN_MIGRATION_FILES[@]##*/}")
          bad=0
          for f in "${ADMIN_MIGRATION_NAMES[@]}"; do
            if ! echo "$f" | grep -qE '^[0-9]+_[a-z0-9_]+\.sql$'; then
              echo "::error file=$ADMIN_MIG_DIR/$f::filename must match <digits>_<slug>.sql"
              bad=$((bad+1))
            fi
          done
          if [[ "$bad" -gt 0 ]]; then exit 1; fi
          dups=$(printf '%s\n' "${ADMIN_MIGRATION_NAMES[@]}" | awk -F_ '{print $1}' | sort | uniq -d)
          if [[ -n "$dups" ]]; then
            echo "::error::duplicate admin migration prefix(es): $dups"
            exit 1
          fi

  # Create the per-PR Neon branch on open/sync. Migrations are NOT applied
  # here — they run inside the Fly preview's release machine in `fly-preview`
  # (matches dev/prod, single source of truth for migration application).
  neon-create:
    needs: [changes, guard]
    if: |
      github.event.action != 'closed' &&
      (needs.changes.outputs.api == 'true' || needs.changes.outputs.admin == 'true' || needs.changes.outputs.dashboard == 'true') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-monorepo
      - name: Create Neon branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        # `db:branch:create` is delete-and-recreate, so each push gets a
        # fresh branch from `dev` with a seven-day expiry. Migrations apply via
        # Fly release_command.
        run: pnpm --silent db:branch:create ${{ github.event.pull_request.number }} dev > /dev/null

  # Create the matching branch in the isolated admin project. It is based on
  # admin `dev` so preview credentials can be provisioned independently from
  # production while remaining stable across the preview fleet.
  admin-neon-create:
    needs: [changes, guard]
    if: |
      github.event.action != 'closed' &&
      (needs.changes.outputs.api == 'true' || needs.changes.outputs.admin == 'true' || needs.changes.outputs.dashboard == 'true') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-monorepo
      - name: Create admin Neon branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_ADMIN_PROJECT_ID }}
          NEON_DATABASE_NAME: harpa_admin
          NEON_ROLE_NAME: harpa_admin_owner
        run: |
          pnpm --silent db:branch:create \
            ${{ github.event.pull_request.number }} dev > /dev/null

  # Deploy a per-PR Fly app. Mirrors api-dev.yml's idioms: Doppler dev →
  # `flyctl secrets import --stage` → `flyctl deploy`. The PR's Neon URI
  # overrides DATABASE_URL so the release_command migrates the right branch.
  fly-preview:
    needs: [guard, neon-create, admin-neon-create]
    if: |
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # for the sticky preview-URL comment
    env:
      APP_NAME: harpa-pro-api-pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
        with: { lfs: true }
      - uses: ./.github/actions/setup-monorepo

      - name: Resolve Neon URI for this PR
        # `ensure` is read-or-create on a branch *name*. The branch was just
        # made by `neon-create`; ensure returns its URI without recreating.
        # Preview runtime deliberately shares this direct URI with migrations:
        # traffic is small and a second pooled credential adds little value.
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          URI=$(pnpm --silent db:branch:ensure pr-${{ github.event.pull_request.number }} dev)
          echo "::add-mask::$URI"
          echo "DATABASE_URL=$URI" >> "$GITHUB_ENV"

      - name: Resolve admin Neon URI for this PR
        # Direct URI only: db:migrate:admin takes a session advisory lock.
        # It is deliberately also the low-volume preview runtime URI.
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_ADMIN_PROJECT_ID }}
          NEON_DATABASE_NAME: harpa_admin
          NEON_ROLE_NAME: harpa_admin_owner
        run: |
          URI=$(pnpm --silent db:branch:ensure pr-${{ github.event.pull_request.number }} dev)
          echo "::add-mask::$URI"
          echo "ADMIN_DATABASE_URL=$URI" >> "$GITHUB_ENV"

      - uses: superfly/flyctl-actions/setup-flyctl@1.6

      - name: Ensure Fly app exists
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        # `flyctl status` exits non-zero if the app doesn't exist; create it
        # in that case. Idempotent across PR re-pushes.
        run: |
          if ! flyctl status -a "$APP_NAME" >/dev/null 2>&1; then
            flyctl apps create "$APP_NAME" --org personal
          fi

      - uses: dopplerhq/cli-action@v4

      - name: Stage Fly secrets from Doppler (with PR-specific URLs)
        # Same filter as api-dev.yml; replace database and auth URLs from
        # Doppler with the PR-specific values and exact stable Pages origin.
        # `--stage` defers activation; the subsequent deploy flips them on.
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_DEV }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          {
            doppler secrets download --no-file --format env \
              | grep -vE '^(DOPPLER_|NEON_|FLY_|CLOUDFLARE_|PUBLIC_|EXPO_PUBLIC_|PAGES_PROJECT|PORT|NODE_ENV|ADMIN_EMAIL|DATABASE_URL=|ADMIN_DATABASE_URL=|ADMIN_CORS_ORIGINS=|BETTER_AUTH_URL=)'
            echo "DATABASE_URL=$DATABASE_URL"
            echo "ADMIN_DATABASE_URL=$ADMIN_DATABASE_URL"
            echo "ADMIN_CORS_ORIGINS=https://pr-${{ github.event.pull_request.number }}.harpa-pro-admin.pages.dev"
            echo "BETTER_AUTH_URL=https://harpa-pro-api-pr-${{ github.event.pull_request.number }}.fly.dev"
          } | flyctl secrets import --stage --app "$APP_NAME"

      - name: Deploy to Fly.io (preview)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          MIGRATION_FILES=(packages/api/migrations/*.sql)
          if [[ ! -e "${MIGRATION_FILES[0]}" ]]; then
            echo "ERROR: no .sql files in packages/api/migrations" >&2
            exit 1
          fi
          HEAD=$(printf '%s\n' "${MIGRATION_FILES[@]##*/}" | LC_ALL=C sort | tail -1)
          ADMIN_MIGRATION_FILES=(packages/api/admin-migrations/*.sql)
          if [[ ! -e "${ADMIN_MIGRATION_FILES[0]}" ]]; then
            echo "ERROR: no .sql files in packages/api/admin-migrations" >&2
            exit 1
          fi
          ADMIN_HEAD=$(printf '%s\n' "${ADMIN_MIGRATION_FILES[@]##*/}" | LC_ALL=C sort | tail -1)
          GIT_COMMIT=$(git rev-parse HEAD)
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "deploy: app=$APP_NAME head=$HEAD admin_head=$ADMIN_HEAD commit=$GIT_COMMIT"
          flyctl deploy \
            --app "$APP_NAME" \
            --config infra/fly/fly.preview.toml \
            --dockerfile infra/fly/Dockerfile \
            --build-arg "MIGRATIONS_REQUIRED_HEAD=$HEAD" \
            --build-arg "ADMIN_MIGRATIONS_REQUIRED_HEAD=$ADMIN_HEAD" \
            --build-arg "GIT_COMMIT=$GIT_COMMIT" \
            --build-arg "BUILD_TIME=$BUILD_TIME" \
            --remote-only
          # Preview has no always-on storage worker: enforce leases after
          # rolling-deploy grace, but keep DELETE /me fail-closed.
          STORAGE_LEASE_ROLLOUT_GRACE_SEC=330 \
          STORAGE_ACCOUNT_DELETE_ENABLED=false \
            pnpm --filter @harpa/api storage:arm-leases

      - name: Verify /readyz
        # Per-PR Fly apps run with auto-stop + min_machines_running=0,
        # same as dev. Share scripts/ci/verify-readyz.sh so cold-start
        # tolerance stays identical across api-dev / api-prod / preview.
        env:
          READYZ_URL: https://${{ env.APP_NAME }}.fly.dev/readyz
        run: bash scripts/ci/verify-readyz.sh

      - name: Verify /admin/readyz
        # Post-deploy only: admin health must not gate application routing.
        env:
          READYZ_URL: https://${{ env.APP_NAME }}.fly.dev/admin/readyz
        run: bash scripts/ci/verify-readyz.sh

      - name: Post preview URL as sticky PR comment
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: fly-preview
          message: |
            🚀 **API preview deployed**

            - URL: <https://${{ env.APP_NAME }}.fly.dev>
            - Readyz: <https://${{ env.APP_NAME }}.fly.dev/readyz>
            - Admin readyz: <https://${{ env.APP_NAME }}.fly.dev/admin/readyz>
            - Admin origin: <https://pr-${{ github.event.pull_request.number }}.harpa-pro-admin.pages.dev>
            - Dashboard origin: <https://pr-${{ github.event.pull_request.number }}.harpa-pro-dashboard.pages.dev>
            - App DB: Neon branch `pr-${{ github.event.pull_request.number }}`
            - Admin DB: Neon branch `pr-${{ github.event.pull_request.number }}`
            - Password accounts: configured test/demo groups seeded by the release command
            - Commit: `${{ github.event.pull_request.head.sha }}`

            To point a dev/preview mobile build at this preview, call
            `setApiBaseUrlOverride("https://${{ env.APP_NAME }}.fly.dev")`
            from the in-app dev menu (`lib/api/base-url.ts`).

            This app is automatically destroyed when the PR closes.

  # Destroy the Fly preview app on PR close. Runs before neon-destroy so the
  # release_command / readyz on a now-deleted DB doesn't error-spam during
  # teardown. `|| true` so a missing app (docs-only PR, or already destroyed)
  # is a no-op.
  fly-destroy:
    if: |
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
      - name: Destroy Fly preview app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl apps destroy "harpa-pro-api-pr-${{ github.event.pull_request.number }}" --yes || true

  # Delete the per-PR Neon branch on close. `if: always()` + `needs:
  # fly-destroy` so a failed Fly destroy still cleans up Neon (worst case
  # we orphan a Fly app, which a future cron can sweep — losing the Neon
  # branch is the more expensive surface).
  neon-destroy:
    needs: [fly-destroy]
    if: |
      always() &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-monorepo
      - name: Delete Neon branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: pnpm db:branch:delete ${{ github.event.pull_request.number }}

  # Delete the matching branch from the independent admin project. This runs
  # alongside the app DB cleanup after the Fly app teardown completes.
  admin-neon-destroy:
    needs: [fly-destroy]
    if: |
      always() &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-monorepo
      - name: Delete admin Neon branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_ADMIN_PROJECT_ID }}
          NEON_DATABASE_NAME: harpa_admin
          NEON_ROLE_NAME: harpa_admin_owner
        run: pnpm db:branch:delete ${{ github.event.pull_request.number }}
