appId: ${MAESTRO_APP_ID}
name: "04 — Members: bob sees project and can edit as editor"
tags:
  - regression
  - members
---
# Module 04 — Member permissions (editor)
#
# Covers:
#   - sign out alice → sign in bob
#   - bob sees the project in his list (alice invited him)
#   - bob opens the project home
#   - bob's role badge shows "Editor"
#   - bob can access the reports screen (editor has reports access)
#   - sign out bob → sign in alice (restore for next module)
#
# Pre-condition: alice is signed in, PROJECT_SLUG is set.
# Post-condition: alice is signed in on project home.

# --- Switch to bob ---------------------------------------------------------
- runFlow: ../helpers/sign-out.yaml
- runFlow: ../helpers/sign-in-bob.yaml

# --- Bob sees the project ---------------------------------------------------
- assertVisible:
    id: "project-row-${PROJECT_SLUG}"
- tapOn:
    id: "project-row-${PROJECT_SLUG}"

# --- Bob's role badge shows Editor -----------------------------------------
- extendedWaitUntil:
    visible:
      id: "btn-project-edit"
    timeout: 10000
- assertVisible:
    text: "Editor"

# --- Bob can open reports ---------------------------------------------------
- tapOn:
    id: "btn-open-reports"
- extendedWaitUntil:
    visible:
      id: "btn-new-report"
    timeout: 10000
- tapOn:
    id: "btn-back"

# --- Switch back to alice ---------------------------------------------------
- tapOn:
    id: "btn-back"
- runFlow: ../helpers/sign-out.yaml
- runFlow: ../helpers/sign-in-alice.yaml

# --- Alice navigates back to project home ----------------------------------
- runFlow: ../helpers/open-project.yaml
