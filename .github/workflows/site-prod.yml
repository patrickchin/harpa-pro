name: site-prod

# Cloudflare Git publishes main. This workflow verifies the exact commit on
# the Pages hostname and both production custom domains.

on:
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      - 'packages/api-contract/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*'
      - 'turbo.json'
      - '.npmrc'
      - '.nvmrc'
      - 'patches/**'
      - 'lighthouserc.json'
      - 'scripts/ci/**'
      - '.github/**'
  workflow_dispatch: {}

concurrency:
  group: site-prod
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.paths.outputs.site }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: paths
        uses: ./.github/actions/pages-changes

  verify:
    needs: changes
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.deploy == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        origin:
          - https://harpa-pro.pages.dev
          - https://harpapro.com
          - https://www.harpapro.com
    steps:
      - uses: actions/checkout@v7
      - name: Verify Cloudflare Git deployment
        run: >-
          bash scripts/ci/verify-pages-deployment.sh
          --origin "${{ matrix.origin }}"
          --commit "${{ github.sha }}"
          --branch main
          --redirect-path /guides/getting-started
          --redirect-suffix /docs/guides/getting-started
