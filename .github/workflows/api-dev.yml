name: api-dev

# Build + deploy @harpa/api to Fly.io (harpa-pro-api-dev) on every
# push to `dev`. Mirrors api-prod.yml but targets the dev app, and
# applies pending Drizzle migrations to the long-lived Neon `dev`
# branch before the Fly deploy goes out.
#
# One-time setup:
#   flyctl apps create harpa-pro-api-dev
#   pnpm db:branch:ensure dev                      # creates the Neon branch
#   doppler configs tokens create ci-github --project harpa-pro --config dev
#     → set as repo secret DOPPLER_TOKEN_DEV
# Subsequent secret changes: edit in Doppler `dev` config, push to `dev`.
# This workflow stages the synced secrets onto Fly and the `flyctl deploy`
# step activates them — secrets and code ship together.

on:
  push:
    branches: [dev]
    paths:
      - "packages/api/**"
      - "packages/api-contract/**"
      - "packages/ai-fixtures/**"
      - "infra/fly/**"
      - "infra/neon/**"
      - ".github/workflows/api-dev.yml"
      - "pnpm-lock.yaml"
  # Allow manual re-deploys (e.g. rotating secrets without a code change).
  workflow_dispatch: {}

concurrency:
  group: api-dev
  cancel-in-progress: true # ok to cancel stale dev deploys

jobs:
  dev:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-monorepo

      - name: Ensure Neon `dev` branch
        # Idempotent: returns the existing URI or creates the branch on
        # first run. Critical that this NOT recreate on every deploy —
        # `dev` is long-lived and holds seed data that R2 objects refer to.
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          URI=$(pnpm --silent db:branch:ensure dev)
          echo "::add-mask::$URI"
          echo "DATABASE_URL=$URI" >> "$GITHUB_ENV"

      - name: Apply pending migrations to Neon `dev`
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm --filter @harpa/api db:migrate

      - uses: superfly/flyctl-actions/setup-flyctl@1.5

      - uses: dopplerhq/cli-action@v3

      - name: Sync Fly secrets from Doppler
        # Pulls the `dev` config and stages it onto the Fly app. Filters
        # out vars that don't belong on Fly (Doppler/Neon/CF/build-time
        # PUBLIC_* / EXPO_PUBLIC_*). `--stage` defers activation; the
        # subsequent `flyctl deploy` is what flips them on, so secrets
        # + code ship in a single transaction.
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_DEV }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          doppler secrets download --no-file --format env \
            | grep -vE '^(DOPPLER_|NEON_|FLY_|CLOUDFLARE_|PUBLIC_|EXPO_PUBLIC_|PAGES_PROJECT|PORT|NODE_ENV|ADMIN_EMAIL)' \
            | flyctl secrets import --stage --app harpa-pro-api-dev

      - name: Deploy to Fly.io (dev)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          HEAD=$(ls packages/api/migrations | grep -E '\.sql$' | sort | tail -1)
          if [[ -z "$HEAD" ]]; then
            echo "ERROR: no .sql files in packages/api/migrations" >&2
            exit 1
          fi
          echo "deploy: MIGRATIONS_REQUIRED_HEAD=$HEAD"
          flyctl deploy \
            --config infra/fly/fly.dev.toml \
            --dockerfile infra/fly/Dockerfile \
            --build-arg "MIGRATIONS_REQUIRED_HEAD=$HEAD" \
            --remote-only

      - name: Verify /readyz (dev)
        run: |
          set -euo pipefail
          URL="${API_READY_URL_DEV:-https://harpa-pro-api-dev.fly.dev/readyz}"
          for i in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 5 "$URL"; then
              echo
              echo "readyz ok"
              exit 0
            fi
            echo "readyz attempt $i failed, retrying..."
            sleep 5
          done
          echo "readyz never returned 200 — investigate Fly logs" >&2
          exit 1
        env:
          API_READY_URL_DEV: ${{ vars.API_READY_URL_DEV }}

