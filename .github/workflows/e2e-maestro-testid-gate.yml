name: e2e-maestro-testid-gate

# Mobile/E2E check. Skips when neither mobile code nor Maestro flows changed.

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mobile: ${{ steps.paths.outputs.mobile }}
      workflows: ${{ steps.paths.outputs.workflows }}
    steps:
      - uses: actions/checkout@v4
      - id: paths
        uses: ./.github/actions/changed-paths

  testid-gate:
    needs: changes
    if: >-
      needs.changes.outputs.mobile == 'true' ||
      needs.changes.outputs.workflows == 'true' ||
      github.event_name == 'push'
    name: Maestro testID gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check Maestro testIDs exist in mobile source
        run: bash scripts/check-maestro-testids.sh

  metro-bundle:
    needs: changes
    if: >-
      needs.changes.outputs.mobile == 'true' ||
      needs.changes.outputs.workflows == 'true' ||
      github.event_name == 'push'
    name: Metro bundle leakage gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-monorepo
      - name: Export production-shaped mobile bundle
        run: pnpm --filter @harpa/mobile bundle:smoke

  maestro-smoke:
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      (needs.changes.outputs.mobile == 'true' ||
      needs.changes.outputs.workflows == 'true')
    name: Maestro Android launch smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      APP_VARIANT: development
      EXPO_PUBLIC_APP_VARIANT: development
      EXPO_PUBLIC_API_URL: http://localhost:8787
      EXPO_PUBLIC_USE_FIXTURES: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-monorepo
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            pnpm-lock.yaml
            apps/mobile/app.config.ts
            apps/mobile/package.json

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Generate Android project
        run: pnpm --filter @harpa/mobile exec expo prebuild --platform android --clean --no-install

      - name: Build Android debug APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleDebug --no-daemon -PreactNativeArchitectures=x86_64

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run bounded Maestro launch smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 300
          disable-animations: true
          script: bash scripts/ci/run-maestro-launch-smoke.sh

      - name: Upload Maestro diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-launch-smoke-diagnostics
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/metro.log
            ${{ runner.temp }}/maestro-debug
