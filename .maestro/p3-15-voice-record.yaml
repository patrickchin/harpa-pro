appId: com.harpa.pro
name: P3.15.6 voice note pipeline (fixture mode)
tags:
  - p3
  - voice
---
# End-to-end voice note flow exercising the full Phase A–F pipeline:
#
#   - Mic button on the input bar opens `VoiceRecorderModal`
#   - Inner Start → Save runs the fixture stub recorder (`expoAudioRecorder`
#     falls back to `fixtureRecorder` in fixture mode, producing a real
#     local m4a payload referenced by the queue)
#   - On Save, `useVoiceNotePipeline` enqueues the upload, calls the
#     aggregator `POST /reports/{report}/notes/voice`, and the
#     timeline renders a `VoiceNoteCard` with status pill → summary
#     + transcript once the canned fixture response lands
#
# Fixture mode (`docker compose up -d`) returns deterministic
# transcripts + summaries, so this flow can assert on visible
# strings.
#
# Pre-flight (same as core-end-to-end.yaml):
#   1. docker compose up -d
#   2. pnpm --filter @harpa/mobile start --dev-client
#   3. xcrun simctl privacy booted grant microphone com.harpa.pro
#   4. scripts/maestro/reset-db.sh

- launchApp:
    clearState: true
    clearKeychain: true
    stopApp: true
- waitForAnimationToEnd

# --- Sign in as the seeded Alice (+15550100100) ----------------------------
- extendedWaitUntil:
    visible:
      id: "input-phone"
    timeout: 15000
- tapOn:
    id: "input-phone"
- inputText: "+15550100100"
- tapOn:
    id: "btn-login-send-code"
- extendedWaitUntil:
    visible:
      id: "input-otp"
    timeout: 10000
- tapOn:
    id: "input-otp"
- inputText: "000000"
- extendedWaitUntil:
    visible:
      id: "btn-verify-code"
    timeout: 5000
- tapOn:
    id: "btn-verify-code"

# --- Open seeded project → reports → seeded draft (Generate screen) -------
- extendedWaitUntil:
    visible:
      id: "project-row-0"
    timeout: 15000
- tapOn:
    id: "project-row-0"
- extendedWaitUntil:
    visible:
      id: "btn-open-reports"
    timeout: 10000
- tapOn:
    id: "btn-open-reports"
- extendedWaitUntil:
    visible:
      id: "report-row-draft-0"
    timeout: 10000
- tapOn:
    id: "report-row-draft-0"

# --- Confirm we landed on Generate, then open the voice recorder -----------
- extendedWaitUntil:
    visible:
      id: "input-note-container"
    timeout: 15000
- tapOn:
    id: "btn-record-start"
- extendedWaitUntil:
    visible:
      id: "voice-recorder-modal"
    timeout: 5000

# --- Record + save via the modal's inner controls --------------------------
- tapOn:
    id: "voice-recorder-start"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "voice-recorder-duration"
    timeout: 5000
- tapOn:
    id: "voice-recorder-save"
- extendedWaitUntil:
    notVisible:
      id: "voice-recorder-modal"
    timeout: 10000

# --- VoiceNoteCard appears on the timeline once the pipeline lands ---------
# `useVoiceNotePipeline` injects a synthetic in-flight entry into the
# draft timeline so the card is visible immediately; the fixture
# aggregator response populates summary + transcript a few hundred
# ms later. `note-timeline` is the timeline container; the voice
# row's `sourceIndex` matches its position in `timeline.items` (the
# seeded text note is at index 0, so the voice note lands at 1; if
# the seeded note has been deleted in a prior run it lands at 0 —
# we accept either position via the parallel waits below).
- extendedWaitUntil:
    visible:
      id: "note-timeline"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "btn-voice-play-0"
    timeout: 15000
    optional: true
- extendedWaitUntil:
    visible:
      id: "btn-voice-play-1"
    timeout: 15000
    optional: true

# --- Assert summary + transcript landed (fixture canned text) --------------
# The fixture aggregator response includes both fields; we don't pin
# the exact string here because fixture content may evolve, but we
# do require the transcript expander to render (only present when
# transcript is non-empty).
- runFlow:
    when:
      visible:
        id: "btn-voice-transcript-toggle-0"
    commands:
      - tapOn:
          id: "btn-voice-transcript-toggle-0"
      - extendedWaitUntil:
          visible:
            id: "voice-transcript-0"
          timeout: 5000
- runFlow:
    when:
      visible:
        id: "btn-voice-transcript-toggle-1"
    commands:
      - tapOn:
          id: "btn-voice-transcript-toggle-1"
      - extendedWaitUntil:
          visible:
            id: "voice-transcript-1"
          timeout: 5000

- takeScreenshot: p3-15-voice-record
