name: cli

# Skips when no CLI-relevant paths changed (CLI depends on
# packages/api + packages/api-contract).

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.paths.outputs.cli }}
    steps:
      - uses: actions/checkout@v4
      - id: paths
        uses: ./.github/actions/changed-paths

  cli:
    needs: changes
    if: needs.changes.outputs.cli == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      AI_FIXTURE_MODE: replay
      R2_FIXTURE_MODE: replay
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-monorepo
      - run: pnpm --filter @harpa/api-contract build
      - run: pnpm --filter @harpa/cli typecheck
      - run: pnpm --filter @harpa/cli lint
      - run: pnpm --filter @harpa/cli test
      - run: bash scripts/check-cli-help-drift.sh
      - run: pnpm --filter @harpa/cli test:integration
