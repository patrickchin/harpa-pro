appId: ${MAESTRO_APP_ID}
---
# assert-report-generation-write-lock.yaml - helper: while an existing
# generated draft is regenerating, the report stays visible and edit/finalize
# controls remain mounted but disabled.
#
# Pre-condition: Generate screen is on the Report tab with a generated report
# visible and `btn-generate-update-report` available.
# Post-condition: Regeneration has settled and the generated report is visible.

- assertVisible:
    id: 'report-view-.*'
- assertVisible:
    id: 'btn-generate-update-report'
- tapOn:
    id: 'btn-generate-update-report'
- tapOn:
    id: 'btn-tab-report'
- extendedWaitUntil:
    visible: 'Updating the draft with your newest notes...'
    timeout: 15000

# The existing report content must remain mounted while backend generation is
# replacing report.body; only write controls should be locked.
- assertVisible:
    id: 'report-view-.*'
- assertVisible:
    id: 'btn-generate-update-report'
    enabled: false
- assertVisible:
    id: 'btn-finalize-report'
    enabled: false
- scrollUntilVisible:
    element:
      id: 'btn-edit-meta'
    direction: UP
    timeout: 10000
    optional: true
- scrollUntilVisible:
    element:
      id: 'btn-edit-meta'
    direction: DOWN
    timeout: 10000
    optional: true
- assertVisible:
    id: 'btn-edit-meta'
    enabled: false

- extendedWaitUntil:
    notVisible: 'Updating the draft with your newest notes...'
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: 'report-view-.*'
    timeout: 15000
